<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>쿼터뷰 타이쿤 필드해금 UI & 애니메이션 쇼케이스</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #D7E5B2;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .game-font {
      font-family: 'Jua', 'Noto Sans KR', sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .mode-btn {
      transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .mode-btn:active {
      transform: scale(0.94);
    }
    .mode-btn.active {
      background: linear-gradient(180deg, #8CE02C 0%, #68B817 100%);
      color: #FFFFFF;
      border-color: #3B2314;
      box-shadow: 0 4px 0 #3B2314, 0 8px 16px rgba(59, 35, 20, 0.25);
      transform: translateY(-2px);
    }
    .mode-btn:not(.active) {
      background: #FAF5EB;
      color: #3B2314;
      border-color: #3B2314;
      box-shadow: 0 3px 0 #3B2314;
    }
    .mode-btn:not(.active):hover {
      background: #FFFDF8;
      transform: translateY(-1px);
    }
    .action-btn {
      transition: all 0.15s ease;
      border: 2.5px solid #3B2314;
      box-shadow: 0 3px 0 #3B2314;
    }
    .action-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #3B2314;
    }
  </style>
</head>
<body class="relative w-full h-full">

  <!-- 메인 게임 캔버스 -->
  <canvas id="gameCanvas"></canvas>

  <!-- 상단 HUD 바 -->
  <div class="fixed top-0 left-0 right-0 z-20 pointer-events-none p-3 sm:p-4 flex flex-wrap items-start justify-between gap-2">
    <!-- 좌측: 상태 및 조작 안내 카드 -->
    <div class="pointer-events-auto bg-[#FAF5EB]/95 backdrop-blur-sm border-[3px] border-[#3B2314] rounded-2xl px-3.5 py-2.5 shadow-[0_4px_0_#3B2314] max-w-xs sm:max-w-sm">
      <div class="flex items-center gap-2">
        <span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-[#7AC71E] text-white text-xs font-black border-2 border-[#3B2314]">!</span>
        <h1 class="game-font text-base sm:text-lg text-[#3B2314] tracking-tight">필드 해금 애니메이션 프로토타입</h1>
      </div>
      <p class="text-[11px] sm:text-xs text-[#6A4A35] font-medium mt-1 leading-relaxed">
        <span class="font-bold text-[#3B2314]">WASD / 방향키</span> 또는 <span class="font-bold text-[#3B2314]">화면 클릭·드래그</span>로 캐릭터를 이동해 <span class="inline-block px-1.5 py-0.2 bg-[#F7E3BA] rounded font-bold text-[#3B2314]">새 구역</span> 발판 위에 서세요!
      </p>
      <div class="mt-2 flex items-center gap-2 text-xs">
        <div class="flex items-center gap-1.5 bg-[#F7E3BA] border-2 border-[#3B2314] rounded-full px-2.5 py-0.5 font-extrabold text-[#3B2314]">
          <span>💵</span>
          <span id="hudCashText">보유 자금: ∞</span>
        </div>
        <div id="statusBadge" class="px-2.5 py-0.5 rounded-full bg-[#FFE8A3] border-2 border-[#3B2314] font-bold text-[#3B2314]">
          대기 중 (미해금)
        </div>
      </div>
    </div>

    <!-- 우측: 빠른 테스트 & 리셋 & HTML 저장 컨트롤 -->
    <div class="pointer-events-auto flex flex-wrap items-center gap-2">
      <button id="btnInstantUnlock" class="action-btn bg-[#FFD028] hover:bg-[#FFDA4D] text-[#3B2314] font-extrabold text-xs sm:text-sm px-3.5 py-2 rounded-xl flex items-center gap-1.5 cursor-pointer">
        <span>⚡</span>
        <span>즉시 해금 연출</span>
      </button>
      <button id="btnReset" class="action-btn bg-[#FAF5EB] hover:bg-white text-[#3B2314] font-extrabold text-xs sm:text-sm px-3.5 py-2 rounded-xl flex items-center gap-1.5 cursor-pointer">
        <span>🔄</span>
        <span>다시 잠그기</span>
      </button>
      <button id="btnSound" class="action-btn bg-[#FAF5EB] hover:bg-white text-[#3B2314] font-extrabold text-xs sm:text-sm px-2.5 py-2 rounded-xl cursor-pointer" title="효과음 켜기/끄기">
        🔊
      </button>
      <button id="btnDownload" class="action-btn bg-[#3B2314] hover:bg-[#52321E] text-[#FAF5EB] font-bold text-xs sm:text-sm px-3 py-2 rounded-xl flex items-center gap-1 cursor-pointer" title="현재 HTML 파일 저장">
        <span>💾</span>
        <span class="hidden sm:inline">HTML 저장</span>
      </button>
    </div>
  </div>

  <!-- 하단: 5종 해금 애니메이션 선택 컨트롤 바 -->
  <div class="fixed bottom-0 left-0 right-0 z-20 pointer-events-none p-3 sm:p-5 flex flex-col items-center">
    <div class="pointer-events-auto bg-[#FAF5EB]/95 backdrop-blur-md border-[3px] border-[#3B2314] rounded-3xl p-2.5 sm:p-3 shadow-[0_6px_0_#3B2314] max-w-full">
      <div class="flex items-center justify-between px-2 mb-2">
        <span class="text-[11px] sm:text-xs font-extrabold text-[#6A4A35] tracking-wide">✨ 해금 애니메이션 스타일 선택 (5종)</span>
        <span id="modeDescText" class="text-[11px] sm:text-xs font-bold text-[#4D8A10]">소단위 타일이 물결치듯 생성되며 해금</span>
      </div>
      <div class="flex flex-wrap justify-center gap-1.5 sm:gap-2" id="modeButtonsContainer">
        <button data-mode="wave" class="mode-btn active border-[2.5px] rounded-2xl px-3 sm:px-4 py-2 text-xs sm:text-sm font-extrabold flex items-center gap-1.5 cursor-pointer">
          <span>🌊</span>
          <span>1. 타일 파도형식</span>
        </button>
        <button data-mode="expand" class="mode-btn border-[2.5px] rounded-2xl px-3 sm:px-4 py-2 text-xs sm:text-sm font-extrabold flex items-center gap-1.5 cursor-pointer">
          <span>↔️</span>
          <span>2. 필드확장</span>
        </button>
        <button data-mode="circle" class="mode-btn border-[2.5px] rounded-2xl px-3 sm:px-4 py-2 text-xs sm:text-sm font-extrabold flex items-center gap-1.5 cursor-pointer">
          <span>⭕</span>
          <span>3. 원형 확산</span>
        </button>
        <button data-mode="drop" class="mode-btn border-[2.5px] rounded-2xl px-3 sm:px-4 py-2 text-xs sm:text-sm font-extrabold flex items-center gap-1.5 cursor-pointer">
          <span>⬇️</span>
          <span>4. 필드 낙하</span>
        </button>
        <button data-mode="bounce" class="mode-btn border-[2.5px] rounded-2xl px-3 sm:px-4 py-2 text-xs sm:text-sm font-extrabold flex items-center gap-1.5 cursor-pointer">
          <span>🫧</span>
          <span>5. 튕김</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 토스트 메시지 박스 (alert 대체용) -->
  <div id="toastBox" class="fixed top-20 left-1/2 -translate-x-1/2 z-30 pointer-events-none opacity-0 transition-opacity duration-200 bg-[#3B2314] text-[#FAF5EB] text-xs sm:text-sm font-bold px-4 py-2 rounded-full shadow-lg">
    안내 메시지
  </div>

  <script>
    /**
     * 쿼터뷰(아이소메트릭) 타이쿤 게임 필드해금 UI & 5종 애니메이션 프로토타입
     * - 60fps HTML5 Canvas 기반 아이소메트릭 렌더링
     * - 해금 발판 게이지 충전 + 지폐 비행 파티클
     * - 자물쇠 걸이(Shackle) 열림 및 소멸 연출
     * - 5가지 해금 애니메이션 (타일 파도 / 필드 확장 / 원형 확산 / 필드 낙하 / 튕김)
     */

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI 요소 참조
    const statusBadge = document.getElementById('statusBadge');
    const modeDescText = document.getElementById('modeDescText');
    const toastBox = document.getElementById('toastBox');
    const btnInstantUnlock = document.getElementById('btnInstantUnlock');
    const btnReset = document.getElementById('btnReset');
    const btnSound = document.getElementById('btnSound');
    const btnDownload = document.getElementById('btnDownload');
    const modeButtons = document.querySelectorAll('.mode-btn');

    // 모드별 설명 문구
    const MODE_DESCRIPTIONS = {
      wave: '소단위 타일이 물결치듯 순차적으로 튀어오르며 해금',
      expand: '기존 필드의 경계면이 해금 구역 끝까지 주욱 늘어나며 해금',
      circle: '플레이어 위치 기준 원형 파장이 퍼지며 원형 선에 맞춰 필드가 드러남',
      drop: '미해금 구역 크기의 거대한 필드가 하늘에서 낙하해 쿵! 착지',
      bounce: '구역 중앙에서 필드가 탄성 있게 튕겨 나오듯 팝업되며 해금'
    };

    // 사운드 효과 (Web Audio API 절차적 합성 - 외부 파일 불필요)
    let soundEnabled = true;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, type = 'sine', duration = 0.1, vol = 0.08, slideTo = null) {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if (slideTo) {
          osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
        }
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        // 오디오 차단 환경 무시
      }
    }

    function playCashTick(progress) {
      const baseFreq = 460 + progress * 420;
      playTone(baseFreq, 'triangle', 0.07, 0.06, baseFreq * 1.18);
    }

    function playLockPopSound() {
      playTone(520, 'sine', 0.12, 0.12, 880);
      setTimeout(() => playTone(780, 'triangle', 0.16, 0.1, 1180), 90);
    }

    function playUnlockFanfare(mode) {
      if (mode === 'drop') {
        setTimeout(() => playTone(140, 'sawtooth', 0.28, 0.14, 48), 320);
      } else {
        playTone(523.25, 'triangle', 0.16, 0.1);
        setTimeout(() => playTone(659.25, 'triangle', 0.16, 0.1), 80);
        setTimeout(() => playTone(783.99, 'triangle', 0.24, 0.11), 160);
        setTimeout(() => playTone(1046.5, 'sine', 0.35, 0.12), 250);
      }
    }

    // 토스트 알림
    let toastTimer = null;
    function showToast(msg) {
      toastBox.textContent = msg;
      toastBox.classList.remove('opacity-0');
      toastBox.classList.add('opacity-100');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastBox.classList.remove('opacity-100');
        toastBox.classList.add('opacity-0');
      }, 1800);
    }

    // =========================================================================
    // 아이소메트릭 월드 좌표 및 설정
    // =========================================================================
    const BASE_TILE_W = 46; // 아이소메트릭 반폭
    const BASE_TILE_H = 23; // 아이소메트릭 반높이 (2:1 쿼터뷰)
    const SLAB_THICKNESS = 18; // 지형 플랫폼 두께

    // 월드 영역 정의 (그리드 단위)
    // 기존 해금된 필드: x [-4, 1], y [-2.5, 2.5] (5 x 5 크기)
    const UNLOCKED_RECT = { x1: -4, y1: -2.5, x2: 1, y2: 2.5 };
    // 새로 해금할 필드: x [1, 6], y [-2.5, 2.5] (5 x 5 크기)
    const LOCKED_RECT = { x1: 1, y1: -2.5, x2: 6, y2: 2.5 };

    // 해금 발판 위치 및 크기 (기존 필드 우측 경계 바로 안쪽)
    const PAD_CONFIG = {
      x: -0.1,
      y: 0,
      size: 1.65, // 월드 단위 정사각형
      cost: 200
    };

    // 게임 상태
    const state = {
      width: 0,
      height: 0,
      dpr: 1,
      scale: 1,
      originX: 0,
      originY: 0,

      // 선택된 애니메이션 모드: 'wave' | 'expand' | 'circle' | 'drop' | 'bounce'
      animMode: 'wave',

      // 해금 진행 상태: 'locked' | 'unlocking_lock' | 'animating_field' | 'unlocked'
      unlockPhase: 'locked',
      padProgress: 0, // 0 ~ 1
      cashSoundAccum: 0,
      cashParticleAccum: 0,

      // 자물쇠 애니메이션 타이머
      lockTimer: 0,
      shackleLift: 0, // 자물쇠 걸이 위로 열리는 높이
      lockScale: 1,
      lockAlpha: 1,

      // 필드 해금 애니메이션 타이머 & 파라미터
      fieldAnimTimer: 0,
      fieldAnimDuration: 1.15,
      circleOrigin: { x: -0.1, y: 0 }, // 원형 확산 시작점 (플레이어 위치)
      cameraShake: 0,

      // 플레이어 상태
      player: {
        x: -2.2,
        y: 0.4,
        targetX: null,
        targetY: null,
        speed: 3.6,
        walkCycle: 0,
        facing: 1, // 1: 우측, -1: 좌측
        radius: 0.32
      },

      // 키보드 입력
      keys: {},

      // 시각 이펙트 파티클 & 플로팅 텍스트
      particles: [],
      floatingTexts: [],
      ripples: []
    };

    // 화면 리사이즈 및 반응형 스케일 계산
    function resizeCanvas() {
      state.dpr = Math.min(window.devicePixelRatio || 1, 2);
      state.width = window.innerWidth;
      state.height = window.innerHeight;
      canvas.width = Math.floor(state.width * state.dpr);
      canvas.height = Math.floor(state.height * state.dpr);

      // 전체 월드(x: -4..6 => 폭 10, y: -2.5..2.5 => 폭 5)가 화면에 예쁘게 들어오도록 스케일 조정
      const minDim = Math.min(state.width, state.height * 1.25);
      state.scale = Math.max(0.62, Math.min(1.38, minDim / 760));

      // 월드 중심(x = 1.0, y = 0.0)이 화면 중앙에 오도록 원점 설정
      const worldCenterX = 1.0;
      const worldCenterY = 0.0;
      const tw = BASE_TILE_W * state.scale;
      const th = BASE_TILE_H * state.scale;
      state.originX = state.width * 0.5 - (worldCenterX - worldCenterY) * tw;
      state.originY = state.height * 0.49 - (worldCenterX + worldCenterY) * th;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // =========================================================================
    // 좌표 변환 유틸리티 (World <-> Screen)
    // =========================================================================
    function isoToScreen(wx, wy, wz = 0) {
      const tw = BASE_TILE_W * state.scale;
      const th = BASE_TILE_H * state.scale;
      return {
        x: state.originX + (wx - wy) * tw,
        y: state.originY + (wx + wy) * th - wz * state.scale
      };
    }

    function screenToIso(sx, sy) {
      const tw = BASE_TILE_W * state.scale;
      const th = BASE_TILE_H * state.scale;
      const dx = (sx - state.originX) / tw;
      const dy = (sy - state.originY) / th;
      return {
        x: (dx + dy) * 0.5,
        y: (dy - dx) * 0.5
      };
    }

    // 이징(Easing) 함수 모음
    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }
    function easeOutBack(t, s = 1.65) {
      const c3 = s + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
    }
    function easeOutElastic(t) {
      if (t === 0 || t === 1) return t;
      const c4 = (2 * Math.PI) / 3;
      return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
    }

    // =========================================================================
    // 입력 처리 (키보드 + 마우스/터치 클릭 및 드래그 이동)
    // =========================================================================
    window.addEventListener('keydown', (e) => {
      state.keys[e.code] = true;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
        state.player.targetX = null;
        state.player.targetY = null;
      }
    });

    window.addEventListener('keyup', (e) => {
      state.keys[e.code] = false;
    });

    let isPointerDown = false;
    function handlePointerMoveToWorld(clientX, clientY, spawnRipple = false) {
      initAudio();
      const rect = canvas.getBoundingClientRect();
      const sx = clientX - rect.left;
      const sy = clientY - rect.top;
      const worldPos = screenToIso(sx, sy);

      // 이동 가능한 영역 제한 (해금 여부에 따라 확장)
      const maxX = (state.unlockPhase === 'unlocked') ? LOCKED_RECT.x2 - 0.35 : UNLOCKED_RECT.x2 - 0.3;
      const clampedX = Math.max(UNLOCKED_RECT.x1 + 0.35, Math.min(maxX, worldPos.x));
      const clampedY = Math.max(UNLOCKED_RECT.y1 + 0.35, Math.min(UNLOCKED_RECT.y2 - 0.35, worldPos.y));

      state.player.targetX = clampedX;
      state.player.targetY = clampedY;

      if (spawnRipple) {
        state.ripples.push({
          x: clampedX,
          y: clampedY,
          life: 0,
          maxLife: 0.45
        });
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      isPointerDown = true;
      handlePointerMoveToWorld(e.clientX, e.clientY, true);
    });

    window.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;
      handlePointerMoveToWorld(e.clientX, e.clientY, false);
    });

    window.addEventListener('pointerup', () => {
      isPointerDown = false;
    });

    // =========================================================================
    // UI 버튼 이벤트 연결
    // =========================================================================
    modeButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        const selected = btn.dataset.mode;
        state.animMode = selected;
        modeButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        modeDescText.textContent = MODE_DESCRIPTIONS[selected];

        // 이미 해금된 상태라면 해당 애니메이션을 바로 미리보기로 재생해줌!
        if (state.unlockPhase === 'unlocked') {
          triggerUnlockSequence(true);
        } else {
          showToast(`모드 변경: ${btn.innerText.trim()}`);
        }
      });
    });

    btnInstantUnlock.addEventListener('click', () => {
      initAudio();
      // 플레이어를 발판 위로 이동시키고 즉시 해금 발동
      state.player.x = PAD_CONFIG.x;
      state.player.y = PAD_CONFIG.y;
      state.player.targetX = null;
      state.player.targetY = null;
      state.padProgress = 1;
      triggerUnlockSequence(false);
    });

    btnReset.addEventListener('click', () => {
      resetSimulation();
      showToast('필드가 다시 잠겼습니다. 발판 위로 이동해보세요!');
    });

    btnSound.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      btnSound.textContent = soundEnabled ? '🔊' : '🔇';
      showToast(soundEnabled ? '효과음 켜짐' : '효과음 꺼짐');
    });

    // HTML 파일 단일 저장 기능
    btnDownload.addEventListener('click', () => {
      const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'tycoon_field_unlock_showcase.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('HTML 파일이 다운로드되었습니다!');
    });

    function resetSimulation() {
      state.unlockPhase = 'locked';
      state.padProgress = 0;
      state.lockTimer = 0;
      state.shackleLift = 0;
      state.lockScale = 1;
      state.lockAlpha = 1;
      state.fieldAnimTimer = 0;
      state.particles = [];
      state.floatingTexts = [];

      // 플레이어가 새 구역 안에 있었다면 기존 구역으로 복귀
      if (state.player.x > UNLOCKED_RECT.x2 - 0.35) {
        state.player.x = -1.6;
        state.player.y = 0.2;
        state.player.targetX = null;
        state.player.targetY = null;
      }
      updateStatusBadge();
    }

    function triggerUnlockSequence(skipLockIfAlreadyOpen = false) {
      state.circleOrigin = { x: state.player.x, y: state.player.y };
      state.lockTimer = 0;
      state.shackleLift = 0;
      state.lockScale = 1;
      state.lockAlpha = 1;
      state.fieldAnimTimer = 0;

      // 애니메이션 종류별 재생 길이 미세 조정
      const durations = {
        wave: 1.25,
        expand: 0.95,
        circle: 1.15,
        drop: 0.95,
        bounce: 1.05
      };
      state.fieldAnimDuration = durations[state.animMode] || 1.1;

      if (skipLockIfAlreadyOpen) {
        // 모드 전환 시 필드 애니메이션만 즉시 재시연
        state.unlockPhase = 'animating_field';
        playUnlockFanfare(state.animMode);
      } else {
        state.unlockPhase = 'unlocking_lock';
        playLockPopSound();
        spawnSparkles(
          (LOCKED_RECT.x1 + LOCKED_RECT.x2) * 0.5,
          (LOCKED_RECT.y1 + LOCKED_RECT.y2) * 0.5,
          18,
          '#FFD028'
        );
      }
      updateStatusBadge();
    }

    function updateStatusBadge() {
      if (state.unlockPhase === 'locked') {
        if (state.padProgress > 0) {
          const pct = Math.floor(state.padProgress * 100);
          statusBadge.textContent = `해금 충전 중... ${pct}%`;
          statusBadge.className = 'px-2.5 py-0.5 rounded-full bg-[#B9F26D] border-2 border-[#3B2314] font-bold text-[#3B2314]';
        } else {
          statusBadge.textContent = '대기 중 (미해금)';
          statusBadge.className = 'px-2.5 py-0.5 rounded-full bg-[#FFE8A3] border-2 border-[#3B2314] font-bold text-[#3B2314]';
        }
      } else if (state.unlockPhase === 'unlocking_lock') {
        statusBadge.textContent = '🔓 자물쇠 해제!';
        statusBadge.className = 'px-2.5 py-0.5 rounded-full bg-[#FFD028] border-2 border-[#3B2314] font-bold text-[#3B2314]';
      } else if (state.unlockPhase === 'animating_field') {
        statusBadge.textContent = '✨ 필드 생성 중!';
        statusBadge.className = 'px-2.5 py-0.5 rounded-full bg-[#7AC71E] border-2 border-[#3B2314] font-bold text-white';
      } else {
        statusBadge.textContent = '✅ 새 구역 해금 완료!';
        statusBadge.className = 'px-2.5 py-0.5 rounded-full bg-[#7AC71E] border-2 border-[#3B2314] font-bold text-white';
      }
    }

    // =========================================================================
    // 파티클 & 이펙트 생성 함수
    // =========================================================================
    function spawnCashBill(fromX, fromY, toX, toY) {
      state.particles.push({
        type: 'cash',
        x: fromX,
        y: fromY,
        z: 28,
        startX: fromX,
        startY: fromY,
        endX: toX + (Math.random() - 0.5) * 0.5,
        endY: toY + (Math.random() - 0.5) * 0.5,
        life: 0,
        maxLife: 0.34,
        rot: (Math.random() - 0.5) * 1.2
      });
    }

    function spawnSparkles(wx, wy, count = 16, color = '#FFF59D') {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
        const speed = 1.2 + Math.random() * 2.4;
        state.particles.push({
          type: 'sparkle',
          x: wx,
          y: wy,
          z: 16 + Math.random() * 14,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          vz: 40 + Math.random() * 55,
          size: 4 + Math.random() * 4,
          color: i % 2 === 0 ? color : '#FFFFFF',
          life: 0,
          maxLife: 0.45 + Math.random() * 0.25
        });
      }
    }

    function spawnDustRing(rect, count = 26) {
      for (let i = 0; i < count; i++) {
        const t = i / count;
        let wx, wy;
        // 사각형 테두리를 따라 먼지 구름 배치
        if (t < 0.25) {
          const u = t / 0.25;
          wx = rect.x1 + (rect.x2 - rect.x1) * u;
          wy = rect.y1;
        } else if (t < 0.5) {
          const u = (t - 0.25) / 0.25;
          wx = rect.x2;
          wy = rect.y1 + (rect.y2 - rect.y1) * u;
        } else if (t < 0.75) {
          const u = (t - 0.5) / 0.25;
          wx = rect.x2 - (rect.x2 - rect.x1) * u;
          wy = rect.y2;
        } else {
          const u = (t - 0.75) / 0.25;
          wx = rect.x1;
          wy = rect.y2 - (rect.y2 - rect.y1) * u;
        }
        const cx = (rect.x1 + rect.x2) * 0.5;
        const cy = (rect.y1 + rect.y2) * 0.5;
        const dirX = wx - cx;
        const dirY = wy - cy;
        const len = Math.hypot(dirX, dirY) || 1;
        state.particles.push({
          type: 'dust',
          x: wx,
          y: wy,
          z: 2,
          vx: (dirX / len) * (1.2 + Math.random() * 1.4),
          vy: (dirY / len) * (1.2 + Math.random() * 1.4),
          vz: 12 + Math.random() * 18,
          size: 8 + Math.random() * 8,
          life: 0,
          maxLife: 0.45 + Math.random() * 0.2
        });
      }
    }

    // =========================================================================
    // 프레임 업데이트 로직
    // =========================================================================
    let lastTime = performance.now();

    function update(dt) {
      // 카메라 쉐이크 감쇠
      if (state.cameraShake > 0) {
        state.cameraShake = Math.max(0, state.cameraShake - dt * 28);
      }

      // 1. 플레이어 이동 처리
      const p = state.player;
      let moveX = 0;
      let moveY = 0;

      // 아이소메트릭 방향에 맞춘 직관적 WASD/방향키 매핑
      if (state.keys['KeyW'] || state.keys['ArrowUp']) { moveX -= 1; moveY -= 1; }
      if (state.keys['KeyS'] || state.keys['ArrowDown']) { moveX += 1; moveY += 1; }
      if (state.keys['KeyA'] || state.keys['ArrowLeft']) { moveX -= 1; moveY += 1; }
      if (state.keys['KeyD'] || state.keys['ArrowRight']) { moveX += 1; moveY -= 1; }

      let isMoving = false;
      if (moveX !== 0 || moveY !== 0) {
        const len = Math.hypot(moveX, moveY);
        moveX /= len;
        moveY /= len;
        p.x += moveX * p.speed * dt;
        p.y += moveY * p.speed * dt;
        isMoving = true;
      } else if (p.targetX !== null && p.targetY !== null) {
        const dx = p.targetX - p.x;
        const dy = p.targetY - p.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 0.06) {
          const step = Math.min(dist, p.speed * dt);
          p.x += (dx / dist) * step;
          p.y += (dy / dist) * step;
          isMoving = true;
        } else {
          p.x = p.targetX;
          p.y = p.targetY;
          p.targetX = null;
          p.targetY = null;
        }
      }

      // 플레이어 경계 제한
      const maxAllowX = (state.unlockPhase === 'unlocked') ? LOCKED_RECT.x2 - 0.35 : UNLOCKED_RECT.x2 - 0.3;
      p.x = Math.max(UNLOCKED_RECT.x1 + 0.35, Math.min(maxAllowX, p.x));
      p.y = Math.max(UNLOCKED_RECT.y1 + 0.35, Math.min(UNLOCKED_RECT.y2 - 0.35, p.y));

      if (isMoving) {
        p.walkCycle += dt * 13;
        const screenVelX = moveX - moveY;
        if (Math.abs(screenVelX) > 0.05) {
          p.facing = screenVelX >= 0 ? 1 : -1;
        }
      } else {
        p.walkCycle = 0;
      }

      // 2. 해금 발판 위 충돌 판정 및 게이지 충전
      const halfPad = PAD_CONFIG.size * 0.52;
      const onPad =
        Math.abs(p.x - PAD_CONFIG.x) <= halfPad &&
        Math.abs(p.y - PAD_CONFIG.y) <= halfPad;

      if (state.unlockPhase === 'locked') {
        if (onPad) {
          const fillSpeed = 0.72; // 약 1.38초 동안 0 -> 100% 충전
          state.padProgress = Math.min(1, state.padProgress + fillSpeed * dt);
          state.cashSoundAccum += dt;
          state.cashParticleAccum += dt;

          if (state.cashParticleAccum >= 0.075) {
            state.cashParticleAccum = 0;
            spawnCashBill(p.x, p.y, PAD_CONFIG.x, PAD_CONFIG.y);
          }
          if (state.cashSoundAccum >= 0.13) {
            state.cashSoundAccum = 0;
            playCashTick(state.padProgress);
          }

          updateStatusBadge();

          if (state.padProgress >= 1) {
            triggerUnlockSequence(false);
          }
        }
      }

      // 3. 자물쇠 해제 애니메이션 단계 ('unlocking_lock')
      if (state.unlockPhase === 'unlocking_lock') {
        state.lockTimer += dt;
        // 0 ~ 0.28s: 자물쇠 걸이(Shackle)가 위로 튀어오르며 열림
        if (state.lockTimer < 0.28) {
          const t = state.lockTimer / 0.28;
          state.shackleLift = easeOutBack(t, 2.1) * 16;
          state.lockScale = 1 + Math.sin(t * Math.PI) * 0.14;
        } else if (state.lockTimer < 0.52) {
          // 0.28 ~ 0.52s: 자물쇠 전체가 팡! 하고 작아지며 사라짐
          const t = (state.lockTimer - 0.28) / 0.24;
          state.shackleLift = 16;
          state.lockScale = Math.max(0, 1 - easeOutCubic(t));
          state.lockAlpha = Math.max(0, 1 - t * 1.2);
        } else {
          // 자물쇠 소멸 완료 -> 선택된 필드 해금 애니메이션 시작!
          state.unlockPhase = 'animating_field';
          state.fieldAnimTimer = 0;
          playUnlockFanfare(state.animMode);
          updateStatusBadge();
        }
      }

      // 4. 필드 해금 애니메이션 단계 ('animating_field')
      if (state.unlockPhase === 'animating_field') {
        const prevTimer = state.fieldAnimTimer;
        state.fieldAnimTimer += dt;
        const progress = Math.min(1, state.fieldAnimTimer / state.fieldAnimDuration);

        // 필드 낙하 모드 착지 순간 임팩트 효과
        if (state.animMode === 'drop') {
          const dropT = Math.min(1, progress / 0.62);
          const prevDropT = Math.min(1, (prevTimer / state.fieldAnimDuration) / 0.62);
          if (dropT >= 1 && prevDropT < 1) {
            state.cameraShake = 9;
            spawnDustRing(LOCKED_RECT, 28);
            spawnSparkles(
              (LOCKED_RECT.x1 + LOCKED_RECT.x2) * 0.5,
              (LOCKED_RECT.y1 + LOCKED_RECT.y2) * 0.5,
              18,
              '#B9F26D'
            );
          }
        }

        if (progress >= 1) {
          state.unlockPhase = 'unlocked';
          if (state.animMode !== 'drop') {
            spawnSparkles(
              (LOCKED_RECT.x1 + LOCKED_RECT.x2) * 0.5,
              (LOCKED_RECT.y1 + LOCKED_RECT.y2) * 0.5,
              22,
              '#FFF176'
            );
          }
          updateStatusBadge();
        }
      }

      // 5. 파티클 및 리플 업데이트
      for (let i = state.particles.length - 1; i >= 0; i--) {
        const pt = state.particles[i];
        pt.life += dt;
        if (pt.life >= pt.maxLife) {
          state.particles.splice(i, 1);
          continue;
        }
        const t = pt.life / pt.maxLife;
        if (pt.type === 'cash') {
          pt.x = pt.startX + (pt.endX - pt.startX) * easeOutCubic(t);
          pt.y = pt.startY + (pt.endY - pt.startY) * easeOutCubic(t);
          pt.z = 26 * (1 - t) + Math.sin(t * Math.PI) * 34;
          pt.rot += dt * 9;
        } else if (pt.type === 'sparkle') {
          pt.x += pt.vx * dt;
          pt.y += pt.vy * dt;
          pt.z += pt.vz * dt;
          pt.vz -= 140 * dt;
        } else if (pt.type === 'dust') {
          pt.x += pt.vx * dt;
          pt.y += pt.vy * dt;
          pt.z += pt.vz * dt;
        }
      }

      for (let i = state.ripples.length - 1; i >= 0; i--) {
        state.ripples[i].life += dt;
        if (state.ripples[i].life >= state.ripples[i].maxLife) {
          state.ripples.splice(i, 1);
        }
      }
    }

    // =========================================================================
    // 렌더링 함수 모음
    // =========================================================================

    // 배경 파스텔 잔디 + 은은한 아이소메트릭 격자 패턴 (첨부 3번 GIF 톤앤매너)
    function drawBackground() {
      const grad = ctx.createLinearGradient(0, 0, 0, state.height);
      grad.addColorStop(0, '#DFECB9');
      grad.addColorStop(1, '#CFE0A3');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, state.width, state.height);

      // 은은한 아이소메트릭 배경 그리드 라인
      ctx.save();
      ctx.strokeStyle = 'rgba(130, 158, 76, 0.16)';
      ctx.lineWidth = 1;
      const range = 14;
      for (let i = -range; i <= range; i++) {
        const p1 = isoToScreen(i, -range, 0);
        const p2 = isoToScreen(i, range, 0);
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();

        const q1 = isoToScreen(-range, i, 0);
        const q2 = isoToScreen(range, i, 0);
        ctx.beginPath();
        ctx.moveTo(q1.x, q1.y);
        ctx.lineTo(q2.x, q2.y);
        ctx.stroke();
      }
      ctx.restore();
    }

    /**
     * 3D 아이소메트릭 잔디 플랫폼(직육면체 슬래브) 그리기
     */
    function drawIsoSlab(x1, y1, x2, y2, zOffset = 0, options = {}) {
      const {
        topColor = '#9CD34A',
        leftSideColor = '#78B332',
        rightSideColor = '#639924',
        borderColor = '#53821C',
        showGrid = true,
        drawShadow = true,
        shadowAlpha = 0.22,
        shadowScale = 1,
        thickness = SLAB_THICKNESS
      } = options;

      // 바닥 그림자
      if (drawShadow) {
        const cx = (x1 + x2) * 0.5;
        const cy = (y1 + y2) * 0.5;
        const hw = (x2 - x1) * 0.5 * shadowScale;
        const hh = (y2 - y1) * 0.5 * shadowScale;
        const sTop = isoToScreen(cx - hw, cy - hh, -thickness);
        const sRight = isoToScreen(cx + hw, cy - hh, -thickness);
        const sBottom = isoToScreen(cx + hw, cy + hh, -thickness);
        const sLeft = isoToScreen(cx - hw, cy + hh, -thickness);

        ctx.save();
        ctx.fillStyle = `rgba(65, 92, 30, ${shadowAlpha})`;
        ctx.beginPath();
        ctx.moveTo(sTop.x, sTop.y + 4 * state.scale);
        ctx.lineTo(sRight.x, sRight.y + 4 * state.scale);
        ctx.lineTo(sBottom.x, sBottom.y + 4 * state.scale);
        ctx.lineTo(sLeft.x, sLeft.y + 4 * state.scale);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // 윗면 꼭짓점 (z = zOffset)
      const pTop = isoToScreen(x1, y1, zOffset);
      const pRight = isoToScreen(x2, y1, zOffset);
      const pBottom = isoToScreen(x2, y2, zOffset);
      const pLeft = isoToScreen(x1, y2, zOffset);

      // 아랫면 꼭짓점 (z = zOffset - thickness)
      const bRight = isoToScreen(x2, y1, zOffset - thickness);
      const bBottom = isoToScreen(x2, y2, zOffset - thickness);
      const bLeft = isoToScreen(x1, y2, zOffset - thickness);

      ctx.save();
      ctx.lineJoin = 'round';

      // 좌하단 측면 (y = y2 면)
      ctx.fillStyle = leftSideColor;
      ctx.beginPath();
      ctx.moveTo(pLeft.x, pLeft.y);
      ctx.lineTo(pBottom.x, pBottom.y);
      ctx.lineTo(bBottom.x, bBottom.y);
      ctx.lineTo(bLeft.x, bLeft.y);
      ctx.closePath();
      ctx.fill();

      // 우하단 측면 (x = x2 면)
      ctx.fillStyle = rightSideColor;
      ctx.beginPath();
      ctx.moveTo(pBottom.x, pBottom.y);
      ctx.lineTo(pRight.x, pRight.y);
      ctx.lineTo(bRight.x, bRight.y);
      ctx.lineTo(bBottom.x, bBottom.y);
      ctx.closePath();
      ctx.fill();

      // 윗면 잔디 바닥
      ctx.fillStyle = topColor;
      ctx.beginPath();
      ctx.moveTo(pTop.x, pTop.y);
      ctx.lineTo(pRight.x, pRight.y);
      ctx.lineTo(pBottom.x, pBottom.y);
      ctx.lineTo(pLeft.x, pLeft.y);
      ctx.closePath();
      ctx.fill();

      // 필드 내부 은은한 타일 눈금
      if (showGrid && (x2 - x1) > 0.6 && (y2 - y1) > 0.6) {
        ctx.save();
        ctx.clip();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
        ctx.lineWidth = 1.2 * state.scale;
        const startX = Math.ceil(x1);
        for (let gx = startX; gx < x2; gx += 1) {
          const g1 = isoToScreen(gx, y1, zOffset);
          const g2 = isoToScreen(gx, y2, zOffset);
          ctx.beginPath();
          ctx.moveTo(g1.x, g1.y);
          ctx.lineTo(g2.x, g2.y);
          ctx.stroke();
        }
        const startY = Math.ceil(y1 * 2) / 2;
        for (let gy = startY; gy < y2; gy += 1) {
          const g1 = isoToScreen(x1, gy, zOffset);
          const g2 = isoToScreen(x2, gy, zOffset);
          ctx.beginPath();
          ctx.moveTo(g1.x, g1.y);
          ctx.lineTo(g2.x, g2.y);
          ctx.stroke();
        }
        ctx.restore();
      }

      // 윗면 테두리 하이라이트
      ctx.strokeStyle = 'rgba(235, 255, 190, 0.65)';
      ctx.lineWidth = 1.5 * state.scale;
      ctx.beginPath();
      ctx.moveTo(pLeft.x, pLeft.y);
      ctx.lineTo(pTop.x, pTop.y);
      ctx.lineTo(pRight.x, pRight.y);
      ctx.stroke();

      // 외곽선
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 1.6 * state.scale;
      ctx.beginPath();
      ctx.moveTo(pTop.x, pTop.y);
      ctx.lineTo(pRight.x, pRight.y);
      ctx.lineTo(bRight.x, bRight.y);
      ctx.lineTo(bBottom.x, bBottom.y);
      ctx.lineTo(bLeft.x, bLeft.y);
      ctx.lineTo(pLeft.x, pLeft.y);
      ctx.closePath();
      ctx.stroke();

      ctx.restore();
    }

    /**
     * 미해금 구역 바닥 흰색 점선 테두리 (첨부 3번 GIF 스타일)
     */
    function drawLockedDashedZone() {
      const { x1, y1, x2, y2 } = LOCKED_RECT;
      const pTop = isoToScreen(x1, y1, 0);
      const pRight = isoToScreen(x2, y1, 0);
      const pBottom = isoToScreen(x2, y2, 0);
      const pLeft = isoToScreen(x1, y2, 0);

      ctx.save();
      // 안쪽 은은한 점선 보조 그리드
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.32)';
      ctx.lineWidth = 1.2 * state.scale;
      ctx.setLineDash([4 * state.scale, 5 * state.scale]);
      for (let gx = x1 + 1; gx < x2; gx++) {
        const a = isoToScreen(gx, y1, 0);
        const b = isoToScreen(gx, y2, 0);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
      for (let gy = y1 + 1; gy < y2; gy++) {
        const a = isoToScreen(x1, gy, 0);
        const b = isoToScreen(x2, gy, 0);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }

      // 외곽 굵은 흰색 점선 마름모 (이미지 3번과 동일한 깔끔한 점선)
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 3.2 * state.scale;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.setLineDash([9 * state.scale, 8 * state.scale]);

      ctx.beginPath();
      ctx.moveTo(pTop.x, pTop.y);
      ctx.lineTo(pRight.x, pRight.y);
      ctx.lineTo(pBottom.x, pBottom.y);
      ctx.lineTo(pLeft.x, pLeft.y);
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }

    /**
     * 해금 발판 (첨부 이미지 1 & 2번 디자인 100% 재현 + 아이소메트릭 투영)
     */
    function drawUnlockPad() {
      const center = isoToScreen(PAD_CONFIG.x, PAD_CONFIG.y, 0.4);
      const tw = BASE_TILE_W * state.scale;
      const th = BASE_TILE_H * state.scale;

      // 로컬 2D 좌표계 크기 (120 x 120 기준)
      const localSize = 120;
      const worldHalf = PAD_CONFIG.size * 0.5;
      const scaleFactor = (worldHalf / (localSize * 0.5));

      ctx.save();
      // 2D 정사각형 UI를 아이소메트릭 바닥 평면으로 정확히 아핀 변환
      ctx.setTransform(
        tw * scaleFactor * state.dpr,
        th * scaleFactor * state.dpr,
        -tw * scaleFactor * state.dpr,
        th * scaleFactor * state.dpr,
        center.x * state.dpr,
        center.y * state.dpr
      );

      const half = localSize * 0.5;
      const radius = 20;

      // 발판 둥근 사각형 패스
      function roundRectPath(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      // 1. 발판 바닥 그림자
      ctx.fillStyle = 'rgba(59, 35, 20, 0.22)';
      roundRectPath(-half + 3, -half + 4, localSize, localSize, radius);
      ctx.fill();

      // 2. 발판 크림색 바탕 (#FAF5EB)
      ctx.fillStyle = '#FAF5EB';
      roundRectPath(-half, -half, localSize, localSize, radius);
      ctx.fill();

      // 3. 게이지 충전 (아래에서 위로 차오르는 연두색 #7AC71E - 이미지 2번과 동일)
      if (state.padProgress > 0) {
        ctx.save();
        roundRectPath(-half, -half, localSize, localSize, radius);
        ctx.clip();

        const fillH = localSize * state.padProgress;
        const fillTopY = half - fillH;

        ctx.fillStyle = '#7AC71E';
        ctx.fillRect(-half, fillTopY, localSize, fillH);

        // 게이지 상단 물결/하이라이트 선
        if (state.padProgress < 1) {
          ctx.fillStyle = '#9BE33D';
          ctx.fillRect(-half, fillTopY, localSize, 3.5);
        }
        ctx.restore();
      }

      // 4. 상단 아이콘: 4방향 확장 화살표 + 점선 사각형 (첨부 이미지 1, 2 우측 카드)
      ctx.save();
      ctx.translate(0, -23);
      ctx.strokeStyle = '#3B2314';
      ctx.fillStyle = '#FFFFFF';
      ctx.lineWidth = 2.6;
      ctx.setLineDash([3.5, 3.5]);
      ctx.strokeRect(-14, -14, 28, 28);
      ctx.setLineDash([]);

      // 4개 대각선 화살표 그리기
      const dirs = [
        [-1, -1],
        [1, -1],
        [1, 1],
        [-1, 1]
      ];
      dirs.forEach(([dx, dy]) => {
        ctx.save();
        ctx.translate(dx * 15, dy * 15);
        const angle = Math.atan2(dy, dx);
        ctx.rotate(angle);
        // 화살표 외곽 및 채움
        ctx.beginPath();
        ctx.moveTo(-6, -2.5);
        ctx.lineTo(2, -2.5);
        ctx.lineTo(2, -6.5);
        ctx.lineTo(9.5, 0);
        ctx.lineTo(2, 6.5);
        ctx.lineTo(2, 2.5);
        ctx.lineTo(-6, 2.5);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      });
      ctx.restore();

      // 5. 중앙 텍스트: "새 구역"
      ctx.fillStyle = '#3B2314';
      ctx.font = '900 17px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('새 구역', 0, 12);

      // 6. 하단 알약(Pill) 가격 배지 (#F7E3BA)
      const pillW = 94;
      const pillH = 26;
      const pillY = 26;
      ctx.fillStyle = '#F7E3BA';
      roundRectPath(-pillW * 0.5, pillY, pillW, pillH, 13);
      ctx.fill();

      // 지폐 아이콘 (좌측)
      ctx.save();
      ctx.translate(-22, pillY + pillH * 0.5);
      // 지폐 뭉치 3D 느낌
      ctx.fillStyle = '#2E7D1E';
      ctx.fillRect(-11, -4, 22, 11);
      ctx.fillStyle = '#55C435';
      ctx.strokeStyle = '#264E18';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.rect(-11, -7, 22, 11);
      ctx.fill();
      ctx.stroke();
      // 지폐 중앙 띠
      ctx.fillStyle = '#D9F7BE';
      ctx.fillRect(-3.5, -6.2, 7, 9.4);
      ctx.restore();

      // 남은 금액 숫자 (200 -> 0 카운트다운)
      const remainingCost = Math.max(0, Math.ceil(PAD_CONFIG.cost * (1 - state.padProgress)));
      ctx.fillStyle = '#3B2314';
      ctx.font = '900 18px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(String(remainingCost), -4, pillY + pillH * 0.5 + 1);

      // 7. 발판 굵은 다크브라운 테두리 (#3B2314)
      ctx.strokeStyle = '#3B2314';
      ctx.lineWidth = 5;
      roundRectPath(-half, -half, localSize, localSize, radius);
      ctx.stroke();

      ctx.restore();
    }

    /**
     * 미해금 구역 중앙 자물쇠 & Lv.4 배지 (첨부 3번 GIF 디자인 및 걸이 열림 애니메이션)
     */
    function drawCenterPadlock() {
      if (state.unlockPhase === 'animating_field' || state.unlockPhase === 'unlocked') return;
      if (state.lockAlpha <= 0.01) return;

      const cx = (LOCKED_RECT.x1 + LOCKED_RECT.x2) * 0.5;
      const cy = (LOCKED_RECT.y1 + LOCKED_RECT.y2) * 0.5;
      const pos = isoToScreen(cx, cy, 4);

      ctx.save();
      ctx.translate(pos.x, pos.y);
      ctx.scale(state.scale * state.lockScale, state.scale * state.lockScale);
      ctx.globalAlpha = state.lockAlpha;

      // 살짝 둥실거리는 대기 모션
      const idleBob = state.unlockPhase === 'locked' ? Math.sin(performance.now() * 0.004) * 2.5 : 0;

      // 1. 하단 올리브색 배지 ("Lv. 4" - 첨부 GIF 동일 스타일)
      const badgeW = 92;
      const badgeH = 30;
      const badgeY = 12;
      ctx.fillStyle = '#627941';
      ctx.beginPath();
      ctx.roundRect(-badgeW * 0.5, badgeY, badgeW, badgeH, 15);
      ctx.fill();

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 17px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Lv. 4', 0, badgeY + badgeH * 0.5 + 1);

      // 2. 자물쇠 본체 그룹
      ctx.save();
      ctx.translate(0, -14 + idleBob);

      // 자물쇠 U자형 걸이 (Shackle) - 해금 시 위로 열림!
      ctx.save();
      ctx.translate(0, -state.shackleLift);
      if (state.shackleLift > 2) {
        // 열릴 때 살짝 비틀어지는 생동감
        ctx.rotate(-0.08 * Math.min(1, state.shackleLift / 16));
      }

      // 걸이 외곽선 & 은색 채움
      ctx.lineWidth = 11;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#2D221B';
      ctx.beginPath();
      ctx.arc(0, -10, 14, Math.PI, 0, false);
      ctx.lineTo(14, 4);
      ctx.moveTo(-14, -10);
      ctx.lineTo(-14, 4);
      ctx.stroke();

      ctx.lineWidth = 5.5;
      ctx.strokeStyle = '#E2E6EC';
      ctx.beginPath();
      ctx.arc(0, -10, 14, Math.PI, 0, false);
      ctx.lineTo(14, 4);
      ctx.moveTo(-14, -10);
      ctx.lineTo(-14, 4);
      ctx.stroke();
      ctx.restore();

      // 자물쇠 황금색 몸통 (#FFD028)
      const bodyW = 46;
      const bodyH = 36;
      const bodyY = -6;

      // 몸통 채움
      ctx.fillStyle = '#FFD028';
      ctx.beginPath();
      ctx.roundRect(-bodyW * 0.5, bodyY, bodyW, bodyH, 9);
      ctx.fill();

      // 상단 하이라이트 & 하단 음영
      ctx.save();
      ctx.beginPath();
      ctx.roundRect(-bodyW * 0.5, bodyY, bodyW, bodyH, 9);
      ctx.clip();
      ctx.fillStyle = '#FFE66D';
      ctx.fillRect(-bodyW * 0.5, bodyY, bodyW, 6);
      ctx.fillStyle = '#E6A817';
      ctx.fillRect(-bodyW * 0.5, bodyY + bodyH - 6, bodyW, 6);
      ctx.restore();

      // 몸통 짙은 테두리
      ctx.strokeStyle = '#2D221B';
      ctx.lineWidth = 3.2;
      ctx.beginPath();
      ctx.roundRect(-bodyW * 0.5, bodyY, bodyW, bodyH, 9);
      ctx.stroke();

      // 열쇠 구멍
      ctx.fillStyle = '#2D221B';
      ctx.beginPath();
      ctx.arc(0, bodyY + 14, 4.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-2.3, bodyY + 15);
      ctx.lineTo(2.3, bodyY + 15);
      ctx.lineTo(3.4, bodyY + 24);
      ctx.lineTo(-3.4, bodyY + 24);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
      ctx.restore();
    }

    // =========================================================================
    // 5가지 해금 애니메이션 렌더링
    // =========================================================================
    function drawAnimatedNewField() {
      const { x1, y1, x2, y2 } = LOCKED_RECT;
      const progress = Math.min(1, state.fieldAnimTimer / state.fieldAnimDuration);

      // -----------------------------------------------------------------------
      // 모드 1: 타일 파도형식 (소단위 타일이 물결치듯 순차 생성)
      // -----------------------------------------------------------------------
      if (state.animMode === 'wave') {
        const cols = 5;
        const rows = 5;
        const cellW = (x2 - x1) / cols;
        const cellH = (y2 - y1) / rows;

        // 아이소메트릭 깊이 정렬 순서 (back-to-front: i + j 오름차순)
        const tiles = [];
        for (let i = 0; i < cols; i++) {
          for (let j = 0; j < rows; j++) {
            const tx1 = x1 + i * cellW;
            const ty1 = y1 + j * cellH;
            const tx2 = tx1 + cellW;
            const ty2 = ty1 + cellH;
            const cx = (tx1 + tx2) * 0.5;
            const cy = (ty1 + ty2) * 0.5;

            // 해금 발판 쪽(x1, 0)에서 멀어지는 대각선+방사형 파도 딜레이
            const waveDist = (i * 0.75 + Math.abs(j - 2) * 0.45) / 4.5;
            const delay = waveDist * 0.52;
            const localT = Math.max(0, Math.min(1, (progress - delay) / 0.48));

            tiles.push({ i, j, tx1, ty1, tx2, ty2, cx, cy, localT });
          }
        }

        // 깊이순 정렬 후 개별 소타일 렌더
        tiles.sort((a, b) => (a.i + a.j) - (b.i + b.j));

        tiles.forEach((tile) => {
          if (tile.localT <= 0) return;
          const ease = easeOutBack(tile.localT, 1.85);
          const s = Math.max(0.01, Math.min(1.08, ease));
          const zBounce = (1 - easeOutCubic(tile.localT)) * -26 + Math.sin(tile.localT * Math.PI) * 14;

          const hw = (tile.tx2 - tile.tx1) * 0.5 * s;
          const hh = (tile.ty2 - tile.ty1) * 0.5 * s;

          drawIsoSlab(
            tile.cx - hw,
            tile.cy - hh,
            tile.cx + hw,
            tile.cy + hh,
            zBounce,
            {
              showGrid: false,
              drawShadow: true,
              shadowAlpha: 0.16 * tile.localT,
              shadowScale: s
            }
          );
        });
      }

      // -----------------------------------------------------------------------
      // 모드 2: 필드확장 (원래 있던 필드가 해금 구역 끝까지 주욱 늘어남)
      // -----------------------------------------------------------------------
      else if (state.animMode === 'expand') {
        const ease = easeOutBack(progress, 1.15);
        const currentX2 = x1 + (x2 - x1) * Math.max(0.02, ease);

        drawIsoSlab(x1, y1, currentX2, y2, 0, {
          showGrid: true,
          drawShadow: true,
          shadowAlpha: 0.22
        });

        // 늘어나는 선단(Leading Edge)에 에너지 라인 표시
        if (progress < 0.96) {
          const e1 = isoToScreen(currentX2, y1, 1);
          const e2 = isoToScreen(currentX2, y2, 1);
          ctx.save();
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
          ctx.lineWidth = 4 * state.scale;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(e1.x, e1.y);
          ctx.lineTo(e2.x, e2.y);
          ctx.stroke();
          ctx.restore();
        }
      }

      // -----------------------------------------------------------------------
      // 모드 3: 원형 확산 (플레이어 위치 기준 원형 파장이 퍼지며 원형 선에 맞춰 생성)
      // -----------------------------------------------------------------------
      else if (state.animMode === 'circle') {
        const ox = state.circleOrigin.x;
        const oy = state.circleOrigin.y;

        // 시작점에서 미해금 구역의 가장 먼 꼭짓점까지의 월드 거리 계산
        const corners = [
          [x1, y1],
          [x2, y1],
          [x2, y2],
          [x1, y2]
        ];
        let maxR = 0;
        corners.forEach(([cx, cy]) => {
          const d = Math.hypot(cx - ox, cy - oy);
          if (d > maxR) maxR = d;
        });
        maxR += 0.35;

        const currentR = maxR * easeOutCubic(progress);

        // 월드 공간의 원을 아이소메트릭 화면 다각형 패스로 생성 (타일 X, 부드러운 원형 곡선)
        const segments = 72;
        ctx.save();
        ctx.beginPath();
        for (let i = 0; i <= segments; i++) {
          const theta = (i / segments) * Math.PI * 2;
          const wx = ox + Math.cos(theta) * currentR;
          const wy = oy + Math.sin(theta) * currentR;
          const sp = isoToScreen(wx, wy, 0);
          if (i === 0) ctx.moveTo(sp.x, sp.y);
          else ctx.lineTo(sp.x, sp.y);
        }
        ctx.closePath();

        // 원형 클리핑 영역 내부에만 3D 새 필드 슬래브 렌더링 (측면 두께 포함 자연스러운 절단면)
        ctx.save();
        // 두께 영역까지 클리핑에 포함되도록 아래로 확장된 원형 기둥 패스
        ctx.beginPath();
        for (let i = 0; i <= segments; i++) {
          const theta = (i / segments) * Math.PI * 2;
          const wx = ox + Math.cos(theta) * currentR;
          const wy = oy + Math.sin(theta) * currentR;
          const sp = isoToScreen(wx, wy, 2);
          if (i === 0) ctx.moveTo(sp.x, sp.y);
          else ctx.lineTo(sp.x, sp.y);
        }
        ctx.closePath();
        ctx.clip();

        drawIsoSlab(x1, y1, x2, y2, 0, {
          showGrid: true,
          drawShadow: false
        });
        ctx.restore();

        // 원형 파장 테두리 글로우 링 (바닥에 퍼지는 원형 선)
        if (progress < 0.98) {
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.92)';
          ctx.lineWidth = 4.5 * state.scale;
          ctx.beginPath();
          for (let i = 0; i <= segments; i++) {
            const theta = (i / segments) * Math.PI * 2;
            const wx = ox + Math.cos(theta) * currentR;
            const wy = oy + Math.sin(theta) * currentR;
            const sp = isoToScreen(wx, wy, 0.5);
            if (i === 0) ctx.moveTo(sp.x, sp.y);
            else ctx.lineTo(sp.x, sp.y);
          }
          ctx.closePath();
          ctx.stroke();

          ctx.strokeStyle = 'rgba(130, 235, 65, 0.55)';
          ctx.lineWidth = 10 * state.scale;
          ctx.stroke();
        }
        ctx.restore();
      }

      // -----------------------------------------------------------------------
      // 모드 4: 필드 낙하 (미해금 구역 크기의 필드가 하늘에서 떨어짐)
      // -----------------------------------------------------------------------
      else if (state.animMode === 'drop') {
        const dropPhaseEnd = 0.62;
        let zHeight = 0;
        let shadowAlpha = 0.22;
        let shadowScale = 1;

        if (progress < dropPhaseEnd) {
          // 중력 가속 낙하 (t^2)
          const t = progress / dropPhaseEnd;
          const fall = 1 - t * t;
          zHeight = fall * 340;
          shadowAlpha = 0.08 + t * 0.22;
          shadowScale = 0.65 + t * 0.35;
        } else {
          // 착지 후 미세 반동 바운스
          const bounceT = (progress - dropPhaseEnd) / (1 - dropPhaseEnd);
          zHeight = Math.sin(bounceT * Math.PI) * 14 * (1 - bounceT);
        }

        drawIsoSlab(x1, y1, x2, y2, zHeight, {
          showGrid: true,
          drawShadow: true,
          shadowAlpha,
          shadowScale
        });
      }

      // -----------------------------------------------------------------------
      // 모드 5: 튕김 (필드가 탄성 있게 튀어나오듯 구역을 채움)
      // -----------------------------------------------------------------------
      else if (state.animMode === 'bounce') {
        const cx = (x1 + x2) * 0.5;
        const cy = (y1 + y2) * 0.5;
        const elastic = easeOutElastic(progress);
        const s = Math.max(0.02, elastic);

        const hw = (x2 - x1) * 0.5 * s;
        const hh = (y2 - y1) * 0.5 * s;

        drawIsoSlab(cx - hw, cy - hh, cx + hw, cy + hh, 0, {
          showGrid: true,
          drawShadow: true,
          shadowAlpha: 0.22 * Math.min(1, progress * 2),
          shadowScale: s
        });
      }
    }

    /**
     * 귀여운 타이쿤 캐릭터 (3D 캡슐형 플레이어) 렌더링
     */
    function drawPlayer() {
      const p = state.player;
      const bob = Math.abs(Math.sin(p.walkCycle)) * 6;
      const basePos = isoToScreen(p.x, p.y, 0);
      const bodyPos = isoToScreen(p.x, p.y, bob);
      const s = state.scale;

      ctx.save();
      // 바닥 그림자
      ctx.fillStyle = 'rgba(45, 68, 20, 0.32)';
      ctx.beginPath();
      ctx.ellipse(basePos.x, basePos.y, 15 * s, 8 * s, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.translate(bodyPos.x, bodyPos.y);
      ctx.scale(s, s);

      // 몸통 (파란 멜빵/셔츠 스타일 타이쿤 캐릭터)
      ctx.fillStyle = '#3B82F6';
      ctx.strokeStyle = '#2B1B12';
      ctx.lineWidth = 2.8;
      ctx.beginPath();
      ctx.roundRect(-11, -24, 22, 22, 10);
      ctx.fill();
      ctx.stroke();

      // 머리
      ctx.fillStyle = '#FFE0BD';
      ctx.beginPath();
      ctx.arc(0, -32, 11.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 귀여운 모자 (타이쿤 매니저 캡)
      ctx.fillStyle = '#FF6B4A';
      ctx.beginPath();
      ctx.arc(0, -34, 11.5, Math.PI, 0, false);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 모자 챙
      ctx.fillStyle = '#FF6B4A';
      ctx.beginPath();
      ctx.ellipse(p.facing * 5, -34, 9, 3.2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 눈
      ctx.fillStyle = '#2B1B12';
      const eyeOffsetX = p.facing * 3.5;
      ctx.beginPath();
      ctx.arc(eyeOffsetX - 2.5, -30, 1.6, 0, Math.PI * 2);
      ctx.arc(eyeOffsetX + 3.5, -30, 1.6, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    /**
     * 이동 클릭 리플 및 파티클 렌더링
     */
    function drawEffects() {
      // 클릭 목표 지점 리플
      state.ripples.forEach((rp) => {
        const t = rp.life / rp.maxLife;
        const sp = isoToScreen(rp.x, rp.y, 0.5);
        ctx.save();
        ctx.strokeStyle = `rgba(255, 255, 255, ${1 - t})`;
        ctx.lineWidth = 2.5 * state.scale;
        ctx.beginPath();
        ctx.ellipse(sp.x, sp.y, (8 + t * 22) * state.scale, (4 + t * 11) * state.scale, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      });

      // 파티클 렌더링
      state.particles.forEach((pt) => {
        const sp = isoToScreen(pt.x, pt.y, pt.z);
        const t = pt.life / pt.maxLife;
        ctx.save();
        ctx.translate(sp.x, sp.y);
        ctx.scale(state.scale, state.scale);

        if (pt.type === 'cash') {
          ctx.rotate(pt.rot);
          ctx.fillStyle = '#55C435';
          ctx.strokeStyle = '#264E18';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.rect(-10, -5.5, 20, 11);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#D9F7BE';
          ctx.fillRect(-3, -4.8, 6, 9.6);
        } else if (pt.type === 'sparkle') {
          ctx.globalAlpha = 1 - t;
          ctx.fillStyle = pt.color;
          const r = pt.size * (1 - t * 0.4);
          ctx.beginPath();
          ctx.moveTo(0, -r);
          ctx.lineTo(r * 0.35, -r * 0.35);
          ctx.lineTo(r, 0);
          ctx.lineTo(r * 0.35, r * 0.35);
          ctx.lineTo(0, r);
          ctx.lineTo(-r * 0.35, r * 0.35);
          ctx.lineTo(-r, 0);
          ctx.lineTo(-r * 0.35, -r * 0.35);
          ctx.closePath();
          ctx.fill();
        } else if (pt.type === 'dust') {
          ctx.globalAlpha = (1 - t) * 0.7;
          ctx.fillStyle = '#F4F7E8';
          ctx.beginPath();
          ctx.arc(0, 0, pt.size * (0.6 + t * 0.7), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });
    }

    // =========================================================================
    // 메인 렌더 루프
    // =========================================================================
    function render() {
      ctx.save();
      ctx.scale(state.dpr, state.dpr);

      // 카메라 쉐이크 오프셋
      if (state.cameraShake > 0.1) {
        const sx = (Math.random() - 0.5) * state.cameraShake;
        const sy = (Math.random() - 0.5) * state.cameraShake;
        ctx.translate(sx, sy);
      }

      // 1. 배경 파스텔 잔디 그리드
      drawBackground();

      // 2. 미해금 구역 흰색 점선 표시 (해금 완료 전까지 바닥에 표시)
      if (state.unlockPhase !== 'unlocked') {
        drawLockedDashedZone();
      }

      // 3. 기존 해금된 필드 슬래브 (확장 모드일 때는 기존 필드가 직접 늘어나는 느낌을 위해 통합 처리)
      if (state.unlockPhase === 'animating_field' && state.animMode === 'expand') {
        // 기존 필드 + 늘어나는 새 필드를 하나의 연속된 3D 지형으로 렌더링
        drawIsoSlab(UNLOCKED_RECT.x1, UNLOCKED_RECT.y1, UNLOCKED_RECT.x2, UNLOCKED_RECT.y2, 0, {
          showGrid: true,
          drawShadow: true
        });
        drawAnimatedNewField();
      } else {
        // 기존 필드 렌더링
        drawIsoSlab(UNLOCKED_RECT.x1, UNLOCKED_RECT.y1, UNLOCKED_RECT.x2, UNLOCKED_RECT.y2, 0, {
          showGrid: true,
          drawShadow: true
        });

        // 새로 해금 중이거나 해금 완료된 필드 렌더링
        if (state.unlockPhase === 'animating_field') {
          drawAnimatedNewField();
        } else if (state.unlockPhase === 'unlocked') {
          drawIsoSlab(LOCKED_RECT.x1, LOCKED_RECT.y1, LOCKED_RECT.x2, LOCKED_RECT.y2, 0, {
            showGrid: true,
            drawShadow: true
          });
        }
      }

      // 4. 해금 발판 (첨부 이미지 1, 2번 UI)
      drawUnlockPad();

      // 5. 플레이어 캐릭터
      drawPlayer();

      // 6. 미해금 구역 중앙 자물쇠 & Lv.4 배지 (첨부 3번 GIF)
      drawCenterPadlock();

      // 7. 지폐 비행 / 먼지 / 반짝이 파티클
      drawEffects();

      ctx.restore();
    }

    function gameLoop(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;

      update(dt);
      render();

      requestAnimationFrame(gameLoop);
    }

    window.onload = function () {
      resizeCanvas();
      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    };
  </script>
</body>
</html>
