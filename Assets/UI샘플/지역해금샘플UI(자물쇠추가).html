<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>쿼터뷰 타이쿤 - 필드 해금 애니메이션 샘플</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #d6e594;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .font-game {
      font-family: 'Jua', 'Noto Sans KR', sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* 캐주얼 타이쿤 스타일 버튼 효과 */
    .tycoon-btn {
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.15s, box-shadow 0.15s;
    }
    .tycoon-btn:active {
      transform: translateY(2px) scale(0.97);
    }
    .mode-active {
      background-color: #74c721 !important;
      color: #ffffff !important;
      border-color: #3b2314 !important;
      box-shadow: 0 4px 0 #3b2314 !important;
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="relative w-full h-full">

  <!-- 메인 게임 캔버스 -->
  <canvas id="gameCanvas"></canvas>

  <!-- 상단 상태 & 타이틀 HUD -->
  <div class="pointer-events-none fixed top-0 left-0 right-0 z-10 flex flex-col items-center pt-3 px-3 sm:pt-5">
    <div class="pointer-events-auto flex flex-wrap items-center justify-between gap-2 w-full max-w-4xl bg-[#fcf6e8]/95 backdrop-blur-sm border-[3px] border-[#3b2314] rounded-2xl px-4 py-2.5 shadow-[0_4px_0_#3b2314]">
      <div class="flex items-center gap-2.5">
        <span class="inline-flex items-center justify-center w-8 h-8 rounded-xl bg-[#ffd026] border-2 border-[#3b2314] text-base shadow-inner">🏗️</span>
        <div>
          <h1 class="font-game text-base sm:text-lg text-[#3b2314] leading-tight">필드 해금 UI &amp; 연출 샘플</h1>
          <p id="statusHint" class="text-[11px] sm:text-xs font-bold text-[#6e503b]">
            바닥 클릭 / WASD / 방향키로 이동해 <span class="text-[#569e12]">[새 구역]</span> 발판 위에 서세요!
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- 현재 선택된 연출 배지 -->
        <span id="currentModeBadge" class="hidden md:inline-flex items-center px-3 py-1 rounded-full bg-[#fce6ad] border-2 border-[#3b2314] text-xs font-extrabold text-[#3b2314]">
          연출: 타일 파도형식
        </span>
        <!-- 사운드 토글 -->
        <button id="soundToggleBtn" title="효과음 켜기/끄기"
          class="tycoon-btn flex items-center justify-center w-9 h-9 rounded-xl bg-[#fffaf0] border-2 border-[#3b2314] text-[#3b2314] shadow-[0_3px_0_#3b2314] text-sm font-bold cursor-pointer">
          🔊
        </button>
      </div>
    </div>

    <!-- 플로팅 토스트 알림 -->
    <div id="toastBanner"
      class="mt-2.5 px-4 py-1.5 rounded-full bg-[#3b2314] text-[#fcf6e8] text-xs sm:text-sm font-bold shadow-lg opacity-0 -translate-y-2 transition-all duration-300 pointer-events-none">
      안내 메시지
    </div>
  </div>

  <!-- 하단 컨트롤 & 5종 애니메이션 선택 패널 -->
  <div class="pointer-events-none fixed bottom-0 left-0 right-0 z-10 flex flex-col items-center pb-3 px-2 sm:pb-5 sm:px-4">
    <div class="pointer-events-auto w-full max-w-4xl bg-[#fcf6e8]/95 backdrop-blur-sm border-[3px] border-[#3b2314] rounded-3xl p-2.5 sm:p-3.5 shadow-[0_6px_0_#3b2314] flex flex-col gap-2.5">
      
      <!-- 1줄: 5종 해금 애니메이션 선택 버튼 -->
      <div class="flex items-center justify-between gap-1.5 overflow-x-auto pb-0.5">
        <span class="hidden sm:inline-block shrink-0 text-xs font-black text-[#3b2314] bg-[#fce6ad] border-2 border-[#3b2314] rounded-xl px-2.5 py-1.5 mr-1">
          해금 연출
        </span>
        <div id="modeButtons" class="grid grid-cols-5 gap-1.5 sm:gap-2 w-full">
          <button data-mode="wave"
            class="mode-btn mode-active tycoon-btn py-2 px-1 sm:px-2.5 rounded-xl bg-[#fffaf0] text-[#3b2314] border-2 border-[#3b2314] shadow-[0_3px_0_#3b2314] text-[11px] sm:text-xs font-extrabold cursor-pointer whitespace-nowrap">
            타일 파도형식
          </button>
          <button data-mode="expand"
            class="mode-btn tycoon-btn py-2 px-1 sm:px-2.5 rounded-xl bg-[#fffaf0] text-[#3b2314] border-2 border-[#3b2314] shadow-[0_3px_0_#3b2314] text-[11px] sm:text-xs font-extrabold cursor-pointer whitespace-nowrap">
            필드확장
          </button>
          <button data-mode="ripple"
            class="mode-btn tycoon-btn py-2 px-1 sm:px-2.5 rounded-xl bg-[#fffaf0] text-[#3b2314] border-2 border-[#3b2314] shadow-[0_3px_0_#3b2314] text-[11px] sm:text-xs font-extrabold cursor-pointer whitespace-nowrap">
            원형 확산
          </button>
          <button data-mode="drop"
            class="mode-btn tycoon-btn py-2 px-1 sm:px-2.5 rounded-xl bg-[#fffaf0] text-[#3b2314] border-2 border-[#3b2314] shadow-[0_3px_0_#3b2314] text-[11px] sm:text-xs font-extrabold cursor-pointer whitespace-nowrap">
            필드 낙하
          </button>
          <button data-mode="bounce"
            class="mode-btn tycoon-btn py-2 px-1 sm:px-2.5 rounded-xl bg-[#fffaf0] text-[#3b2314] border-2 border-[#3b2314] shadow-[0_3px_0_#3b2314] text-[11px] sm:text-xs font-extrabold cursor-pointer whitespace-nowrap">
            튕김
          </button>
        </div>
      </div>

      <!-- 2줄: 빠른 테스트(자동 이동) & 초기화 버튼 -->
      <div class="flex items-center justify-between gap-2 pt-1 border-t-2 border-[#e8dcc4]">
        <div class="flex items-center gap-2 text-[11px] sm:text-xs font-bold text-[#6e503b]">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-[#74c721] border border-[#3b2314]"></span>
          <span id="stateLabel">상태: 미해금 (발판 대기중)</span>
        </div>

        <div class="flex items-center gap-2">
          <button id="autoWalkBtn"
            class="tycoon-btn flex items-center gap-1.5 px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl bg-[#ffd026] hover:bg-[#ffda4d] text-[#3b2314] border-2 border-[#3b2314] shadow-[0_3px_0_#3b2314] text-xs sm:text-sm font-black cursor-pointer">
            <span>🏃</span>
            <span>발판으로 자동 이동</span>
          </button>
          <button id="resetBtn"
            class="tycoon-btn flex items-center gap-1.5 px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl bg-[#ff8a75] hover:bg-[#ff9c8a] text-[#3b2314] border-2 border-[#3b2314] shadow-[0_3px_0_#3b2314] text-xs sm:text-sm font-black cursor-pointer">
            <span>🔄</span>
            <span>초기화</span>
          </button>
        </div>
      </div>

    </div>
  </div>

  <script>
    /**
     * ============================================================================
     * 쿼터뷰(Isometric) 캐주얼 타이쿤 필드 해금 UI & 5종 애니메이션 프로토타입
     * ============================================================================
     */

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI DOM 요소 참조
    const statusHintEl = document.getElementById('statusHint');
    const stateLabelEl = document.getElementById('stateLabel');
    const currentModeBadgeEl = document.getElementById('currentModeBadge');
    const toastBannerEl = document.getElementById('toastBanner');
    const autoWalkBtn = document.getElementById('autoWalkBtn');
    const resetBtn = document.getElementById('resetBtn');
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const modeButtons = document.querySelectorAll('.mode-btn');

    // 애니메이션 모드 이름 매핑
    const MODE_NAMES = {
      wave: '타일 파도형식',
      expand: '필드확장',
      ripple: '원형 확산',
      drop: '필드 낙하',
      bounce: '튕김'
    };

    // ----------------------------------------------------------------------------
    // 1. Web Audio API 기반 경쾌한 캐주얼 게임 효과음 합성기 (외부 파일 불필요)
    // ----------------------------------------------------------------------------
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type = 'sine', duration = 0.1, volume = 0.12, delay = 0, endFreq = null) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (endFreq) {
          osc.frequency.exponentialRampToValueAtTime(endFreq, now + duration);
        }

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(volume, now + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.02);
      }

      playCoinTick(progress) {
        const pitch = 520 + progress * 440;
        this.playTone(pitch, 'triangle', 0.07, 0.08, 0, pitch * 1.15);
      }

      playLockPop() {
        this.playTone(380, 'sine', 0.09, 0.16, 0, 760);
        this.playTone(980, 'triangle', 0.14, 0.14, 0.07, 1320);
      }

      playUnlockFanfare() {
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((n, idx) => {
          this.playTone(n, 'triangle', 0.22, 0.14, idx * 0.065);
        });
      }

      playTilePop(idx = 0) {
        const pitch = 420 + (idx % 8) * 35;
        this.playTone(pitch, 'sine', 0.08, 0.06, 0, pitch * 1.25);
      }

      playHeavyThud() {
        this.playTone(150, 'sine', 0.24, 0.25, 0, 42);
        this.playTone(95, 'triangle', 0.2, 0.2, 0.02, 35);
      }
    }

    const sfx = new SoundFX();

    // ----------------------------------------------------------------------------
    // 2. 쿼터뷰(Isometric) 좌표계 & 월드 설정
    // ----------------------------------------------------------------------------
    // 월드 그리드 좌표계:
    // - 기존 해금된 필드: x in [0, 4], y in [0, 4] (4x4 타일)
    // - 미해금 구역:      x in [4, 8], y in [0, 4] (기존 필드 우하단 변에 인접한 4x4 구역)
    // - 해금 발판:        기존 필드 내부 경계선 앞쪽 x in [2.35, 3.75], y in [1.3, 2.7]
    const ISO = {
      tileW: 96,       // 아이소메트릭 1유닛 가로 대각선 길이 (화면 크기에 맞춰 동적 스케일링)
      tileH: 48,       // 아이소메트릭 1유닛 세로 대각선 길이 (2:1 비율)
      thickness: 16,   // 플랫폼 3D 측면 두께
      scale: 1,
      originX: 0,
      originY: 0
    };

    const EXISTING_FIELD = { minX: 0, maxX: 4, minY: 0, maxY: 4 };
    const LOCKED_ZONE    = { minX: 4, maxX: 8, minY: 0, maxY: 4 };

    // 해금 발판 영역 (월드 좌표 정사각형 -> 아이소메트릭 마름모 카드로 투영됨)
    const UNLOCK_PAD = {
      x: 2.35,
      y: 1.25,
      size: 1.5,
      cost: 200,
      progress: 0,        // 0.0 ~ 1.0
      fillDuration: 1.55, // 완충까지 걸리는 시간(초)
      coinEmitTimer: 0,
      scaleAnim: 1,
      visible: true,
      alpha: 1
    };

    // 자물쇠 상태 머신
    const PADLOCK = {
      worldX: (LOCKED_ZONE.minX + LOCKED_ZONE.maxX) / 2, // 6.0
      worldY: (LOCKED_ZONE.minY + LOCKED_ZONE.maxY) / 2, // 2.0
      state: 'locked', // 'locked' | 'opening' | 'vanishing' | 'gone'
      timer: 0,
      shackleLift: 0,  // 0 -> 1 (걸이가 위로 열리는 정도)
      shackleTilt: 0,
      scale: 1,
      alpha: 1
    };

    // 필드 해금 애니메이션 상태
    const UNLOCK_ANIM = {
      mode: 'wave',       // 'wave' | 'expand' | 'ripple' | 'drop' | 'bounce'
      phase: 'locked',    // 'locked' | 'padlock_seq' | 'field_anim' | 'unlocked'
      timer: 0,
      duration: 1.2,
      rippleOrigin: { x: 3.1, y: 2.0 },
      subTiles: []        // 4x4 = 16개 소단위 타일 상태
    };

    // 플레이어 캐릭터 상태
    const PLAYER = {
      x: 1.6,
      y: 2.2,
      targetX: null,
      targetY: null,
      speed: 3.6,
      facingX: 1,
      facingY: 0,
      walkCycle: 0,
      isMoving: false,
      onPad: false
    };

    // 파티클 & 화면 흔들림
    let particles = [];
    let cameraShake = { time: 0, intensity: 0 };
    const keysPressed = {};

    // ----------------------------------------------------------------------------
    // 3. 좌표 변환 헬퍼 (World <-> Screen)
    // ----------------------------------------------------------------------------
    function worldToScreen(wx, wy, wz = 0) {
      const hw = (ISO.tileW * ISO.scale) * 0.5;
      const hh = (ISO.tileH * ISO.scale) * 0.5;
      const sx = ISO.originX + (wx - wy) * hw;
      const sy = ISO.originY + (wx + wy) * hh - wz * ISO.scale;
      return { x: sx, y: sy };
    }

    function screenToWorld(sx, sy) {
      const hw = (ISO.tileW * ISO.scale) * 0.5;
      const hh = (ISO.tileH * ISO.scale) * 0.5;
      const dx = (sx - ISO.originX) / hw;
      const dy = (sy - ISO.originY) / hh;
      const wx = (dx + dy) * 0.5;
      const wy = (dy - dx) * 0.5;
      return { x: wx, y: wy };
    }

    // ----------------------------------------------------------------------------
    // 4. 서브 타일 초기화 & 시뮬레이션 리셋
    // ----------------------------------------------------------------------------
    function buildSubTiles() {
      const tiles = [];
      for (let gx = LOCKED_ZONE.minX; gx < LOCKED_ZONE.maxX; gx++) {
        for (let gy = LOCKED_ZONE.minY; gy < LOCKED_ZONE.maxY; gy++) {
          // 타일 파도형식용 대각선 거리 인덱스 (0 ~ 6)
          const waveOrder = (gx - LOCKED_ZONE.minX) + (gy - LOCKED_ZONE.minY);
          tiles.push({
            gx,
            gy,
            cx: gx + 0.5,
            cy: gy + 0.5,
            waveOrder,
            progress: 0,
            popped: false
          });
        }
      }
      UNLOCK_ANIM.subTiles = tiles;
    }

    let toastTimeout = null;
    function showToast(msg) {
      toastBannerEl.textContent = msg;
      toastBannerEl.classList.remove('opacity-0', '-translate-y-2');
      toastBannerEl.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toastBannerEl.classList.add('opacity-0', '-translate-y-2');
        toastBannerEl.classList.remove('opacity-100', 'translate-y-0');
      }, 2100);
    }

    function resetSimulation(keepPlayerPos = false) {
      UNLOCK_PAD.progress = 0;
      UNLOCK_PAD.coinEmitTimer = 0;
      UNLOCK_PAD.scaleAnim = 1;
      UNLOCK_PAD.visible = true;
      UNLOCK_PAD.alpha = 1;

      PADLOCK.state = 'locked';
      PADLOCK.timer = 0;
      PADLOCK.shackleLift = 0;
      PADLOCK.shackleTilt = 0;
      PADLOCK.scale = 1;
      PADLOCK.alpha = 1;

      UNLOCK_ANIM.phase = 'locked';
      UNLOCK_ANIM.timer = 0;
      buildSubTiles();

      particles = [];
      cameraShake = { time: 0, intensity: 0 };

      if (!keepPlayerPos) {
        PLAYER.x = 1.5;
        PLAYER.y = 2.1;
        PLAYER.targetX = null;
        PLAYER.targetY = null;
      } else {
        // 만약 플레이어가 새로 열렸던 구역(x >= 4)에 있다면 기존 구역으로 안전 이동
        if (PLAYER.x > 3.7) {
          PLAYER.x = 1.6;
          PLAYER.y = 2.1;
          PLAYER.targetX = null;
          PLAYER.targetY = null;
        }
      }

      updateHUDStatus();
    }

    function updateHUDStatus() {
      currentModeBadgeEl.textContent = `연출: ${MODE_NAMES[UNLOCK_ANIM.mode]}`;
      if (UNLOCK_ANIM.phase === 'locked') {
        stateLabelEl.textContent = '상태: 미해금 (발판 위에 서서 게이지 충전)';
        statusHintEl.innerHTML = `바닥 클릭 / WASD / 방향키로 이동해 <span class="text-[#569e12]">[새 구역]</span> 발판 위에 서세요!`;
      } else if (UNLOCK_ANIM.phase === 'padlock_seq') {
        stateLabelEl.textContent = '상태: 자물쇠 해제 중...';
        statusHintEl.innerHTML = `🔓 자물쇠가 열리고 있습니다!`;
      } else if (UNLOCK_ANIM.phase === 'field_anim') {
        stateLabelEl.textContent = `상태: [${MODE_NAMES[UNLOCK_ANIM.mode]}] 해금 연출 진행 중!`;
        statusHintEl.innerHTML = `✨ <strong>${MODE_NAMES[UNLOCK_ANIM.mode]}</strong> 애니메이션 실행 중...`;
      } else if (UNLOCK_ANIM.phase === 'unlocked') {
        stateLabelEl.textContent = '상태: 구역 해금 완료! (새 구역 이동 가능)';
        statusHintEl.innerHTML = `🎉 해금 완료! 새 구역을 걸어다니거나 다른 연출 버튼을 눌러 테스트해보세요.`;
      }
    }

    // ----------------------------------------------------------------------------
    // 5. UI 이벤트 바인딩
    // ----------------------------------------------------------------------------
    modeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        sfx.init();
        const selectedMode = btn.dataset.mode;
        UNLOCK_ANIM.mode = selectedMode;

        modeButtons.forEach(b => b.classList.remove('mode-active'));
        btn.classList.add('mode-active');

        // 이미 해금되었거나 진행 중이면 바로 재테스트 가능하도록 깔끔하게 초기화
        if (UNLOCK_ANIM.phase !== 'locked') {
          resetSimulation(true);
          showToast(`[${MODE_NAMES[selectedMode]}] 모드로 초기화되었습니다!`);
        } else {
          updateHUDStatus();
          showToast(`해금 연출 변경: ${MODE_NAMES[selectedMode]}`);
        }
        sfx.playTone(620, 'triangle', 0.08, 0.1);
      });
    });

    autoWalkBtn.addEventListener('click', () => {
      sfx.init();
      if (UNLOCK_ANIM.phase !== 'locked') {
        resetSimulation(true);
      }
      // 발판 정중앙으로 자동 이동 목적지 설정
      PLAYER.targetX = UNLOCK_PAD.x + UNLOCK_PAD.size * 0.5;
      PLAYER.targetY = UNLOCK_PAD.y + UNLOCK_PAD.size * 0.5;
      sfx.playTone(540, 'sine', 0.08, 0.1, 0, 720);
    });

    resetBtn.addEventListener('click', () => {
      sfx.init();
      resetSimulation(false);
      sfx.playTone(440, 'triangle', 0.1, 0.1, 0, 320);
      showToast('미해금 상태로 초기화되었습니다.');
    });

    soundToggleBtn.addEventListener('click', () => {
      sfx.enabled = !sfx.enabled;
      soundToggleBtn.textContent = sfx.enabled ? '🔊' : '🔇';
      if (sfx.enabled) {
        sfx.init();
        sfx.playTone(660, 'sine', 0.08, 0.1);
      }
    });

    // 키보드 입력
    window.addEventListener('keydown', (e) => {
      keysPressed[e.key.toLowerCase()] = true;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd'].includes(e.key) ||
          ['w', 'a', 's', 'd'].includes(e.key.toLowerCase())) {
        PLAYER.targetX = null;
        PLAYER.targetY = null;
      }
    });

    window.addEventListener('keyup', (e) => {
      keysPressed[e.key.toLowerCase()] = false;
    });

    // 포인터(마우스/터치) 클릭 및 드래그 이동
    let isPointerDown = false;
    function handlePointerMoveGoal(clientX, clientY) {
      sfx.init();
      const rect = canvas.getBoundingClientRect();
      const sx = clientX - rect.left;
      const sy = clientY - rect.top;
      const wPos = screenToWorld(sx, sy);

      // 현재 이동 가능한 구역 내로 클램핑
      const maxAllowX = (UNLOCK_ANIM.phase === 'unlocked') ? LOCKED_ZONE.maxX - 0.25 : EXISTING_FIELD.maxX - 0.25;
      const clampedX = Math.max(0.25, Math.min(maxAllowX, wPos.x));
      const clampedY = Math.max(0.25, Math.min(EXISTING_FIELD.maxY - 0.25, wPos.y));

      PLAYER.targetX = clampedX;
      PLAYER.targetY = clampedY;

      // 바닥 클릭 링 이펙트 생성
      spawnGroundRing(clampedX, clampedY);
    }

    canvas.addEventListener('pointerdown', (e) => {
      isPointerDown = true;
      handlePointerMoveGoal(e.clientX, e.clientY);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;
      handlePointerMoveGoal(e.clientX, e.clientY);
    });

    window.addEventListener('pointerup', () => {
      isPointerDown = false;
    });

    // ----------------------------------------------------------------------------
    // 6. 파티클 이펙트 생성기
    // ----------------------------------------------------------------------------
    function spawnGroundRing(wx, wy) {
      particles.push({
        type: 'ring',
        wx, wy, wz: 1,
        radius: 4,
        maxRadius: 24,
        life: 0.35,
        maxLife: 0.35,
        color: '#ffffff'
      });
    }

    function spawnCashParticle() {
      const padCenterX = UNLOCK_PAD.x + UNLOCK_PAD.size * 0.5;
      const padCenterY = UNLOCK_PAD.y + UNLOCK_PAD.size * 0.5;
      particles.push({
        type: 'cash',
        startX: PLAYER.x + (Math.random() - 0.5) * 0.25,
        startY: PLAYER.y + (Math.random() - 0.5) * 0.25,
        startZ: 34,
        endX: padCenterX + (Math.random() - 0.5) * 0.3,
        endY: padCenterY + (Math.random() - 0.5) * 0.3,
        endZ: 4,
        life: 0.32,
        maxLife: 0.32,
        rot: (Math.random() - 0.5) * 0.8
      });
    }

    function spawnLockBurst(wx, wy) {
      for (let i = 0; i < 18; i++) {
        const angle = (Math.PI * 2 * i) / 18 + Math.random() * 0.2;
        const speed = 1.4 + Math.random() * 2.4;
        particles.push({
          type: 'sparkle',
          wx, wy,
          wz: 28 + Math.random() * 14,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          vz: 45 + Math.random() * 55,
          size: 4 + Math.random() * 5,
          color: i % 2 === 0 ? '#ffd026' : '#ffffff',
          life: 0.55 + Math.random() * 0.2,
          maxLife: 0.75
        });
      }
    }

    function spawnDustCloud() {
      // 필드 낙하 착지 시 테두리 주변 먼지 구름
      for (let i = 0; i < 24; i++) {
        const edge = i % 4;
        let wx = LOCKED_ZONE.minX + Math.random() * 4;
        let wy = LOCKED_ZONE.minY + Math.random() * 4;
        if (edge === 0) wx = LOCKED_ZONE.minX;
        if (edge === 1) wx = LOCKED_ZONE.maxX;
        if (edge === 2) wy = LOCKED_ZONE.minY;
        if (edge === 3) wy = LOCKED_ZONE.maxY;

        particles.push({
          type: 'dust',
          wx, wy,
          wz: 2,
          vx: (wx - 6) * 0.65 + (Math.random() - 0.5) * 0.5,
          vy: (wy - 2) * 0.65 + (Math.random() - 0.5) * 0.5,
          vz: 12 + Math.random() * 18,
          size: 8 + Math.random() * 8,
          life: 0.55 + Math.random() * 0.25,
          maxLife: 0.8
        });
      }
    }

    // ----------------------------------------------------------------------------
    // 7. 이징(Easing) 수학 함수 모음
    // ----------------------------------------------------------------------------
    function easeOutBack(t) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }

    function easeOutElastic(t) {
      if (t === 0 || t === 1) return t;
      const c4 = (2 * Math.PI) / 3;
      return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    // ----------------------------------------------------------------------------
    // 8. 프레임 업데이트 로직 (Update)
    // ----------------------------------------------------------------------------
    function update(dt) {
      // 카메라 셰이크 감쇠
      if (cameraShake.time > 0) {
        cameraShake.time = Math.max(0, cameraShake.time - dt);
      }

      // 1) 플레이어 이동 처리
      let moveX = 0;
      let moveY = 0;
      if (keysPressed['w'] || keysPressed['arrowup'])    { moveX -= 1; moveY -= 1; }
      if (keysPressed['s'] || keysPressed['arrowdown'])  { moveX += 1; moveY += 1; }
      if (keysPressed['a'] || keysPressed['arrowleft'])  { moveX -= 1; moveY += 1; }
      if (keysPressed['d'] || keysPressed['arrowright']) { moveX += 1; moveY -= 1; }

      if (moveX !== 0 || moveY !== 0) {
        const len = Math.hypot(moveX, moveY);
        moveX /= len;
        moveY /= len;
        PLAYER.x += moveX * PLAYER.speed * dt;
        PLAYER.y += moveY * PLAYER.speed * dt;
        PLAYER.facingX = moveX;
        PLAYER.facingY = moveY;
        PLAYER.isMoving = true;
        PLAYER.walkCycle += dt * 13;
      } else if (PLAYER.targetX !== null && PLAYER.targetY !== null) {
        const dx = PLAYER.targetX - PLAYER.x;
        const dy = PLAYER.targetY - PLAYER.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 0.05) {
          const step = Math.min(dist, PLAYER.speed * dt);
          PLAYER.x += (dx / dist) * step;
          PLAYER.y += (dy / dist) * step;
          PLAYER.facingX = dx / dist;
          PLAYER.facingY = dy / dist;
          PLAYER.isMoving = true;
          PLAYER.walkCycle += dt * 13;
        } else {
          PLAYER.x = PLAYER.targetX;
          PLAYER.y = PLAYER.targetY;
          PLAYER.targetX = null;
          PLAYER.targetY = null;
          PLAYER.isMoving = false;
        }
      } else {
        PLAYER.isMoving = false;
        PLAYER.walkCycle = 0;
      }

      // 이동 경계 제한 (해금 전엔 x <= 3.78, 해금 후엔 x <= 7.78)
      const maxBoundX = (UNLOCK_ANIM.phase === 'unlocked') ? LOCKED_ZONE.maxX - 0.22 : EXISTING_FIELD.maxX - 0.22;
      PLAYER.x = Math.max(0.22, Math.min(maxBoundX, PLAYER.x));
      PLAYER.y = Math.max(0.22, Math.min(EXISTING_FIELD.maxY - 0.22, PLAYER.y));

      // 2) 해금 발판 충돌 & 게이지 충전
      const padMinX = UNLOCK_PAD.x - 0.1;
      const padMaxX = UNLOCK_PAD.x + UNLOCK_PAD.size + 0.1;
      const padMinY = UNLOCK_PAD.y - 0.1;
      const padMaxY = UNLOCK_PAD.y + UNLOCK_PAD.size + 0.1;

      PLAYER.onPad = (
        UNLOCK_ANIM.phase === 'locked' &&
        PLAYER.x >= padMinX && PLAYER.x <= padMaxX &&
        PLAYER.y >= padMinY && PLAYER.y <= padMaxY
      );

      if (UNLOCK_ANIM.phase === 'locked') {
        if (PLAYER.onPad) {
          UNLOCK_PAD.progress = Math.min(1, UNLOCK_PAD.progress + dt / UNLOCK_PAD.fillDuration);
          UNLOCK_PAD.scaleAnim += (1.06 - UNLOCK_PAD.scaleAnim) * Math.min(1, dt * 14);

          // 지폐 파티클 & 사운드 틱
          UNLOCK_PAD.coinEmitTimer += dt;
          if (UNLOCK_PAD.coinEmitTimer >= 0.11) {
            UNLOCK_PAD.coinEmitTimer = 0;
            spawnCashParticle();
            sfx.playCoinTick(UNLOCK_PAD.progress);
          }

          // 100% 도달 시 자물쇠 열림 시퀀스 진입!
          if (UNLOCK_PAD.progress >= 1) {
            UNLOCK_ANIM.phase = 'padlock_seq';
            PADLOCK.state = 'opening';
            PADLOCK.timer = 0;
            UNLOCK_ANIM.rippleOrigin = { x: PLAYER.x, y: PLAYER.y };
            sfx.playLockPop();
            updateHUDStatus();
          }
        } else {
          // 발판에서 벗어나면 게이지가 천천히 줄어듦
          UNLOCK_PAD.progress = Math.max(0, UNLOCK_PAD.progress - dt * 0.35);
          UNLOCK_PAD.scaleAnim += (1.0 - UNLOCK_PAD.scaleAnim) * Math.min(1, dt * 10);
        }
      } else {
        // 해금 시작 후 발판 부드럽게 축소 & 페이드아웃
        UNLOCK_PAD.alpha = Math.max(0, UNLOCK_PAD.alpha - dt * 3.5);
        UNLOCK_PAD.scaleAnim = Math.max(0.7, UNLOCK_PAD.scaleAnim - dt * 0.8);
      }

      // 3) 자물쇠 열림 애니메이션 (3번 GIF 참조: 걸이 위로 열림 -> 잠시 정지 -> 펑 사라짐)
      if (UNLOCK_ANIM.phase === 'padlock_seq') {
        PADLOCK.timer += dt;

        if (PADLOCK.state === 'opening') {
          // 0 ~ 0.32초: 걸이(shackle)가 위로 경쾌하게 솟아오르며 열림
          const t = Math.min(1, PADLOCK.timer / 0.32);
          PADLOCK.shackleLift = easeOutBack(t);
          PADLOCK.shackleTilt = -0.14 * t;
          PADLOCK.scale = 1 + Math.sin(t * Math.PI) * 0.12;

          if (PADLOCK.timer >= 0.44) {
            PADLOCK.state = 'vanishing';
            PADLOCK.timer = 0;
            spawnLockBurst(PADLOCK.worldX, PADLOCK.worldY);
            sfx.playUnlockFanfare();
          }
        } else if (PADLOCK.state === 'vanishing') {
          // 0 ~ 0.22초: 자물쇠가 살짝 커지며 투명하게 사라짐과 동시에 필드 해금 연출 시작
          const t = Math.min(1, PADLOCK.timer / 0.22);
          PADLOCK.scale = 1.0 + t * 0.45;
          PADLOCK.alpha = 1 - t;

          if (t >= 1) {
            PADLOCK.state = 'gone';
            UNLOCK_ANIM.phase = 'field_anim';
            UNLOCK_ANIM.timer = 0;
            // 모드별 지속시간 설정
            const durations = {
              wave: 1.15,
              expand: 0.85,
              ripple: 1.15,
              drop: 0.85,
              bounce: 0.95
            };
            UNLOCK_ANIM.duration = durations[UNLOCK_ANIM.mode] || 1.0;
            updateHUDStatus();
          }
        }
      }

      // 4) 선택된 5종 필드 해금 애니메이션 진행
      if (UNLOCK_ANIM.phase === 'field_anim') {
        UNLOCK_ANIM.timer += dt;
        const p = Math.min(1, UNLOCK_ANIM.timer / UNLOCK_ANIM.duration);

        if (UNLOCK_ANIM.mode === 'wave') {
          // 타일 파도형식: waveOrder(0~6) 순차 팝업
          UNLOCK_ANIM.subTiles.forEach((tile) => {
            const delay = tile.waveOrder * 0.085;
            const localT = Math.max(0, Math.min(1, (UNLOCK_ANIM.timer - delay) / 0.42));
            tile.progress = localT;
            if (localT > 0.05 && !tile.popped) {
              tile.popped = true;
              sfx.playTilePop(tile.waveOrder);
            }
          });
        } else if (UNLOCK_ANIM.mode === 'ripple') {
          // 원형 확산: 플레이어 위치 기준 반경이 넓어지며 닿은 타일이 생성
          const maxDist = 6.2;
          const currentRadius = p * maxDist;
          UNLOCK_ANIM.subTiles.forEach((tile, idx) => {
            const dist = Math.hypot(tile.cx - UNLOCK_ANIM.rippleOrigin.x, tile.cy - UNLOCK_ANIM.rippleOrigin.y);
            if (currentRadius >= dist) {
              if (!tile.popped) {
                tile.popped = true;
                sfx.playTilePop(idx);
              }
              tile.progress = Math.min(1, tile.progress + dt * 3.4);
            }
          });
        } else if (UNLOCK_ANIM.mode === 'drop') {
          // 필드 낙하: 0.48 시점 착지 시 쿵! 효과음 + 먼지 + 화면 흔들림
          if (p >= 0.48 && !UNLOCK_ANIM._dropImpacted) {
            UNLOCK_ANIM._dropImpacted = true;
            cameraShake = { time: 0.28, intensity: 9 };
            spawnDustCloud();
            sfx.playHeavyThud();
          }
        }

        if (p >= 1) {
          UNLOCK_ANIM.phase = 'unlocked';
          UNLOCK_ANIM._dropImpacted = false;
          UNLOCK_ANIM.subTiles.forEach(t => { t.progress = 1; t.popped = true; });
          updateHUDStatus();
        }
      }

      // 5) 파티클 업데이트
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.life -= dt;
        if (pt.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        if (pt.type === 'ring') {
          const t = 1 - pt.life / pt.maxLife;
          pt.radius = 4 + t * (pt.maxRadius - 4);
        } else if (pt.type === 'sparkle' || pt.type === 'dust') {
          pt.wx += pt.vx * dt;
          pt.wy += pt.vy * dt;
          pt.wz += pt.vz * dt;
          if (pt.type === 'sparkle') pt.vz -= 160 * dt;
        }
      }
    }

    // ----------------------------------------------------------------------------
    // 9. 렌더링 함수 모음 (Render)
    // ----------------------------------------------------------------------------

    // 배경 풀밭 & 은은한 아이소메트릭 격자 패턴
    function drawBackground(w, h) {
      ctx.fillStyle = '#d6e594';
      ctx.fillRect(0, 0, w, h);

      // 은은한 다이아몬드 타일 패턴 (첨부 3번 GIF 배경 느낌)
      ctx.save();
      ctx.strokeStyle = 'rgba(186, 206, 114, 0.55)';
      ctx.lineWidth = 1.25;

      const minG = -14;
      const maxG = 22;
      ctx.beginPath();
      for (let i = minG; i <= maxG; i++) {
        const p1 = worldToScreen(i, minG);
        const p2 = worldToScreen(i, maxG);
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);

        const q1 = worldToScreen(minG, i);
        const q2 = worldToScreen(maxG, i);
        ctx.moveTo(q1.x, q1.y);
        ctx.lineTo(q2.x, q2.y);
      }
      ctx.stroke();
      ctx.restore();
    }

    // 3D 압출된 아이소메트릭 플랫폼 블록 그리기 (임의의 사각형 영역 [x0, x1] x [y0, y1])
    function drawIsoPlatform(x0, x1, y0, y1, zHeight = 0, options = {}) {
      const {
        topColor = '#fffaf0',
        leftSideColor = '#dfd0b4',
        rightSideColor = '#cbb896',
        borderColor = '#b9a37e',
        showGrid = true,
        shadowAlpha = 0.16,
        alpha = 1
      } = options;

      const thick = ISO.thickness * ISO.scale;
      const top    = worldToScreen(x0, y0, zHeight);
      const right  = worldToScreen(x1, y0, zHeight);
      const bottom = worldToScreen(x1, y1, zHeight);
      const left   = worldToScreen(x0, y1, zHeight);

      ctx.save();
      ctx.globalAlpha = alpha;

      // 바닥 접지 그림자 (zHeight가 높을수록 살짝 작고 옅어짐)
      if (shadowAlpha > 0) {
        const shadowScale = Math.max(0.55, 1 - zHeight / 320);
        const sTop    = worldToScreen(x0, y0, 0);
        const sRight  = worldToScreen(x1, y0, 0);
        const sBottom = worldToScreen(x1, y1, 0);
        const sLeft   = worldToScreen(x0, y1, 0);

        ctx.fillStyle = `rgba(110, 128, 48, ${shadowAlpha * shadowScale})`;
        ctx.beginPath();
        ctx.moveTo(sTop.x, sTop.y + thick * 0.75);
        ctx.lineTo(sRight.x + 4, sRight.y + thick * 0.85);
        ctx.lineTo(sBottom.x, sBottom.y + thick * 1.15);
        ctx.lineTo(sLeft.x - 4, sLeft.y + thick * 0.85);
        ctx.closePath();
        ctx.fill();
      }

      // 좌하단 3D 두께 면 (Left-Front)
      ctx.fillStyle = leftSideColor;
      ctx.beginPath();
      ctx.moveTo(left.x, left.y);
      ctx.lineTo(bottom.x, bottom.y);
      ctx.lineTo(bottom.x, bottom.y + thick);
      ctx.lineTo(left.x, left.y + thick);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // 우하단 3D 두께 면 (Right-Front)
      ctx.fillStyle = rightSideColor;
      ctx.beginPath();
      ctx.moveTo(bottom.x, bottom.y);
      ctx.lineTo(right.x, right.y);
      ctx.lineTo(right.x, right.y + thick);
      ctx.lineTo(bottom.x, bottom.y + thick);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 상단 바닥 면
      ctx.fillStyle = topColor;
      ctx.beginPath();
      ctx.moveTo(top.x, top.y);
      ctx.lineTo(right.x, right.y);
      ctx.lineTo(bottom.x, bottom.y);
      ctx.lineTo(left.x, left.y);
      ctx.closePath();
      ctx.fill();

      // 내부 타일 격자선
      if (showGrid) {
        ctx.strokeStyle = 'rgba(205, 187, 155, 0.55)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (let gx = Math.ceil(x0); gx < x1; gx++) {
          const a = worldToScreen(gx, y0, zHeight);
          const b = worldToScreen(gx, y1, zHeight);
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
        }
        for (let gy = Math.ceil(y0); gy < y1; gy++) {
          const a = worldToScreen(x0, gy, zHeight);
          const b = worldToScreen(x1, gy, zHeight);
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
        }
        ctx.stroke();
      }

      // 상단 외곽 테두리
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(top.x, top.y);
      ctx.lineTo(right.x, right.y);
      ctx.lineTo(bottom.x, bottom.y);
      ctx.lineTo(left.x, left.y);
      ctx.closePath();
      ctx.stroke();

      ctx.restore();
    }

    // 미해금 구역 점선 테두리 (타일 없이 바닥에 점선만 표시)
    function drawLockedDashedZone() {
      const top    = worldToScreen(LOCKED_ZONE.minX, LOCKED_ZONE.minY);
      const right  = worldToScreen(LOCKED_ZONE.maxX, LOCKED_ZONE.minY);
      const bottom = worldToScreen(LOCKED_ZONE.maxX, LOCKED_ZONE.maxY);
      const left   = worldToScreen(LOCKED_ZONE.minX, LOCKED_ZONE.maxY);

      ctx.save();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3.5 * ISO.scale;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.setLineDash([12 * ISO.scale, 10 * ISO.scale]);
      // 은은한 점선 흐름 애니메이션
      ctx.lineDashOffset = -performance.now() * 0.025;

      ctx.beginPath();
      ctx.moveTo(top.x, top.y);
      ctx.lineTo(right.x, right.y);
      ctx.lineTo(bottom.x, bottom.y);
      ctx.lineTo(left.x, left.y);
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }

    // 해금 발판 (첨부 1, 2 이미지의 "새 구역 / 💵 200" 카드 & 하단->상단 초록 게이지 충전을 아이소메트릭 바닥 투영으로 완벽 구현)
    function drawUnlockPad() {
      if (UNLOCK_PAD.alpha <= 0.01) return;

      const cx = UNLOCK_PAD.x + UNLOCK_PAD.size * 0.5;
      const cy = UNLOCK_PAD.y + UNLOCK_PAD.size * 0.5;
      const centerScreen = worldToScreen(cx, cy, 0);

      // 정사각형 로컬 좌표(-S/2 ~ +S/2)를 아이소메트릭 평면으로 사상하는 2D 아핀 변환 행렬
      // (1, 0) -> (+tileW/2, +tileH/2), (0, 1) -> (-tileW/2, +tileH/2)
      const hw = (ISO.tileW * ISO.scale) * 0.5;
      const hh = (ISO.tileH * ISO.scale) * 0.5;
      const cardUnits = UNLOCK_PAD.size * UNLOCK_PAD.scaleAnim;

      ctx.save();
      ctx.globalAlpha = UNLOCK_PAD.alpha;
      ctx.translate(centerScreen.x, centerScreen.y);
      ctx.transform(hw, hh, -hw, hh, 0, 0);

      // 이제 로컬 좌표계 (-cardUnits/2 ~ +cardUnits/2)는 완벽한 정사각형 카드처럼 다룰 수 있음!
      const S = cardUnits;
      const half = S * 0.5;
      const r = S * 0.16; // 둥근 모서리 반경

      function roundRectPath(x, y, w, h, radius) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + w - radius, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
        ctx.lineTo(x + w, y + h - radius);
        ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
        ctx.lineTo(x + radius, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
      }

      // 발판 그림자
      ctx.fillStyle = 'rgba(59, 35, 20, 0.18)';
      roundRectPath(-half + 0.03, -half + 0.04, S, S, r);
      ctx.fill();

      // 1) 크림색 배경 채우기 (#fcf6e8)
      ctx.fillStyle = '#fcf6e8';
      roundRectPath(-half, -half, S, S, r);
      ctx.fill();

      // 2) 하단 -> 상단으로 차오르는 라임그린 게이지 (#74c721) (첨부 2번 이미지 스타일)
      if (UNLOCK_PAD.progress > 0) {
        ctx.save();
        roundRectPath(-half, -half, S, S, r);
        ctx.clip();

        const fillH = S * UNLOCK_PAD.progress;
        ctx.fillStyle = '#74c721';
        ctx.fillRect(-half, half - fillH, S, fillH);

        // 게이지 상단 하이라이트 라인
        ctx.fillStyle = '#9be346';
        ctx.fillRect(-half, half - fillH, S, Math.min(fillH, S * 0.045));
        ctx.restore();
      }

      // 3) 4방향 확장 화살표 + 중앙 점선 사각형 아이콘 (첨부 1,2번 우측 아이콘)
      const darkBrown = '#3b2314';
      ctx.strokeStyle = darkBrown;
      ctx.fillStyle = '#ffffff';
      ctx.lineWidth = S * 0.026;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const iconCenterY = -S * 0.21;
      const boxHalf = S * 0.095;

      // 중앙 작은 점선 정사각형
      ctx.save();
      ctx.setLineDash([S * 0.035, S * 0.03]);
      ctx.strokeRect(-boxHalf, iconCenterY - boxHalf, boxHalf * 2, boxHalf * 2);
      ctx.restore();

      // 4개 모서리 대각선 화살표
      const dirs = [
        [-1, -1], [1, -1], [-1, 1], [1, 1]
      ];
      dirs.forEach(([dx, dy]) => {
        const sx = dx * (boxHalf + S * 0.035);
        const sy = iconCenterY + dy * (boxHalf + S * 0.035);
        const ex = dx * (boxHalf + S * 0.145);
        const ey = iconCenterY + dy * (boxHalf + S * 0.145);
        const head = S * 0.075;

        // 화살표 몸통 & 머리 외곽선
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(ex, ey);
        ctx.moveTo(ex - dx * head, ey);
        ctx.lineTo(ex, ey);
        ctx.lineTo(ex, ey - dy * head);
        ctx.stroke();
      });

      // 4) "새 구역" 텍스트
      ctx.fillStyle = darkBrown;
      ctx.font = `900 ${S * 0.155}px "Noto Sans KR", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('새 구역', 0, S * 0.075);

      // 5) 하단 연한 살구색 알약(Pill) 배지 (#fce6ad) + 지폐 아이콘 + 남은 비용 숫자
      const pillW = S * 0.78;
      const pillH = S * 0.22;
      const pillY = S * 0.21;
      ctx.fillStyle = '#fce6ad';
      roundRectPath(-pillW * 0.5, pillY, pillW, pillH, pillH * 0.5);
      ctx.fill();

      // 지폐 다발 아이콘 (좌측)
      const billX = -pillW * 0.24;
      const billY = pillY + pillH * 0.5;
      const bw = S * 0.16;
      const bh = S * 0.10;
      ctx.save();
      ctx.translate(billX, billY);
      ctx.rotate(-0.18);
      ctx.fillStyle = '#5bb82a';
      ctx.strokeStyle = darkBrown;
      ctx.lineWidth = S * 0.018;
      ctx.fillRect(-bw * 0.5, -bh * 0.5, bw, bh);
      ctx.strokeRect(-bw * 0.5, -bh * 0.5, bw, bh);
      // 지폐 띠
      ctx.fillStyle = '#d7f598';
      ctx.fillRect(-bw * 0.14, -bh * 0.5, bw * 0.28, bh);
      ctx.restore();

      // 남은 금액 카운트다운 (200 -> 0)
      const remainCost = Math.max(0, Math.ceil(UNLOCK_PAD.cost * (1 - UNLOCK_PAD.progress)));
      ctx.fillStyle = darkBrown;
      ctx.font = `900 ${S * 0.16}px "Noto Sans KR", sans-serif`;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(remainCost), -pillW * 0.06, pillY + pillH * 0.52);

      // 6) 외곽 굵은 다크브라운 테두리 (#3b2314)
      ctx.strokeStyle = darkBrown;
      ctx.lineWidth = S * 0.042;
      roundRectPath(-half, -half, S, S, r);
      ctx.stroke();

      ctx.restore();
    }

    // 2.5D 귀여운 자물쇠 그리기 (첨부 3번 GIF 스타일: 황금색 몸통 + 은색 U자 걸이 + 위로 열림 애니메이션)
    function drawPadlock() {
      if (PADLOCK.state === 'gone' || PADLOCK.alpha <= 0.01) return;

      const pos = worldToScreen(PADLOCK.worldX, PADLOCK.worldY, 0);
      const bob = (PADLOCK.state === 'locked') ? Math.sin(performance.now() * 0.004) * 3.5 : 0;
      const sc = ISO.scale * PADLOCK.scale;

      ctx.save();
      ctx.globalAlpha = PADLOCK.alpha;
      ctx.translate(pos.x, pos.y - 12 * ISO.scale + bob);
      ctx.scale(sc, sc);

      const outline = '#3b2314';

      // 바닥 그림자
      ctx.fillStyle = 'rgba(95, 112, 42, 0.28)';
      ctx.beginPath();
      ctx.ellipse(0, 14 - bob * 0.5, 22, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // 1) 은색 U자 걸이 (Shackle) - 해금 시 위로 솟아오르며 열림!
      ctx.save();
      const liftY = -PADLOCK.shackleLift * 18;
      ctx.translate(0, liftY);
      ctx.rotate(PADLOCK.shackleTilt);

      // 걸이 외곽 (두꺼운 스트로크로 둥근 아치 표현)
      ctx.lineCap = 'round';
      // 다크브라운 외곽선
      ctx.strokeStyle = outline;
      ctx.lineWidth = 13;
      ctx.beginPath();
      ctx.arc(0, -14, 13, Math.PI, 0, false);
      ctx.lineTo(13, -2);
      ctx.moveTo(-13, -14);
      ctx.lineTo(-13, -2);
      ctx.stroke();

      // 은백색 내부 채움
      ctx.strokeStyle = '#dce3ec';
      ctx.lineWidth = 6.5;
      ctx.beginPath();
      ctx.arc(0, -14, 13, Math.PI, 0, false);
      ctx.lineTo(13, -2);
      ctx.moveTo(-13, -14);
      ctx.lineTo(-13, -2);
      ctx.stroke();
      ctx.restore();

      // 2) 황금색 자물쇠 몸통 (#ffd026)
      const bw = 42;
      const bh = 34;
      const bx = -bw * 0.5;
      const by = -8;
      const br = 9;

      // 몸통 그림자 입체감
      ctx.fillStyle = '#f2a900';
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, br);
      ctx.fill();

      // 몸통 메인 밝은 황금색
      ctx.fillStyle = '#ffd026';
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh - 4, br);
      ctx.fill();

      // 몸통 테두리
      ctx.strokeStyle = outline;
      ctx.lineWidth = 3.8;
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, br);
      ctx.stroke();

      // 3) 중앙 열쇠구멍
      ctx.fillStyle = outline;
      ctx.beginPath();
      ctx.arc(0, by + 13, 4.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-2.5, by + 14);
      ctx.lineTo(2.5, by + 14);
      ctx.lineTo(3.6, by + 23);
      ctx.lineTo(-3.6, by + 23);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    // 5종 필드 해금 애니메이션 렌더링
    function drawUnlockingField() {
      if (UNLOCK_ANIM.phase === 'locked' || UNLOCK_ANIM.phase === 'padlock_seq') {
        return;
      }

      if (UNLOCK_ANIM.phase === 'unlocked') {
        // 완전히 해금된 상태: 기존 필드와 동일한 4x4 플랫폼으로 렌더링
        drawIsoPlatform(LOCKED_ZONE.minX, LOCKED_ZONE.maxX, LOCKED_ZONE.minY, LOCKED_ZONE.maxY, 0);
        return;
      }

      const p = Math.min(1, UNLOCK_ANIM.timer / UNLOCK_ANIM.duration);
      const mode = UNLOCK_ANIM.mode;

      if (mode === 'wave' || mode === 'ripple') {
        // [타일 파도형식] & [원형 확산]: 16개 소단위 타일이 개별 팝업 애니메이션으로 생성
        // 아이소메트릭 깊이(gx + gy) 순서대로 정렬해 그려야 겹침이 자연스러움
        const sorted = [...UNLOCK_ANIM.subTiles].sort((a, b) => (a.gx + a.gy) - (b.gx + b.gy));

        sorted.forEach((tile) => {
          if (tile.progress <= 0) return;
          const e = easeOutBack(tile.progress);
          const scale = Math.max(0.01, e);
          const zLift = (1 - tile.progress) * 28;
          const half = 0.5 * Math.min(1.08, scale);

          drawIsoPlatform(
            tile.cx - half,
            tile.cx + half,
            tile.cy - half,
            tile.cy + half,
            zLift,
            {
              showGrid: false,
              shadowAlpha: 0.12 * tile.progress,
              alpha: Math.min(1, tile.progress * 1.6)
            }
          );
        });

        // [원형 확산] 모드일 때 플레이어로부터 퍼져나가는 빛나는 원형 파동 링 그리기
        if (mode === 'ripple') {
          const originScreen = worldToScreen(UNLOCK_ANIM.rippleOrigin.x, UNLOCK_ANIM.rippleOrigin.y, 2);
          const maxR = 6.2 * (ISO.tileW * ISO.scale) * 0.5;
          const curR = p * maxR;

          ctx.save();
          ctx.translate(originScreen.x, originScreen.y);
          ctx.scale(1, 0.5); // 아이소메트릭 원근 납작화
          ctx.strokeStyle = `rgba(255, 255, 255, ${(1 - p) * 0.9})`;
          ctx.lineWidth = 7 * ISO.scale;
          ctx.beginPath();
          ctx.arc(0, 0, curR, 0, Math.PI * 2);
          ctx.stroke();

          ctx.strokeStyle = `rgba(116, 199, 33, ${(1 - p) * 0.7})`;
          ctx.lineWidth = 14 * ISO.scale;
          ctx.beginPath();
          ctx.arc(0, 0, Math.max(0, curR - 8), 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      } else if (mode === 'expand') {
        // [필드확장]: 기존 필드(x=4)에서 새 구역 끝(x=8)까지 쭈욱 늘어남
        const stretch = easeOutBack(p);
        const curMaxX = LOCKED_ZONE.minX + 4 * Math.min(1.04, stretch);
        drawIsoPlatform(LOCKED_ZONE.minX, curMaxX, LOCKED_ZONE.minY, LOCKED_ZONE.maxY, 0, {
          showGrid: p > 0.75
        });
      } else if (mode === 'drop') {
        // [필드 낙하]: 하늘 높이에서 중력 가속도로 떨어져 착지 후 쫀득한 스쿼시 바운스
        let zHeight = 0;
        let squashScale = 1;
        const impactT = 0.48;

        if (p < impactT) {
          // 자유낙하 (가속)
          const fallT = p / impactT;
          zHeight = (1 - fallT * fallT) * 340;
        } else {
          // 착지 후 쫀득한 바운스 감쇠
          const bT = (p - impactT) / (1 - impactT);
          const damp = Math.exp(-bT * 5.5);
          zHeight = Math.abs(Math.sin(bT * Math.PI * 2.5)) * 22 * damp;
          squashScale = 1 + Math.sin(bT * Math.PI * 3) * 0.055 * damp;
        }

        const cx = 6.0;
        const cy = 2.0;
        const half = 2.0 * squashScale;
        drawIsoPlatform(cx - half, cx + half, cy - half, cy + half, zHeight);
      } else if (mode === 'bounce') {
        // [튕김]: 구역 정중앙에서 스케일 0부터 탄성 오버슈트로 뿅! 튀어나옴
        const elastic = easeOutElastic(p);
        const sc = Math.max(0.02, elastic);
        const cx = 6.0;
        const cy = 2.0;
        const half = 2.0 * sc;
        const popZ = Math.sin(Math.min(1, p * 1.4) * Math.PI) * 18;
        drawIsoPlatform(cx - half, cx + half, cy - half, cy + half, popZ);
      }
    }

    // 귀여운 3등신 캐주얼 타이쿤 플레이어 캐릭터 그리기
    function drawPlayer() {
      const pos = worldToScreen(PLAYER.x, PLAYER.y, 0);
      const bounce = PLAYER.isMoving ? Math.abs(Math.sin(PLAYER.walkCycle)) * 6 : Math.sin(performance.now() * 0.005) * 1.5;
      const sc = ISO.scale;

      ctx.save();
      ctx.translate(pos.x, pos.y);
      ctx.scale(sc, sc);

      // 캐릭터 발밑 그림자
      ctx.fillStyle = 'rgba(59, 35, 20, 0.22)';
      ctx.beginPath();
      ctx.ellipse(0, 2, 13 - bounce * 0.4, 6.5 - bounce * 0.2, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.translate(0, -bounce);
      const outline = '#3b2314';

      // 다리 (걷기 스윙)
      const legSwing = PLAYER.isMoving ? Math.sin(PLAYER.walkCycle) * 4 : 0;
      ctx.fillStyle = '#3b5998';
      ctx.strokeStyle = outline;
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.roundRect(-7, -9 + legSwing * 0.4, 5.5, 9, 3);
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.roundRect(1.5, -9 - legSwing * 0.4, 5.5, 9, 3);
      ctx.fill(); ctx.stroke();

      // 몸통 (상큼한 민트/화이트 유니폼)
      ctx.fillStyle = '#4ecdc4';
      ctx.beginPath();
      ctx.roundRect(-10, -23, 20, 16, 7);
      ctx.fill();
      ctx.stroke();

      // 앞치마 포인트
      ctx.fillStyle = '#fffaf0';
      ctx.beginPath();
      ctx.roundRect(-6, -19, 12, 11, 3);
      ctx.fill();

      // 머리 (동글동글 치비 스타일)
      ctx.fillStyle = '#ffe0bd';
      ctx.beginPath();
      ctx.arc(0, -33, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 귀여운 모자 (오렌지 바이저 캡)
      ctx.fillStyle = '#ff7b39';
      ctx.beginPath();
      ctx.arc(0, -36, 13.2, Math.PI, 0, false);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 챙 방향
      const dirSign = (PLAYER.facingX - PLAYER.facingY) >= 0 ? 1 : -1;
      ctx.fillStyle = '#ff985e';
      ctx.beginPath();
      ctx.ellipse(dirSign * 6, -36, 9, 3.5, dirSign * 0.15, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 눈 & 볼터치
      const eyeOffsetX = dirSign * 3.5;
      ctx.fillStyle = outline;
      ctx.beginPath();
      ctx.arc(eyeOffsetX - 3.5, -31.5, 1.8, 0, Math.PI * 2);
      ctx.arc(eyeOffsetX + 3.5, -31.5, 1.8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(255, 118, 118, 0.55)';
      ctx.beginPath();
      ctx.ellipse(eyeOffsetX - 6, -28.5, 2.5, 1.5, 0, 0, Math.PI * 2);
      ctx.ellipse(eyeOffsetX + 6, -28.5, 2.5, 1.5, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // 파티클 렌더링
    function drawParticles() {
      particles.forEach((pt) => {
        const alpha = Math.max(0, pt.life / pt.maxLife);

        if (pt.type === 'ring') {
          const pos = worldToScreen(pt.wx, pt.wy, pt.wz);
          ctx.save();
          ctx.translate(pos.x, pos.y);
          ctx.scale(1, 0.5);
          ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.9})`;
          ctx.lineWidth = 3 * ISO.scale;
          ctx.beginPath();
          ctx.arc(0, 0, pt.radius * ISO.scale, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        } else if (pt.type === 'cash') {
          const t = 1 - alpha;
          const wx = pt.startX + (pt.endX - pt.startX) * t;
          const wy = pt.startY + (pt.endY - pt.startY) * t;
          const arcZ = Math.sin(t * Math.PI) * 38;
          const wz = pt.startZ + (pt.endZ - pt.startZ) * t + arcZ;
          const pos = worldToScreen(wx, wy, wz);

          ctx.save();
          ctx.translate(pos.x, pos.y);
          ctx.rotate(pt.rot + t * 4);
          ctx.scale(ISO.scale, ISO.scale);
          ctx.fillStyle = '#68c92e';
          ctx.strokeStyle = '#3b2314';
          ctx.lineWidth = 2;
          ctx.fillRect(-9, -5.5, 18, 11);
          ctx.strokeRect(-9, -5.5, 18, 11);
          ctx.fillStyle = '#d7f598';
          ctx.fillRect(-2.5, -5.5, 5, 11);
          ctx.restore();
        } else if (pt.type === 'sparkle') {
          const pos = worldToScreen(pt.wx, pt.wy, pt.wz);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.translate(pos.x, pos.y);
          ctx.scale(ISO.scale * alpha, ISO.scale * alpha);
          ctx.fillStyle = pt.color;
          ctx.strokeStyle = '#3b2314';
          ctx.lineWidth = 1.8;

          // 4각 반짝이 별 모양
          const r = pt.size;
          ctx.beginPath();
          ctx.moveTo(0, -r * 1.5);
          ctx.quadraticCurveTo(0, 0, r * 1.5, 0);
          ctx.quadraticCurveTo(0, 0, 0, r * 1.5);
          ctx.quadraticCurveTo(0, 0, -r * 1.5, 0);
          ctx.quadraticCurveTo(0, 0, 0, -r * 1.5);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        } else if (pt.type === 'dust') {
          const pos = worldToScreen(pt.wx, pt.wy, pt.wz);
          ctx.save();
          ctx.globalAlpha = alpha * 0.65;
          ctx.fillStyle = '#fffaf0';
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, pt.size * ISO.scale * (1.2 - alpha * 0.4), 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      });
    }

    // 전체 씬 렌더링
    function render() {
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.width / dpr;
      const h = canvas.height / dpr;

      ctx.save();
      ctx.scale(dpr, dpr);

      // 카메라 마이크로 셰이크 적용
      if (cameraShake.time > 0) {
        const mag = cameraShake.intensity * (cameraShake.time / 0.28);
        ctx.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
      }

      // 1. 풀밭 & 격자 배경
      drawBackground(w, h);

      // 2. 미해금 구역 점선 테두리 (해금 전까지만 바닥에 표시)
      if (UNLOCK_ANIM.phase === 'locked' || UNLOCK_ANIM.phase === 'padlock_seq') {
        drawLockedDashedZone();
      }

      // 3. 기존 해금된 필드 플랫폼 (4x4)
      drawIsoPlatform(EXISTING_FIELD.minX, EXISTING_FIELD.maxX, EXISTING_FIELD.minY, EXISTING_FIELD.maxY, 0);

      // 4. 새로 해금되는 필드 애니메이션 (5종)
      drawUnlockingField();

      // 5. 해금 발판 ("새 구역 / 200")
      drawUnlockPad();

      // 6. 플레이어 캐릭터 & 자물쇠 (깊이 순서 정렬)
      if (PLAYER.x + PLAYER.y < PADLOCK.worldX + PADLOCK.worldY) {
        drawPlayer();
        drawPadlock();
      } else {
        drawPadlock();
        drawPlayer();
      }

      // 7. 파티클 이펙트
      drawParticles();

      ctx.restore();
    }

    // ----------------------------------------------------------------------------
    // 10. 반응형 리사이즈 & 메인 애니메이션 루프
    // ----------------------------------------------------------------------------
    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);

      // 전체 8x4 월드(기존 4x4 + 신규 4x4)가 모바일/데스크톱 모두에서 화면 중앙에 예쁘게 들어오도록 자동 스케일링
      const minDim = Math.min(w * 0.88, h * 1.15);
      ISO.scale = Math.max(0.55, Math.min(1.22, minDim / 640));

      // 월드 중심점 (4.0, 2.0)이 화면 정중앙(살짝 위쪽, 하단 HUD 고려)에 오도록 원점 보정
      const hw = (ISO.tileW * ISO.scale) * 0.5;
      const hh = (ISO.tileH * ISO.scale) * 0.5;
      const centerWorldX = 4.0;
      const centerWorldY = 2.0;

      ISO.originX = w * 0.5 - (centerWorldX - centerWorldY) * hw;
      ISO.originY = h * 0.47 - (centerWorldX + centerWorldY) * hh;
    }

    window.addEventListener('resize', resizeCanvas);

    let lastTimestamp = 0;
    function gameLoop(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const dt = Math.min(0.05, (timestamp - lastTimestamp) / 1000);
      lastTimestamp = timestamp;

      update(dt);
      render();
      requestAnimationFrame(gameLoop);
    }

    window.onload = function () {
      resizeCanvas();
      resetSimulation(false);
      requestAnimationFrame(gameLoop);
    };
  </script>
</body>
</html>
