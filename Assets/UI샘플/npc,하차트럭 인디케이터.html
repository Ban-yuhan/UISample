<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NPC 잡담 · 알바 UI</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --tilt:52deg; --ink:#3b2418; --cream:#fdf3e6; --pill:#fbe0b5;
    --green:#86d12a; --yellow:#ffc531; --red:#ff5a3c; --blue:#4aa3ff;
    --grassA:#cfe9a3; --grassB:#c2e08e; --woodA:#e2b77f; --woodB:#d6a86f; --bg:#e9f4f7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--ink);overflow-x:hidden}
  .wrap{display:flex;flex-direction:column;align-items:center;padding:16px 16px 28px}
  h1{font-size:18px;font-weight:900;margin:6px 0 2px}
  .sub{font-size:13px;opacity:.65;margin-bottom:6px;text-align:center}

  .stageBox{width:100%;max-width:900px;position:relative;overflow:hidden}
  .stage{width:900px;height:600px;position:relative;transform-origin:top left}
  .scene{position:absolute;inset:0;perspective:1400px;perspective-origin:50% 20%}
  .world{position:absolute;left:50%;top:50%;width:792px;height:528px;margin:-235px 0 0 -396px;
    transform-style:preserve-3d;transform:rotateX(var(--tilt))}
  .slab{position:absolute;left:0;top:528px;width:792px;height:26px;background:linear-gradient(#9a6a46,#7a4f31);
    transform-origin:top center;transform:rotateX(-90deg);border-radius:0 0 6px 6px}
  .tile{position:absolute;width:88px;height:88px;background:var(--grassA);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.05)}
  .tile.alt{background:var(--grassB)}
  .tile.wood{background:var(--woodA);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3), inset 0 -22px 0 rgba(0,0,0,.04), inset 0 -44px 0 rgba(255,255,255,.05)}
  .tile.wood.alt{background:var(--woodB)}

  .anchor{position:absolute;width:0;height:0;transform-style:preserve-3d}
  .bb{position:absolute;width:56px;height:84px;left:-28px;top:-84px;transform-style:preserve-3d;
    transform-origin:50% 100%;transform:rotateX(calc(-1 * var(--tilt)))}
  .shadow{position:absolute;width:60px;height:22px;margin:-11px 0 0 -30px;border-radius:50%;
    background:radial-gradient(rgba(0,0,0,.35),rgba(0,0,0,0) 70%);transform:translateZ(2px)}
  .body{width:56px;height:84px;transform-origin:50% 100%;animation:idle 1.4s ease-in-out infinite}
  .body svg{display:block}
  @keyframes idle{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.96)}}
  .talk .body{animation:talk .28s ease-in-out 3}
  @keyframes talk{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .work .body{animation:work .36s ease-in-out infinite}
  @keyframes work{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
  .work.tired .body{animation:work 0.8s ease-in-out infinite}
  .rest .body{animation:none;transform:scaleY(.82)}
  .dead .body{animation:none;transform:rotate(-12deg) scaleY(.88)}

  /* ---------- 말풍선 ---------- */
  .bubble{position:absolute;left:50%;bottom:calc(100% + 10px);min-width:58px;height:48px;padding:0 12px;
    background:#fff;border:4px solid var(--ink);border-radius:18px;display:flex;align-items:center;justify-content:center;gap:2px;
    font-size:24px;line-height:1;white-space:nowrap;box-shadow:0 4px 0 rgba(59,36,24,.18);
    transform:translateX(-50%) scale(0);transform-origin:50% 120%;opacity:0;
    transition:transform .22s cubic-bezier(.3,1.7,.5,1), opacity .15s}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-13px;width:16px;height:16px;margin-left:-8px;background:#fff;
    border-right:4px solid var(--ink);border-bottom:4px solid var(--ink);transform:rotate(45deg);border-bottom-right-radius:4px}
  .bubble.show{transform:translateX(-50%) scale(1);opacity:1}
  .bubble.right{transform-origin:20% 120%}
  .dots{display:flex;gap:5px}
  .dots i{width:8px;height:8px;border-radius:50%;background:var(--ink);opacity:.35;animation:dot .9s infinite}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes dot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:.9;transform:translateY(-4px)}}

  /* ---------- 알바 오버헤드 UI ---------- */
  /* 기본: 피로도 미니 바 */
  .mini{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);display:flex;align-items:center;gap:3px;
    background:var(--cream);border:3px solid var(--ink);border-radius:12px;padding:2px 6px 2px 3px;
    box-shadow:0 3px 0 rgba(59,36,24,.2);transition:transform .18s, opacity .15s}
  .mini .face{font-size:15px;line-height:1}
  .mini .bar{width:50px;height:10px}
  .open .mini{transform:translateX(-50%) scale(0);opacity:0}

  /* 클릭 시: 상세 인디케이터 */
  .oh{position:absolute;left:50%;bottom:calc(100% + 10px);width:152px;
    background:var(--cream);border:4px solid var(--ink);border-radius:14px;padding:5px 7px 6px;
    box-shadow:0 4px 0 rgba(59,36,24,.2);
    transform:translateX(-50%) scale(0);transform-origin:50% 100%;opacity:0;pointer-events:none;
    transition:transform .25s cubic-bezier(.3,1.6,.5,1), opacity .15s}
  .open .oh{transform:translateX(-50%) scale(1);opacity:1}
  .oh .close{position:absolute;right:-12px;top:-12px;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--ink);
    font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}
  .oh.flash{animation:ohFlash .7s}
  @keyframes ohFlash{0%,100%{background:var(--cream)}30%{background:#fff3a6}}

  .clickable{cursor:pointer}
  .clickable:hover .body{filter:brightness(1.08) drop-shadow(0 0 4px #fff)}
  .shadow.sel{background:none;border:4px solid #ffd23f;box-shadow:0 0 0 3px var(--ink);width:70px;height:30px;margin:-15px 0 0 -35px;
    animation:selPulse 1s ease-in-out infinite}
  @keyframes selPulse{0%,100%{transform:translateZ(2px) scale(1)}50%{transform:translateZ(2px) scale(1.1)}}
  .oh .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .oh .name{font-size:13px;font-weight:900}
  .oh .state{font-size:11px;font-weight:800;padding:1px 7px;border-radius:9px;background:var(--pill)}
  .stat{display:grid;grid-template-columns:38px 1fr 30px;align-items:center;gap:4px;height:17px}
  .stat + .stat{margin-top:3px}
  .stat .lb{font-size:10.5px;font-weight:800;opacity:.8}
  .stat .val{font-size:10.5px;font-weight:900;text-align:right}
  .bar{height:11px;border-radius:6px;background:#e8dccb;border:2px solid var(--ink);overflow:hidden;position:relative}
  .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;transition:background-color .3s}
  .bar.exp i{background:var(--blue)}
  .lv{display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:900;color:#fff;
    background:var(--blue);border:2px solid var(--ink);border-radius:7px;height:17px;padding:0 3px;text-shadow:0 1px 0 var(--ink)}
  .stars{font-size:10px;letter-spacing:-1px;color:#ffb21f;-webkit-text-stroke:.6px var(--ink);margin-left:4px}
  .mini .emo{right:-20px;top:-14px;font-size:18px}
  .emo{position:absolute;right:-16px;top:-18px;font-size:22px;animation:emo 1.2s ease-in-out infinite}
  @keyframes emo{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .float{position:absolute;left:50%;bottom:calc(100% + 96px);transform:translateX(-50%);white-space:nowrap;
    font-size:16px;font-weight:900;color:#fff;text-shadow:0 2px 0 var(--ink),0 0 3px var(--ink);pointer-events:none}

  /* ---------- 하차 도크 & 트럭 ---------- */
  .tile.dock{background:#b9b5ad}.tile.dock.alt{background:#afaba3}
  .dockLine{position:absolute;left:0;top:8px;width:268px;height:92px;transform:translateZ(1px);
    border:4px dashed #ffd23f;border-left:none;border-radius:0 8px 8px 0}
  .truck{position:absolute;width:0;height:0;transform-style:preserve-3d}
  .truck.arrive{transition:left 1.9s cubic-bezier(.15,.6,.3,1)}
  .truck.leave{transition:left 1.7s cubic-bezier(.6,0,.9,.4)}
  .rig{position:absolute;transform-style:preserve-3d}
  .truck.moving .rig{animation:rumble .16s linear infinite}
  @keyframes rumble{0%,100%{transform:translateZ(0)}50%{transform:translateZ(1.6px)}}
  .bx{position:absolute;width:0;height:0;transform-style:preserve-3d}
  .fc{position:absolute;border:3px solid var(--ink);overflow:visible}
  .wheel{position:absolute;top:-12px;width:26px;height:26px;border-radius:50%;background:#2c2c30;border:3px solid var(--ink);
    box-shadow:inset 0 0 0 5px #55555c}
  .logo{position:absolute;left:10px;right:10px;top:22px;height:24px;background:#4a90e2;border:2px solid var(--ink);border-radius:5px;
    transform:scaleY(-1);color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;letter-spacing:1px}
  .tshadow{position:absolute;left:-6px;top:-4px;width:250px;height:84px;border-radius:14px;background:rgba(0,0,0,.18);filter:blur(4px);transform:translateZ(.5px)}

  .indWrap{position:absolute;width:0;height:0;z-index:4}
  .tbb{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;transform-origin:0 0;transform:rotateX(calc(-1 * var(--tilt)))}
  .tind{position:absolute;left:0;bottom:0;display:flex;flex-direction:column;width:146px;padding:7px 8px 8px;
    background:var(--cream);border:4px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 rgba(59,36,24,.22);
    transform:translateX(-50%) scale(0);transform-origin:50% 100%;opacity:0;transition:transform .28s cubic-bezier(.3,1.6,.5,1),opacity .15s;white-space:nowrap}
  .tind.show{transform:translateX(-50%) scale(1);opacity:1}
  .tind .info{display:flex;flex-direction:column;gap:6px}
  .tind .cnt{padding-right:26px}
  .tind .lbt{font-size:11px;font-weight:900;opacity:.75}
  .chips{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .chip{display:flex;align-items:center;gap:2px;height:23px;padding:0 5px 0 3px;border-radius:12px;background:var(--pill);
    border:2px solid var(--ink);font-size:12px;font-weight:900;transition:opacity .2s,background-color .2s}
  .chip .ie{font-size:16px;line-height:1}
  .chip small{font-size:9.5px;opacity:.6;font-weight:800}
  .chip.hit{animation:bump .2s}
  .chip.done{background:#cdeaa0;opacity:.55}
  .chip.done b::after{content:" ✓"}
  .tind .cnt{display:flex;align-items:center;gap:5px}
  .tind .cnt .bar{flex:1;height:13px}
  .tind .cnt .bar i{background:#ff9f2e}
  .tind .num{font-size:13px;font-weight:900;min-width:28px;text-align:right}
  .tind .num.bump{animation:bump .2s}
  @keyframes bump{50%{transform:scale(1.3)}}
  .clock{position:absolute;right:-24px;top:-24px;width:52px;height:52px;border-radius:50%;background:var(--cream);box-shadow:0 3px 0 rgba(59,36,24,.22)}
  .clock svg{position:absolute;inset:0;transform:rotate(-90deg)}
  .clock .sec{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;padding-top:6px}
  .clock .ico{position:absolute;left:50%;top:7px;transform:translateX(-50%);font-size:11px;line-height:1}
  .clock.urgent{animation:urgent .5s ease-in-out infinite}
  @keyframes urgent{50%{transform:scale(1.12)}}
  .tind .result{position:absolute;inset:-4px;border-radius:16px;border:4px solid var(--ink);display:none;align-items:center;justify-content:center;
    font-size:17px;font-weight:900;color:#fff;text-shadow:0 2px 0 var(--ink)}
  .tind.done .result{display:flex}
  .fly{position:absolute;width:0;height:0;transform-style:preserve-3d}
  .fly .tbb span{position:absolute;left:0;bottom:0;transform:translateX(-50%);font-size:22px;line-height:1}

  .controls{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center}
  button{font-family:inherit;font-weight:900;font-size:15px;padding:10px 18px;border-radius:14px;border:4px solid var(--ink);
    cursor:pointer;box-shadow:0 4px 0 var(--ink);background:#fff;color:var(--ink);transition:transform .08s,box-shadow .08s}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  button.on{background:#ffd23f}
  button:disabled{opacity:.4;cursor:not-allowed}
  #btnUnload:not(:disabled){background:#ff9f2e;color:#fff;text-shadow:0 2px 0 var(--ink)}
  .grp{display:flex;gap:6px;align-items:center}
  .grp .label{font-size:13px;font-weight:800;opacity:.6;margin-right:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>NPC 잡담 · 알바 오버헤드 UI 샘플</h1>
  <div class="sub">왼쪽: 손님 NPC 이모지 잡담 · 오른쪽: 알바 (머리 위 피로도 상시 표시 · 알바 클릭 시 상세 정보)</div>
  <div class="stageBox" id="stageBox"><div class="stage" id="stage"><div class="scene"><div class="world" id="world"><div class="slab"></div></div></div></div></div>

  <div class="controls">
    <div class="grp"><span class="label">알바</span>
      <button data-mode="idle" class="on">대기</button>
      <button data-mode="work">근무</button>
      <button data-mode="rest">휴식</button>
    </div>
    <div class="grp"><span class="label">NPC</span>
      <button id="btnChat" class="on">잡담 ON</button>
    </div>
    <div class="grp"><span class="label">트럭</span>
      <button id="btnTruck" class="on">입출차 ON</button>
      <button id="btnUnload" disabled>하차 1개 📦</button>
    </div>
    <button id="btnReset">초기화</button>
  </div>
</div>

<script>
(() => {
  const T = 88, COLS = 9, ROWS = 6;
  const world = document.getElementById('world');
  const el = (cls, html = '') => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; return d; };
  const place = (n, x, y) => { n.style.left = x + 'px'; n.style.top = y + 'px'; };

  // 바닥: 오른쪽 작업 구역은 나무 바닥
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const t = el('tile' + ((r + c) % 2 ? ' alt' : '') + (c >= 5 && r >= 1 && r <= 4 ? ' wood' : '') + (c <= 2 && r === 0 ? ' dock' : ''));
    place(t, c * T, r * T); world.appendChild(t);
  }
  world.appendChild(el('dockLine'));

  const charSVG = ({ body, hair, cap, apron, flip }) => `
    <svg viewBox="0 0 56 84" width="56" height="84" style="${flip ? 'transform:scaleX(-1)' : ''}">
      <rect x="10" y="38" width="36" height="40" rx="15" fill="${body}" stroke="#3b2418" stroke-width="4"/>
      ${apron ? `<path d="M17 50h22v22a6 6 0 0 1-6 6H23a6 6 0 0 1-6-6z" fill="${apron}" stroke="#3b2418" stroke-width="3"/>` : `<rect x="14" y="56" width="28" height="7" rx="3" fill="rgba(0,0,0,.15)"/>`}
      <circle cx="28" cy="26" r="19" fill="#ffd9b3" stroke="#3b2418" stroke-width="4"/>
      ${cap ? `<path d="M9 21c2-15 36-15 38 0z" fill="${cap}" stroke="#3b2418" stroke-width="3.5" stroke-linejoin="round"/><path d="M40 20h12" stroke="#3b2418" stroke-width="5" stroke-linecap="round"/><path d="M40 20h11" stroke="${cap}" stroke-width="2" stroke-linecap="round"/>`
            : `<path d="M10 22c3-13 33-15 36 0-8-5-27-6-36 0z" fill="${hair}" stroke="#3b2418" stroke-width="3" stroke-linejoin="round"/>`}
      <circle cx="21" cy="28" r="3" fill="#3b2418"/><circle cx="35" cy="28" r="3" fill="#3b2418"/>
      <circle cx="16" cy="34" r="3" fill="#ffaa9a" opacity=".7"/><circle cx="40" cy="34" r="3" fill="#ffaa9a" opacity=".7"/>
    </svg>`;

  function spawn(x, y, look) {
    const sh = el('shadow'); place(sh, x, y); world.appendChild(sh);
    const a = el('anchor', `<div class="bb"><div class="body">${charSVG(look)}</div></div>`);
    place(a, x, y); world.appendChild(a);
    return { a, sh, bb: a.querySelector('.bb') };
  }

  // ================= NPC 잡담 =================
  const npcA = spawn(150, 330, { body: '#ff8fb1', hair: '#3b2a20' });
  const npcB = spawn(250, 330, { body: '#9b7bff', hair: '#e0a040', flip: true });
  [npcA, npcB].forEach(n => { n.bubble = el('bubble'); n.bb.appendChild(n.bubble); });

  const TALKS = [
    ['☕❓', '😋👍'], ['📱', '🤣🤣'], ['🍰', '😍✨'], ['💸💸', '😱'],
    ['🌧️', '😢'], ['🎉', '🥳'], ['🐶', '🥰'], ['🍔❓', '🤤'], ['😴', '💤…'], ['🔥', '😎']
  ];
  let chatOn = true, chatTimers = [], talkIdx = 0;
  const cLater = (fn, ms) => chatTimers.push(setTimeout(fn, ms));

  function say(npc, emoji, done) {
    const b = npc.bubble;
    b.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
    b.classList.add('show');
    cLater(() => {
      b.innerHTML = emoji;
      b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');   // 이모지로 바뀔 때 한 번 더 팝
      npc.a.classList.remove('talk'); void npc.a.offsetWidth; npc.a.classList.add('talk');
    }, 550);
    cLater(() => { b.classList.remove('show'); }, 2000);
    cLater(done, 2300);
  }
  function chatLoop() {
    if (!chatOn) return;
    const [q, r] = TALKS[talkIdx++ % TALKS.length];
    say(npcA, q, () => say(npcB, r, () => cLater(chatLoop, 700)));
  }
  function stopChat() {
    chatTimers.forEach(clearTimeout); chatTimers = [];
    [npcA, npcB].forEach(n => { n.bubble.classList.remove('show'); n.a.classList.remove('talk'); });
  }

  // ================= 알바 =================
  const WORKERS_INIT = [
    { name: '알바 A', lv: 1, exp: 20, fat: 10, x: 530, y: 250, look: { body: '#4a90e2', cap: '#ff7a3c', apron: '#fff4e0' } },
    { name: '알바 B', lv: 3, exp: 55, fat: 72, x: 680, y: 250, look: { body: '#3fb98a', cap: '#ffd23f', apron: '#fff4e0' } },
  ];
  const MAX_LV = 5;
  const workers = WORKERS_INIT.map(w => {
    const s = spawn(w.x, w.y, w.look);
    const mini = el('mini', `<span class="face"></span><div class="bar fat"><i></i></div><span class="emo"></span>`);
    const oh = el('oh', `
      <div class="head"><span class="name">${w.name}<span class="stars"></span></span><span class="state">대기</span></div>
      <div class="stat"><span class="lb">숙련도</span><div class="bar exp"><i></i></div><span class="lv">Lv.1</span></div>
      <div class="stat"><span class="lb">피로도</span><div class="bar fat"><i></i></div><span class="val">0%</span></div>
      <span class="emo"></span><span class="close">✕</span>`);
    s.bb.appendChild(mini); s.bb.appendChild(oh);
    s.a.classList.add('clickable');
    const wk = Object.assign(s, { oh, init: w,
      ui: { stars: oh.querySelector('.stars'), state: oh.querySelector('.state'), exp: oh.querySelector('.exp i'),
            fats: s.bb.querySelectorAll('.fat i'), lv: oh.querySelector('.lv'), val: oh.querySelector('.val'),
            emos: s.bb.querySelectorAll('.emo'), face: mini.querySelector('.face') } });
    s.bb.addEventListener('click', e => { e.stopPropagation(); select(wk.a.classList.contains('open') ? null : wk); });
    return wk;
  });

  // 한 번에 한 명만 상세 표시
  function select(target) {
    workers.forEach(w => {
      const on = w === target;
      w.a.classList.toggle('open', on);
      w.sh.classList.toggle('sel', on);
    });
  }
  document.getElementById('stage').addEventListener('click', () => select(null));

  let mode = 'idle';
  function resetWorkers() { workers.forEach(w => { w.lv = w.init.lv; w.exp = w.init.exp; w.fat = w.init.fat; render(w); }); }

  const fatColor = f => f < 50 ? 'var(--green)' : f < 80 ? 'var(--yellow)' : 'var(--red)';
  function render(w) {
    const u = w.ui, dead = w.fat >= 100 && mode === 'work';
    u.exp.style.width = (w.lv >= MAX_LV ? 100 : w.exp) + '%';
    u.lv.textContent = w.lv >= MAX_LV ? 'MAX' : 'Lv.' + w.lv;
    u.stars.textContent = ' ' + '★'.repeat(w.lv) + '☆'.repeat(MAX_LV - w.lv);
    u.fats.forEach(b => { b.style.width = w.fat + '%'; b.style.backgroundColor = fatColor(w.fat); });
    const face = w.fat >= 100 ? '😵' : w.fat >= 80 ? '😓' : w.fat >= 50 ? '😐' : '😊';
    if (u.face.textContent !== face) u.face.textContent = face;
    u.val.textContent = Math.round(w.fat) + '%';
    let state = '대기', emo = '';
    if (mode === 'rest') { state = '휴식'; emo = '💤'; }
    else if (mode === 'work') { state = dead ? '탈진' : '근무'; emo = dead ? '😵' : w.fat >= 80 ? '💦' : '🔨'; }
    else if (w.fat >= 80) emo = '😓';
    u.state.textContent = state;
    u.state.style.background = state === '탈진' ? '#ffb3a6' : state === '근무' ? '#cdeaa0' : state === '휴식' ? '#cfe3ff' : 'var(--pill)';
    u.emos.forEach(e => { if (e.textContent !== emo) e.textContent = emo; });
    w.a.classList.toggle('work', mode === 'work' && !dead);
    w.a.classList.toggle('tired', w.fat >= 80);
    w.a.classList.toggle('rest', mode === 'rest');
    w.a.classList.toggle('dead', dead);
  }

  function popText(w, txt) {
    const f = el('float'); f.textContent = txt; w.bb.appendChild(f);
    f.style.bottom = w.a.classList.contains('open') ? 'calc(100% + 96px)' : 'calc(100% + 40px)';
    f.animate([{ transform: 'translate(-50%,10px)', opacity: 0 }, { transform: 'translate(-50%,0)', opacity: 1, offset: .2 },
               { transform: 'translate(-50%,-30px)', opacity: 0 }], { duration: 1300, easing: 'ease-out' }).onfinish = () => f.remove();
    w.oh.classList.remove('flash'); void w.oh.offsetWidth; w.oh.classList.add('flash');
  }

  let last = performance.now();
  function tick(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    workers.forEach(w => {
      if (mode === 'work' && w.fat < 100) {
        w.fat = Math.min(100, w.fat + 9 * dt);
        if (w.lv < MAX_LV) {
          w.exp += (30 - w.lv * 3) * dt * (1 - w.fat / 200);   // 지칠수록 숙련도 상승 둔화
          if (w.exp >= 100) { w.lv++; w.exp = w.lv >= MAX_LV ? 100 : 0; popText(w, '숙련도 UP! ⬆'); }
        }
      } else if (mode === 'rest') {
        w.fat = Math.max(0, w.fat - 22 * dt);
      }
      render(w);
    });
    truckTick(dt); followTruck();
    btnUnload.disabled = !(tk.state === 'parked' && tk.left > 0);
    requestAnimationFrame(tick);
  }

  // ================= 하차트럭 =================
  // CSS 3D 박스: top / 앞(남)·뒤(북) 옆면 / 양 끝면
  function box(x, y, w, d, h, c, deco = {}) {
    const b = el('bx'); place(b, x, y);
    const f = (css, bg, html = '') => { const n = el('fc', html); n.style.cssText += css; n.style.background = bg; b.appendChild(n); return n; };
    f(`left:0;top:0;width:${w}px;height:${h}px;transform-origin:top;transform:rotateX(90deg)`, c.side);                       // 북쪽 옆면
    f(`left:0;top:0;width:${h}px;height:${d}px;transform-origin:left;transform:rotateY(-90deg)`, c.end, deco.west || '');   // 서쪽 끝면
    f(`left:${w}px;top:0;width:${h}px;height:${d}px;transform-origin:left;transform:rotateY(-90deg)`, c.end, deco.east || ''); // 동쪽 끝면
    f(`left:0;top:${d}px;width:${w}px;height:${h}px;transform-origin:top;transform:rotateX(90deg)`, c.side, deco.south || ''); // 남쪽 옆면(카메라 쪽)
    f(`left:0;top:0;width:${w}px;height:${d}px;transform:translateZ(${h}px)`, c.top, deco.top || '');                      // 윗면
    return b;
  }
  const TRUCK = { len: 236, cargoX: 56, cargoW: 180, w: 72, h: 78 };
  const PARK = { x: 14, y: 18 }, OFF_X = -330;
  const truckEl = el('truck'); place(truckEl, OFF_X, PARK.y); world.appendChild(truckEl);
  const rig = el('rig'); truckEl.appendChild(rig);
  rig.appendChild(el('tshadow'));
  // 운전석 (서쪽을 향함 → 후진으로 도크 진입, 전진으로 출차)
  rig.appendChild(box(0, 4, 52, 64, 56, { top: '#ff8a4c', side: '#ff7a3c', end: '#e8622a' }, {
    west: '<div style="position:absolute;left:26px;top:8px;width:22px;height:42px;background:#bfe6ff;border:3px solid #3b2418;border-radius:4px"></div>',
    south: '<div class="wheel" style="left:12px"></div><div style="position:absolute;left:8px;top:28px;width:30px;height:20px;background:#bfe6ff;border:3px solid #3b2418;border-radius:4px"></div>'
  }));
  // 짐칸
  rig.appendChild(box(TRUCK.cargoX, 0, TRUCK.cargoW, TRUCK.w, TRUCK.h, { top: '#ffffff', side: '#f6f1e8', end: '#e7e0d4' }, {
    south: '<div class="wheel" style="left:22px"></div><div class="wheel" style="left:128px"></div><div class="logo">물류 EXPRESS</div>',
    east: '<div style="position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1px;background:#3b2418"></div><div style="position:absolute;left:0;right:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,transparent 0 12px,rgba(0,0,0,.08) 12px 14px)"></div>',
    top: '<div style="position:absolute;inset:10px;border:2px dashed rgba(59,36,24,.15);border-radius:4px"></div>'
  }));
  // 트럭 위 인디케이터 (품목 · 남은 개수 바 · 회차까지 남은 시간 원형 게이지)
  const R = 20, C = 2 * Math.PI * R;
  const indZ = el('anchor'); place(indZ, TRUCK.cargoX + TRUCK.cargoW / 2, TRUCK.w / 2);
  indZ.style.transform = `translateZ(${TRUCK.h + 8}px)`; rig.appendChild(indZ);
  indZ.innerHTML = '<i style="position:absolute;width:1px;height:1px"></i>';
  const indWrap = el('indWrap'); document.getElementById('stage').appendChild(indWrap);
  indWrap.innerHTML = `<div class="tind">
      <div class="info">
        <div class="cnt"><span class="lbt">하차</span><div class="bar"><i></i></div><span class="num"></span></div>
        <div class="chips"></div>
      </div>
      <div class="clock">
        <svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="${R}" fill="#fff" stroke="#e8dccb" stroke-width="7"/>
          <circle class="arc" cx="26" cy="26" r="${R}" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/>
          <circle cx="26" cy="26" r="${R + 5}" fill="none" stroke="#3b2418" stroke-width="2.5"/><circle cx="26" cy="26" r="${R - 5}" fill="none" stroke="#3b2418" stroke-width="2"/></svg>
        <span class="ico">⏱️</span><span class="sec"></span>
      </div>
      <div class="result"></div>
    </div>`;
  const ti = {
    panel: indWrap.querySelector('.tind'), chips: indWrap.querySelector('.chips'),
    bar: indWrap.querySelector('.cnt .bar i'), num: indWrap.querySelector('.num'), arc: indWrap.querySelector('.arc'),
    sec: indWrap.querySelector('.sec'), clock: indWrap.querySelector('.clock'), result: indWrap.querySelector('.result')
  };
  const stageEl = document.getElementById('stage');
  function followTruck() {
    const s = stageEl.getBoundingClientRect(), m = indZ.firstChild.getBoundingClientRect();
    const k = s.width / 900;
    indWrap.style.left = (m.left - s.left) / k + 'px';
    indWrap.style.top = (m.top - s.top) / k + 'px';
  }

  // 품목 풀: 트럭마다 2~4종을 섞어서 랜덤 수량으로 적재
  const ITEMS = [
    { e: '📦', n: '택배 박스', min: 3, max: 6 }, { e: '🥤', n: '음료', min: 2, max: 5 },
    { e: '🍎', n: '과일', min: 2, max: 5 }, { e: '📺', n: '가전', min: 1, max: 2 },
    { e: '👕', n: '의류', min: 2, max: 4 }, { e: '🧻', n: '생활용품', min: 2, max: 4 }
  ];
  const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  function makeCargo() {
    const pool = ITEMS.slice().sort(() => Math.random() - .5).slice(0, rand(2, 4));
    return pool.map(it => { const c = rand(it.min, it.max); return { ...it, c, left: c }; });
  }
  const DOCK_TIME = 25, ARRIVE = 1.9, LEAVE = 1.7, AWAY = 1.6, RESULT = 1.3;
  let truckOn = true;
  const tk = { state: 'away', t: 0, cargo: [], total: 0, left: 0, timer: 0 };

  function moveTruck(x, cls, instant) {
    truckEl.classList.remove('arrive', 'leave');
    if (instant) { truckEl.style.transition = 'none'; place(truckEl, x, PARK.y); void truckEl.offsetWidth; truckEl.style.transition = ''; return; }
    truckEl.classList.add(cls); place(truckEl, x, PARK.y);
  }
  function renderTruckUI() {
    if (!tk.total) return;
    ti.bar.style.width = (tk.left / tk.total * 100) + '%';
    const n = `${tk.left}/${tk.total}`;
    if (ti.num.textContent !== n) { ti.num.textContent = n; ti.num.classList.remove('bump'); void ti.num.offsetWidth; ti.num.classList.add('bump'); }
    const ratio = Math.max(0, tk.timer / DOCK_TIME);
    ti.arc.style.strokeDashoffset = C * (1 - ratio);
    ti.arc.style.stroke = ratio > .5 ? 'var(--green)' : ratio > .25 ? 'var(--yellow)' : 'var(--red)';
    ti.sec.textContent = Math.ceil(tk.timer) + 's';
    ti.clock.classList.toggle('urgent', tk.timer <= 5);
  }
  function flyBox(from, w, emoji) {
    const f = el('fly', `<div class="tbb"><span>${emoji}</span></div>`); world.appendChild(f);
    const to = { x: w.init.x + (Math.random() * 20 - 10), y: w.init.y - 4 };
    f.animate([
      { left: from.x + 'px', top: from.y + 'px', transform: 'translateZ(40px) scale(.7)' },
      { left: (from.x + to.x) / 2 + 'px', top: (from.y + to.y) / 2 + 'px', transform: 'translateZ(150px) scale(1.1)', offset: .5 },
      { left: to.x + 'px', top: to.y + 'px', transform: 'translateZ(70px) scale(.6)', opacity: 0 }
    ], { duration: 650, easing: 'ease-in-out' }).onfinish = () => f.remove();
  }
  // 남은 품목 중 하나를 랜덤으로 하차 (자동 근무 / 버튼 공용)
  function unloadOne(w) {
    if (tk.state !== 'parked' || tk.left <= 0) return;
    const remain = tk.cargo.filter(it => it.left > 0);
    const it = remain[Math.floor(Math.random() * remain.length)];
    it.left--; tk.left--;
    it.chip.querySelector('b').textContent = it.left;
    it.chip.classList.remove('hit'); void it.chip.offsetWidth; it.chip.classList.add('hit');
    if (it.left === 0) it.chip.classList.add('done');
    flyBox({ x: PARK.x + TRUCK.len, y: PARK.y + TRUCK.w / 2 }, w, it.e);
  }
  function finish(text, color) {
    tk.state = 'result'; tk.t = 0;
    ti.result.textContent = text; ti.result.style.background = color;
    ti.panel.classList.add('done');
  }

  function truckTick(dt) {
    tk.t += dt;
    switch (tk.state) {
      case 'away':
        if (truckOn && tk.t > AWAY) {
          tk.cargo = makeCargo();
          tk.total = tk.left = tk.cargo.reduce((s, it) => s + it.c, 0); tk.timer = DOCK_TIME;
          ti.chips.innerHTML = '';
          tk.cargo.forEach(it => {
            it.chip = el('chip', `<span class="ie">${it.e}</span><b>${it.c}</b><small>/${it.c}</small>`);
            it.chip.title = it.n; ti.chips.appendChild(it.chip);
          });
          ti.panel.classList.remove('done');
          workers.forEach(w => w.uacc = 0);
          renderTruckUI();
          truckEl.classList.add('moving'); moveTruck(PARK.x, 'arrive');
          tk.state = 'arriving'; tk.t = 0;
        }
        break;
      case 'arriving':
        if (tk.t > ARRIVE) { truckEl.classList.remove('moving'); ti.panel.classList.add('show'); tk.state = 'parked'; tk.t = 0; }
        break;
      case 'parked':
        tk.timer = Math.max(0, tk.timer - dt);
        if (mode === 'work') workers.forEach(w => {
          if (w.fat >= 100 || tk.left <= 0) return;
          w.uacc = (w.uacc || 0) + dt;
          const interval = (1.6 - w.lv * 0.2) * (1 + w.fat / 200);   // 숙련도↑ 빠르게, 피로도↑ 느리게
          if (w.uacc >= interval) {
            w.uacc = 0; unloadOne(w);
          }
        });
        renderTruckUI();
        if (tk.left <= 0) finish('하차 완료! ✅', 'var(--green)');
        else if (tk.timer <= 0) finish(`회차 · 미하차 ${tk.left}개`, '#ff8a3c');
        break;
      case 'result':
        if (tk.t > RESULT) {
          ti.panel.classList.remove('show');
          truckEl.classList.add('moving'); moveTruck(OFF_X, 'leave');
          tk.state = 'leaving'; tk.t = 0;
        }
        break;
      case 'leaving':
        if (tk.t > LEAVE) { truckEl.classList.remove('moving'); tk.state = 'away'; tk.t = 0; }
        break;
    }
  }
  function resetTruck() {
    Object.assign(tk, { state: 'away', t: 0, cargo: [], total: 0, left: 0, timer: 0 });
    truckEl.classList.remove('moving'); moveTruck(OFF_X, null, true);
    ti.panel.classList.remove('show', 'done'); ti.clock.classList.remove('urgent');
    document.querySelectorAll('.fly').forEach(n => n.remove());
  }
  const btnUnload = document.getElementById('btnUnload');
  let manualTurn = 0;
  btnUnload.addEventListener('click', () => unloadOne(workers[manualTurn++ % workers.length]));   // 알바 A/B 번갈아 받음
  const btnTruck = document.getElementById('btnTruck');
  btnTruck.addEventListener('click', () => {
    truckOn = !truckOn; btnTruck.classList.toggle('on', truckOn);
    btnTruck.textContent = truckOn ? '입출차 ON' : '입출차 OFF';
  });

  // ================= 버튼 =================
  const modeBtns = document.querySelectorAll('button[data-mode]');
  modeBtns.forEach(b => b.addEventListener('click', () => {
    mode = b.dataset.mode; modeBtns.forEach(x => x.classList.toggle('on', x === b));
  }));
  const btnChat = document.getElementById('btnChat');
  btnChat.addEventListener('click', () => {
    chatOn = !chatOn; btnChat.classList.toggle('on', chatOn); btnChat.textContent = chatOn ? '잡담 ON' : '잡담 OFF';
    stopChat(); if (chatOn) chatLoop();
  });
  document.getElementById('btnReset').addEventListener('click', () => {
    mode = 'idle'; modeBtns.forEach(x => x.classList.toggle('on', x.dataset.mode === 'idle'));
    resetWorkers(); select(null); resetTruck(); talkIdx = 0; stopChat(); if (chatOn) chatLoop();
  });

  const stage = document.getElementById('stage'), stageBox = document.getElementById('stageBox');
  function fit() { const s = Math.min(1, stageBox.clientWidth / 900); stage.style.transform = `scale(${s})`; stageBox.style.height = 600 * s + 'px'; }
  addEventListener('resize', fit); fit();

  resetWorkers(); chatLoop(); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
