<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>물류센터 타이쿤 - 모듈 배치 UI (모바일 세로 · 원본 6×4 스크롤)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    html, body {
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Gowun Dodum', 'Noto Sans KR', sans-serif;
      background: radial-gradient(circle at 50% 25%, #3b2a1e 0%, #23170e 100%);
      user-select: none;
      -webkit-user-select: none;
    }

    .font-hand { font-family: 'Gaegu', cursive; }
    .font-sans-kr { font-family: 'Noto Sans KR', sans-serif; }

    /* 나무 책상 배경 */
    .wood-desk-bg {
      background-image:
        repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 14px),
        radial-gradient(circle at 50% 20%, #3b2a1e 0%, #23170e 100%);
    }

    /* 하드보드 클립보드 판 */
    .clipboard-board {
      background: linear-gradient(155deg, #875634 0%, #683f23 60%, #523018 100%);
      box-shadow:
        0 24px 50px -12px rgba(0, 0, 0, 0.85),
        inset 0 2px 3px rgba(255, 224, 190, 0.28),
        inset 0 -4px 8px rgba(0, 0, 0, 0.55);
    }

    /* 겹쳐진 종이 레이어 */
    .paper-back-2 {
      background: #e3d3b6;
      transform: rotate(-1deg) translate(-2px, 4px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.26);
    }
    .paper-back-1 {
      background: #efe3cb;
      transform: rotate(0.7deg) translate(2px, 2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .paper-front {
      background-color: #fbf6eb;
      background-image:
        linear-gradient(rgba(139, 101, 69, 0.045) 1px, transparent 1px),
        radial-gradient(rgba(165, 125, 85, 0.075) 1px, transparent 0);
      background-size: 100% 26px, 14px 14px;
      box-shadow:
        0 6px 20px rgba(0, 0, 0, 0.26),
        inset 0 0 28px rgba(214, 185, 142, 0.24);
    }

    /* 하단 가로 인덱스 탭 */
    .bottom-index-tab {
      position: relative;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s ease;
      transform-origin: top center;
    }
    .bottom-index-tab::before {
      content: '';
      position: absolute;
      top: 5px;
      left: 5px;
      right: 5px;
      height: 1px;
      background: linear-gradient(to right, rgba(255,255,255,0.3), rgba(62, 39, 21, 0.22), rgba(255,255,255,0.25));
      pointer-events: none;
    }
    .bottom-index-tab.inactive {
      transform: translateY(-4px) scale(0.96);
      filter: brightness(0.86) saturate(0.86);
      box-shadow: 0 3px 6px rgba(0,0,0,0.28);
      z-index: 15;
    }
    .bottom-index-tab.active {
      transform: translateY(2px) scale(1.03);
      filter: brightness(1.04);
      box-shadow: 0 -2px 5px rgba(62, 39, 21, 0.14), 0 6px 12px rgba(0, 0, 0, 0.34);
      z-index: 30;
    }

    /* 부지 도면 스크롤 배경 */
    .site-board-bg {
      background-color: #efe5d1;
      background-image:
        linear-gradient(rgba(139, 101, 69, 0.10) 1px, transparent 1px),
        linear-gradient(90deg, rgba(139, 101, 69, 0.10) 1px, transparent 1px);
      background-size: 18px 18px;
      box-shadow: inset 0 2px 8px rgba(78, 52, 28, 0.15);
    }

    #map-scroll-wrap {
      -webkit-overflow-scrolling: touch;
      cursor: grab;
    }
    #map-scroll-wrap.panning {
      cursor: grabbing;
    }

    /* 좌우 스크롤 가능 힌트 그라데이션 */
    .edge-fade-left {
      background: linear-gradient(to right, rgba(62, 39, 21, 0.24), transparent);
    }
    .edge-fade-right {
      background: linear-gradient(to left, rgba(62, 39, 21, 0.24), transparent);
    }

    /* 모듈 셀 공통 */
    .module-cell {
      position: relative;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease, border-color 0.18s ease, opacity 0.18s ease;
    }
    .module-cell.movable {
      cursor: grab;
      touch-action: none;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.18), 0 4px 8px rgba(62, 39, 21, 0.14);
    }
    .module-cell.movable:active {
      cursor: grabbing;
    }
    .module-cell.selected {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 0 0 3px #f59e0b, 0 8px 16px rgba(180, 83, 9, 0.35) !important;
      z-index: 25;
    }
    .module-cell.drop-valid {
      box-shadow: inset 0 0 0 2.5px #d97706, 0 0 0 2px rgba(245, 158, 11, 0.35);
      animation: targetPulse 1.3s infinite;
    }
    .module-cell.drop-hover {
      transform: scale(1.06);
      box-shadow: 0 0 0 3px #10b981, 0 6px 14px rgba(16, 185, 129, 0.35) !important;
      z-index: 26;
    }
    .module-cell.dragging-source {
      opacity: 0.35;
      transform: scale(0.95);
    }

    @keyframes targetPulse {
      0%, 100% { box-shadow: inset 0 0 0 2.5px #d97706, 0 0 0 0 rgba(217, 119, 6, 0.35); }
      50% { box-shadow: inset 0 0 0 2.5px #f59e0b, 0 0 0 4px rgba(217, 119, 6, 0); }
    }
    @keyframes cellPunch {
      0% { transform: scale(1); }
      35% { transform: scale(1.12); }
      70% { transform: scale(0.96); }
      100% { transform: scale(1); }
    }
    .anim-punch {
      animation: cellPunch 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes cellShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .anim-shake {
      animation: cellShake 0.36s ease-out;
    }

    /* 잠긴 칸 사선 패턴 */
    .locked-pattern {
      background-image: repeating-linear-gradient(
        -45deg,
        rgba(90, 82, 74, 0.16),
        rgba(90, 82, 74, 0.16) 5px,
        rgba(90, 82, 74, 0.06) 5px,
        rgba(90, 82, 74, 0.06) 10px
      );
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 벨트 점선 흐름 애니메이션 */
    @keyframes beltFlow {
      to { stroke-dashoffset: -16; }
    }
    .belt-line {
      stroke-dasharray: 5 3;
      animation: beltFlow 0.9s linear infinite;
    }
    .belt-line-warn {
      stroke-dasharray: 4 3;
      animation: beltFlow 0.45s linear infinite;
    }
  </style>
</head>
<body class="wood-desk-bg flex flex-col items-center justify-center text-[#3d2b1f]">

  <!-- 드래그 중인 모듈 플로팅 고스트 -->
  <div id="drag-ghost" class="fixed pointer-events-none z-[120] hidden -translate-x-1/2 -translate-y-1/2 scale-105 shadow-2xl rounded-xl border-2 border-amber-300 flex flex-col items-center justify-center px-2 py-1.5 text-center">
    <span id="drag-ghost-icon" class="mb-0.5"></span>
    <span id="drag-ghost-name" class="text-xs font-black leading-tight"></span>
  </div>

  <!-- 사유 / 알림 토스트 -->
  <div id="reason-toast" class="fixed top-14 left-1/2 -translate-x-1/2 z-[130] pointer-events-none opacity-0 -translate-y-2 transition-all duration-250 w-[90%] max-w-[380px]">
    <div id="reason-toast-inner" class="flex items-center justify-center gap-1.5 px-3.5 py-2 rounded-full bg-[#2a1a10]/95 border border-amber-400/70 text-amber-100 text-xs font-extrabold shadow-2xl">
      <i data-lucide="alert-circle" class="w-4 h-4 text-amber-400 shrink-0"></i>
      <span id="reason-toast-text" class="truncate">알림</span>
    </div>
  </div>

  <!-- 모바일 세로 프레임 (9:16 기준, 최대 430px) -->
  <div class="w-full max-w-[430px] h-[100dvh] flex flex-col px-2 pt-2 pb-2 gap-1.5">

    <!-- 1. 슬림 상단 HUD -->
    <header class="shrink-0 relative overflow-hidden bg-[#2a1b12]/94 backdrop-blur rounded-2xl border border-[#8a5d3b]/60 shadow-lg text-[#fed7aa] px-2.5 pt-2 pb-2.5">
      <div class="flex items-center justify-between gap-1.5">
        <div class="flex items-center gap-1 bg-[#3d2718] px-2 py-1 rounded-xl border border-amber-500/40 shrink-0">
          <i data-lucide="package" class="w-3.5 h-3.5 text-amber-400"></i>
          <span class="text-[11px] font-black text-amber-200 font-mono">LV.4</span>
        </div>

        <div class="flex items-center gap-1.5 bg-[#170f0a] px-2.5 py-1 rounded-xl border border-amber-600/40">
          <i data-lucide="coins" class="w-3.5 h-3.5 text-amber-400"></i>
          <span id="hud-gold" class="text-xs font-extrabold text-amber-300 font-mono">12,450G</span>
        </div>

        <div class="flex items-center gap-1 text-[10px] font-bold text-amber-200/85">
          <span class="px-2 py-1 rounded-xl bg-[#3d2718] border border-amber-700/50">6×4 스크롤</span>
        </div>
      </div>
      <div class="absolute bottom-0 left-0 right-0 h-1 bg-[#170f0a]">
        <div class="h-full bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-300" style="width: 62%"></div>
      </div>
    </header>

    <!-- 2. 메인 클립보드 -->
    <main class="flex-1 min-h-0 flex flex-col relative pt-2">
      <div class="flex-1 min-h-0 relative z-20 clipboard-board rounded-[24px] p-2.5 pt-7 pb-1.5 border-[3px] border-[#492a14] flex flex-col">

        <!-- 상단 메탈 클립 -->
        <div class="absolute -top-3 left-1/2 -translate-x-1/2 flex flex-col items-center z-40 pointer-events-none">
          <div class="w-8 h-3 border-[3px] border-amber-200/70 rounded-t-full bg-[#2a1b10]"></div>
          <div class="w-32 h-6 bg-gradient-to-b from-[#d8c39e] via-[#b89b6e] to-[#8f7248] rounded-lg shadow-md border border-[#6e532e] flex items-center justify-between px-3">
            <div class="w-1.5 h-1.5 rounded-full bg-[#4e381c]"></div>
            <span class="text-[8px] font-black tracking-[0.18em] text-[#3e2912]">SITE MAP</span>
            <div class="w-1.5 h-1.5 rounded-full bg-[#4e381c]"></div>
          </div>
        </div>

        <!-- 종이 스택 컨테이너 -->
        <div class="flex-1 min-h-0 relative flex flex-col">
          <div class="paper-back-2 absolute inset-x-0 top-0 bottom-11 rounded-2xl border border-[#cbb794] pointer-events-none z-10"></div>
          <div class="paper-back-1 absolute inset-x-0 top-0 bottom-11 rounded-2xl border border-[#d6c3a1] pointer-events-none z-10"></div>

          <!-- 활성 크라프트 용지 -->
          <div class="paper-front relative z-20 flex-1 min-h-0 rounded-2xl p-3 border border-[#dfd0b4] flex flex-col overflow-hidden gap-2">

            <!-- 서류 헤더 -->
            <div class="flex items-center justify-between border-b-2 border-dashed border-[#d8c7a6] pb-2 shrink-0 gap-2">
              <div class="flex items-center gap-2 min-w-0">
                <span class="w-7 h-7 rounded-lg bg-[#e6d2b1] text-[#57391e] flex items-center justify-center shadow-sm shrink-0">
                  <i data-lucide="layout-grid" class="w-4 h-4"></i>
                </span>
                <div class="min-w-0">
                  <h2 class="text-sm font-black text-[#3f2814] leading-tight">모듈 배치 도면 (6×4)</h2>
                  <p class="text-[10px] text-[#856447] truncate">도면을 좌우로 밀어 보고, 모듈을 탭·드래그해 옮기세요</p>
                </div>
              </div>

              <button onclick="toggleBelts()" id="belt-toggle-btn"
                class="flex items-center gap-1 px-2 py-1 rounded-lg bg-[#efe4ce] border border-[#d1bc97] text-[10px] font-extrabold text-[#5c3d20] active:scale-95 shrink-0">
                <i data-lucide="git-commit-horizontal" class="w-3.5 h-3.5 text-amber-700"></i>
                <span>벨트</span>
              </button>
            </div>

            <!-- 컴팩트 범례 -->
            <div class="flex items-center justify-between text-[10px] font-bold text-[#6e4e32] px-0.5 shrink-0">
              <div class="flex items-center gap-2.5">
                <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm bg-[#f59e0b] inline-block border border-black/15"></span>이동가능</span>
                <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm bg-[#f5f2eb] inline-block border border-[#b59f7e]"></span>빈칸</span>
                <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm bg-[#615954] inline-block"></span>고정</span>
                <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm bg-[#8c8c8c]/50 inline-block border border-dashed border-stone-500"></span>잠김</span>
              </div>
              <span class="text-[10px] font-mono font-extrabold text-amber-900/80" id="visible-cols-label">1~4열 보기</span>
            </div>

            <!-- ============================================================
                 원본 6×4 가로 스크롤/패닝 부지 미니맵
                 ============================================================ -->
            <div class="flex-1 min-h-0 flex flex-col gap-1.5 relative">
              <!-- 스크롤 맵 래퍼 + 좌우 페이드 -->
              <div class="flex-1 min-h-0 relative rounded-2xl border-2 border-[#cbb694] overflow-hidden site-board-bg">
                <!-- 좌측 페이드 & 빠른 이동 버튼 -->
                <div id="fade-left" class="edge-fade-left pointer-events-none absolute inset-y-0 left-0 w-7 z-30 opacity-0 transition-opacity duration-200"></div>
                <button id="scroll-left-btn" onclick="scrollMapBy(-180)"
                  class="absolute left-1.5 top-1/2 -translate-y-1/2 z-30 w-7 h-10 rounded-xl bg-[#2a1b12]/75 text-amber-100 border border-amber-400/40 shadow-md flex items-center justify-center opacity-0 pointer-events-none active:scale-90 transition">
                  <i data-lucide="chevron-left" class="w-4 h-4"></i>
                </button>

                <!-- 우측 페이드 & 빠른 이동 버튼 -->
                <div id="fade-right" class="edge-fade-right pointer-events-none absolute inset-y-0 right-0 w-7 z-30 opacity-100 transition-opacity duration-200"></div>
                <button id="scroll-right-btn" onclick="scrollMapBy(180)"
                  class="absolute right-1.5 top-1/2 -translate-y-1/2 z-30 w-7 h-10 rounded-xl bg-[#2a1b12]/75 text-amber-100 border border-amber-400/40 shadow-md flex items-center justify-center active:scale-90 transition">
                  <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>

                <!-- 실제 스크롤 컨테이너 -->
                <div id="map-scroll-wrap" class="w-full h-full overflow-x-auto overflow-y-auto no-scrollbar flex items-center">
                  <div id="grid-stage" class="relative shrink-0 p-3">
                    <!-- 열 번호 헤더 (1~6열) -->
                    <div id="col-headers" class="grid gap-2 mb-1.5 text-center text-[9px] font-mono font-black text-[#8a6d4d]">
                      <span>1열</span><span>2열</span><span>3열</span><span>4열</span><span>5열</span><span>6열</span>
                    </div>
                    <div class="relative">
                      <!-- SVG 컨베이어 벨트 오버레이 -->
                      <svg id="belt-svg" class="absolute inset-0 w-full h-full pointer-events-none z-20 overflow-visible"></svg>
                      <!-- 6×4 그리드 셀 -->
                      <div id="module-grid" class="relative z-10 grid gap-2">
                        <!-- JS 렌더링 -->
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- 하단 미니맵 스크롤 위치 인디케이터 바 -->
              <div class="shrink-0 flex items-center gap-2 px-1">
                <span class="text-[9px] font-extrabold text-[#7d5f41] shrink-0">← 사무실·하차</span>
                <div id="minimap-track" class="flex-1 h-2 bg-[#e4d5b9] rounded-full relative overflow-hidden border border-[#ccb792]">
                  <div id="minimap-thumb" class="absolute top-0 bottom-0 bg-[#9e7247] rounded-full transition-[left] duration-75" style="left: 0%; width: 60%;"></div>
                </div>
                <span class="text-[9px] font-extrabold text-[#7d5f41] shrink-0">상차·확장 →</span>
              </div>
            </div>

            <!-- 벨트 철거 경고 배너 -->
            <div id="belt-warning-banner" class="hidden shrink-0 items-center justify-between gap-2 px-2.5 py-1.5 rounded-xl bg-amber-100 border border-amber-400 text-amber-950 text-[11px] font-extrabold">
              <div class="flex items-center gap-1.5 min-w-0">
                <i data-lucide="alert-triangle" class="w-3.5 h-3.5 text-amber-700 shrink-0"></i>
                <span id="belt-warning-text" class="truncate">연결된 벨트 2개 철거 예정</span>
              </div>
              <span id="belt-refund-badge" class="text-[10px] font-mono font-black bg-amber-800 text-amber-100 px-1.5 py-0.5 rounded shrink-0">+160G 환불</span>
            </div>

            <!-- 하단 인스펙터 카드 -->
            <div id="inspector-card" class="shrink-0 bg-[#fffdfa] rounded-xl p-2.5 border border-[#d6c4a5] shadow-sm flex items-center justify-between gap-2">
              <div class="flex items-center gap-2 min-w-0">
                <div id="inspector-badge" class="w-9 h-9 rounded-lg bg-[#efe2c8] text-[#5c3d20] flex items-center justify-center shrink-0 border border-black/10">
                  <i data-lucide="move-horizontal" class="w-4 h-4"></i>
                </div>
                <div class="min-w-0">
                  <div class="flex items-center gap-1.5">
                    <span id="inspector-title" class="text-xs font-black text-[#3b2513] truncate">도면을 밀어 탐색하세요</span>
                    <span id="inspector-tag" class="text-[9px] font-extrabold px-1.5 py-0.5 rounded bg-stone-200 text-stone-600 shrink-0">대기</span>
                  </div>
                  <p id="inspector-desc" class="text-[10px] text-[#7a5b3e] truncate mt-0.5">보관·반품 칸을 탭해 선택한 뒤 스크롤해서 놓을 수도 있어요.</p>
                </div>
              </div>
              <button id="inspector-cancel-btn" onclick="clearSelection()"
                class="hidden px-2 py-1.5 rounded-lg bg-stone-100 active:bg-stone-200 text-stone-600 text-[10px] font-extrabold shrink-0">
                취소
              </button>
            </div>

            <!-- 하단 액션 바 -->
            <div class="shrink-0 grid grid-cols-5 gap-2 pt-0.5">
              <button id="reset-btn" onclick="resetArrangement()"
                class="col-span-2 py-2.5 rounded-xl bg-[#ede1cb] active:scale-95 border border-[#c7b089] text-[#54371d] font-black text-xs flex items-center justify-center gap-1 transition disabled:opacity-45"
                disabled>
                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                <span>되돌리기</span>
              </button>
              <button id="apply-btn" onclick="applyArrangement()"
                class="col-span-3 py-2.5 rounded-xl bg-gradient-to-b from-[#4f9d73] to-[#357a55] active:scale-95 border border-[#286142] text-white font-black text-xs shadow-md flex items-center justify-center gap-1.5 transition">
                <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                <span id="apply-btn-text">배치 적용</span>
              </button>
            </div>

          </div>

          <!-- 하단 가로 인덱스 탭 -->
          <nav class="shrink-0 grid grid-cols-5 gap-1 px-1 -mt-1.5 pt-0.5 pb-0.5" aria-label="서류 인덱스 탭">
            <button onclick="showToast('시안에서는 [모듈] 탭만 활성화되어 있습니다.')" class="bottom-index-tab inactive pt-2 pb-1.5 rounded-t-[4px] rounded-b-xl bg-[#f4a261] text-[#3a1d08] border border-[#c8722d] font-extrabold text-[10px] flex flex-col items-center gap-0.5">
              <i data-lucide="stamp" class="w-3.5 h-3.5"></i><span>고용</span>
            </button>
            <button onclick="showToast('시안에서는 [모듈] 탭만 활성화되어 있습니다.')" class="bottom-index-tab inactive pt-2 pb-1.5 rounded-t-[4px] rounded-b-xl bg-[#e9c46a] text-[#3e2a07] border border-[#bfa03a] font-extrabold text-[10px] flex flex-col items-center gap-0.5">
              <i data-lucide="users" class="w-3.5 h-3.5"></i><span>명부</span>
            </button>
            <button onclick="showToast('시안에서는 [모듈] 탭만 활성화되어 있습니다.')" class="bottom-index-tab inactive pt-2 pb-1.5 rounded-t-[4px] rounded-b-xl bg-[#e76f51] text-[#3b1208] border border-[#b94b30] font-extrabold text-[10px] flex flex-col items-center gap-0.5">
              <i data-lucide="zap" class="w-3.5 h-3.5"></i><span>강화</span>
            </button>
            <button onclick="showToast('시안에서는 [모듈] 탭만 활성화되어 있습니다.')" class="bottom-index-tab inactive pt-2 pb-1.5 rounded-t-[4px] rounded-b-xl bg-[#52b788] text-[#0b3321] border border-[#348a63] font-extrabold text-[10px] flex flex-col items-center gap-0.5">
              <i data-lucide="truck" class="w-3.5 h-3.5"></i><span>설비</span>
            </button>
            <button class="bottom-index-tab active pt-2 pb-1.5 rounded-t-[4px] rounded-b-xl bg-[#6c8ebf] text-[#0d2240] border border-[#446799] font-black text-[10px] flex flex-col items-center gap-0.5">
              <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i><span>모듈</span>
            </button>
          </nav>

        </div>
      </div>
    </main>
  </div>

  <script>
    /* ========================================================
       1. 실제 SiteLayout.asset 기반 원본 6×4 부지 데이터
       ======================================================== */
    const COLS = 6;
    const ROWS = 4;

    const SITE_CELLS = new Set([
      '1,1', '2,1', '3,1',
      '1,2', '2,2', '3,2', '4,2',
      '1,3', '2,3', '3,3', '4,3', '5,3', '6,3',
      '2,4', '3,4', '4,4', '5,4', '6,4'
    ]);

    const INITIAL_LAYOUT = {
      '1,1': { id: 'Empty_R1C1', name: '빈 공간', short: '빈 공간', kind: 'empty', icon: 'plus', desc: '보관·반품 모듈을 옮겨놓을 수 있는 빈 부지입니다.' },
      '2,1': { id: 'Empty_R1C2', name: '빈 공간', short: '빈 공간', kind: 'empty', icon: 'plus', desc: '보관·반품 모듈을 옮겨놓을 수 있는 빈 부지입니다.' },
      '3,1': { id: 'Trash', name: '쓰레기장', short: '쓰레기장', kind: 'fixed', icon: 'trash-2', desc: '고정 시설입니다. 위치를 옮길 수 없습니다.' },

      '1,2': { id: 'Office', name: '사무실', short: '사무실', kind: 'fixed', icon: 'building', desc: '계약 PC와 저금통이 있는 고정 시설입니다.' },
      '2,2': { id: 'Empty_R2C2', name: '빈 공간', short: '빈 공간', kind: 'empty', icon: 'plus', desc: '보관·반품 모듈을 옮겨놓을 수 있는 빈 부지입니다.' },
      '3,2': { id: 'Ret1', name: '반품 1', short: '반품 1', kind: 'movable', color: '#7b8fc4', text: '#ffffff', icon: 'undo-2', desc: '반품 검수 모듈입니다. 빈 칸이나 다른 보관 칸과 교체할 수 있습니다.' },
      '4,2': { id: 'Out1', name: '상차장 1', short: '상차장 1', kind: 'fixed', icon: 'truck', desc: '출고 트럭이 접안하는 고정 상차장입니다.' },

      '1,3': { id: 'In2', name: '하차장 2', short: '하차장 2', kind: 'fixed', icon: 'package-open', desc: '입고 트럭이 접안하는 고정 하차장입니다.' },
      '2,3': { id: 'Scan', name: '스캔 구역', short: '스캔 구역', kind: 'fixed', icon: 'scan-line', desc: '입고 화물을 스캔하는 고정 작업 구역입니다.' },
      '3,3': { id: 'StoreA1', name: 'A보관', short: 'A보관', kind: 'movable', color: '#f59e0b', text: '#3b1d06', icon: 'boxes', desc: 'A사 품목 전용 선반입니다. 컨베이어 벨트와 연결되어 있습니다.' },
      '4,3': { id: 'Empty_R3C4', name: '빈 공간', short: '빈 공간', kind: 'empty', icon: 'plus', desc: '보관·반품 모듈을 옮겨놓을 수 있는 빈 부지입니다.' },
      '5,3': { id: 'Out2', name: '상차장 2', short: '상차장 2', kind: 'locked', unlock: 'LV.4 / 400G 해금', icon: 'lock', desc: '아직 해금되지 않은 상차장 부지입니다.' },
      '6,3': { id: 'Out3', name: '상차장 3', short: '상차장 3', kind: 'locked', unlock: 'LV.5 / 500G 해금', icon: 'lock', desc: '아직 해금되지 않은 상차장 부지입니다.' },

      '2,4': { id: 'In1', name: '하차장 1', short: '하차장 1', kind: 'fixed', icon: 'package-open', desc: '기본 입고 트럭이 들어오는 고정 하차장입니다.' },
      '3,4': { id: 'Empty_R4C3', name: '빈 공간', short: '빈 공간', kind: 'empty', icon: 'plus', desc: '보관·반품 모듈을 옮겨놓을 수 있는 빈 부지입니다.' },
      '4,4': { id: 'StoreB', name: 'B보관', short: 'B보관', kind: 'movable', color: '#38bdf8', text: '#082f49', icon: 'boxes', desc: 'B사 품목 전용 선반입니다. 원하는 위치로 이동할 수 있습니다.' },
      '5,4': { id: 'StoreC', name: 'C보관', short: 'C보관', kind: 'movable', color: '#34d399', text: '#064e3b', icon: 'boxes', desc: 'C사 품목 전용 선반입니다. 원하는 위치로 이동할 수 있습니다.' },
      '6,4': { id: 'StoreD', name: 'D보관', short: 'D보관', kind: 'locked', unlock: 'LV.4 / 500G 해금', icon: 'lock', desc: '아직 해금되지 않은 D사 대형 선반 부지입니다.' }
    };

    const INITIAL_BELTS = [
      { id: 'b1', from: '2,4', to: '2,3', cost: 80 },
      { id: 'b2', from: '2,3', to: '3,3', cost: 80 },
      { id: 'b3', from: '3,3', to: '4,2', cost: 80 }
    ];

    let gold = 12450;
    let original = deepClone(INITIAL_LAYOUT);
    let staged = deepClone(INITIAL_LAYOUT);
    let activeBelts = deepClone(INITIAL_BELTS);
    let showBelts = true;
    let selectedKey = null;
    let toastTimer = null;

    function deepClone(obj) {
      return JSON.parse(JSON.stringify(obj));
    }

    function toggleBelts() {
      showBelts = !showBelts;
      document.getElementById('belt-toggle-btn').classList.toggle('opacity-50', !showBelts);
      renderBelts();
    }

    /* ========================================================
       2. 세로 높이에 맞춘 원본 6×4 셀 크기 동적 계산
       - 4행이 뷰포트 세로 높이에 딱 차도록 셀 높이를 맞추고,
         가로는 6열이 넉넉한 비율(가로:세로 ≈ 1.12)로 좌우 스크롤되도록 설정
       ======================================================== */
    function computeCellMetrics() {
      const wrap = document.getElementById('map-scroll-wrap');
      const availH = Math.max(240, wrap.clientHeight - 44); // 패딩 + 열 헤더 여유
      const gap = 8;
      const cellH = Math.max(62, Math.min(92, Math.floor((availH - gap * (ROWS - 1)) / ROWS)));
      const cellW = Math.round(cellH * 1.14); // 원래 가로 비율(210:160 ≈ 1.31)을 살리되 터치하기 좋은 비례
      return { cellW, cellH, gap };
    }

    /* ========================================================
       3. 변경 감지 & 벨트 영향 계산
       ======================================================== */
    function getMovedKeys() {
      const moved = new Set();
      for (const key of SITE_CELLS) {
        const orig = original[key];
        const cur = staged[key];
        if (orig && cur && orig.id !== cur.id) moved.add(key);
      }
      return moved;
    }

    function getAffectedBelts() {
      const moved = getMovedKeys();
      if (moved.size === 0) return [];
      return activeBelts.filter(b => moved.has(b.from) || moved.has(b.to));
    }

    function countChanges() {
      let changed = 0;
      for (const key of SITE_CELLS) {
        const orig = original[key];
        const cur = staged[key];
        if (orig && cur && orig.id !== cur.id && cur.kind === 'movable') changed++;
      }
      return changed;
    }

    /* ========================================================
       4. 렌더링
       ======================================================== */
    function renderAll(punchKey = null, shakeKey = null) {
      const gridEl = document.getElementById('module-grid');
      const colHeaders = document.getElementById('col-headers');
      const { cellW, cellH, gap } = computeCellMetrics();

      const colTemplate = `repeat(${COLS}, ${cellW}px)`;
      const rowTemplate = `repeat(${ROWS}, ${cellH}px)`;
      colHeaders.style.gridTemplateColumns = colTemplate;
      colHeaders.style.gap = `${gap}px`;
      gridEl.style.gridTemplateColumns = colTemplate;
      gridEl.style.gridTemplateRows = rowTemplate;
      gridEl.style.gap = `${gap}px`;

      const selectedMod = selectedKey ? staged[selectedKey] : null;
      const movedKeys = getMovedKeys();

      let html = '';
      for (let r = 1; r <= ROWS; r++) {
        for (let c = 1; c <= COLS; c++) {
          const key = `${c},${r}`;

          if (!SITE_CELLS.has(key)) {
            html += `
              <div style="grid-column:${c}; grid-row:${r};"
                class="rounded-xl border border-dashed border-[#cbb896]/45 bg-[#e3d6bd]/35 flex items-center justify-center pointer-events-none">
                <span class="text-[8px] text-[#b39d7c]/60 font-mono">ROAD</span>
              </div>
            `;
            continue;
          }

          const mod = staged[key];
          const isSelected = selectedKey === key;
          const isMovable = mod.kind === 'movable';
          const isValidTarget = selectedMod && selectedKey !== key && (mod.kind === 'empty' || mod.kind === 'movable');
          const isChanged = movedKeys.has(key) && isMovable;

          let bgStyle = '';
          let extraClass = '';
          let badgeHtml = '';

          if (mod.kind === 'empty') {
            bgStyle = 'background-color:#f6f3ec; color:#85725c;';
            extraClass = 'border-2 border-dashed border-[#c7b393]';
          } else if (mod.kind === 'fixed') {
            bgStyle = 'background-color:#5e5651; color:#ffffff;';
            extraClass = 'border border-[#3f3935] opacity-95';
            badgeHtml = `<span class="absolute top-1.5 right-1.5 opacity-60"><i data-lucide="pin" class="w-2.5 h-2.5"></i></span>`;
          } else if (mod.kind === 'locked') {
            bgStyle = 'background-color:rgba(140,140,140,0.42); color:#4a4540;';
            extraClass = 'border border-dashed border-stone-500/60 locked-pattern';
          } else {
            bgStyle = `background-color:${mod.color}; color:${mod.text};`;
            extraClass = 'movable border-2 border-black/15';
            badgeHtml = isChanged
              ? `<span class="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-emerald-600 text-white text-[9px] font-black flex items-center justify-center shadow">✓</span>`
              : `<span class="absolute top-1.5 right-1.5 opacity-55"><i data-lucide="grip-horizontal" class="w-3 h-3"></i></span>`;
          }

          const animClass = (punchKey === key ? ' anim-punch' : '') + (shakeKey === key ? ' anim-shake' : '');

          html += `
            <div data-key="${key}"
              style="grid-column:${c}; grid-row:${r}; ${bgStyle}"
              class="module-cell rounded-xl flex flex-col items-center justify-center p-1.5 text-center select-none ${extraClass} ${isSelected ? 'selected' : ''} ${isValidTarget ? 'drop-valid' : ''}${animClass}">
              ${badgeHtml}
              <i data-lucide="${mod.icon}" class="w-4 h-4 mb-1 ${mod.kind === 'empty' ? 'opacity-45' : 'opacity-90'}"></i>
              <span class="text-[11px] font-black leading-tight tracking-tight">${mod.short}</span>
              ${mod.kind === 'locked' ? `<span class="text-[8px] font-bold opacity-80 leading-none mt-0.5">잠김</span>` : ''}
            </div>
          `;
        }
      }

      gridEl.innerHTML = html;
      bindCellEvents();
      if (typeof lucide !== 'undefined') lucide.createIcons();

      requestAnimationFrame(() => {
        renderBelts();
        updateScrollIndicators();
      });
      renderInspector();
      renderFooter();
    }

    function renderBelts() {
      const svg = document.getElementById('belt-svg');
      if (!showBelts) {
        svg.innerHTML = '';
        return;
      }

      const gridRect = document.getElementById('module-grid').getBoundingClientRect();
      const affected = new Set(getAffectedBelts().map(b => b.id));

      let paths = `
        <defs>
          <marker id="arrow-normal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309" />
          </marker>
          <marker id="arrow-warn" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
          </marker>
        </defs>
      `;

      activeBelts.forEach(belt => {
        const fromEl = document.querySelector(`.module-cell[data-key="${belt.from}"]`);
        const toEl = document.querySelector(`.module-cell[data-key="${belt.to}"]`);
        if (!fromEl || !toEl) return;

        const r1 = fromEl.getBoundingClientRect();
        const r2 = toEl.getBoundingClientRect();
        const x1 = r1.left + r1.width / 2 - gridRect.left;
        const y1 = r1.top + r1.height / 2 - gridRect.top;
        const x2 = r2.left + r2.width / 2 - gridRect.left;
        const y2 = r2.top + r2.height / 2 - gridRect.top;

        const isWarn = affected.has(belt.id);
        paths += `
          <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"
            stroke="${isWarn ? '#dc2626' : '#b45309'}"
            stroke-width="${isWarn ? '3.2' : '2.6'}"
            stroke-opacity="0.88"
            marker-end="url(#${isWarn ? 'arrow-warn' : 'arrow-normal'})"
            class="${isWarn ? 'belt-line-warn' : 'belt-line'}" />
        `;
      });

      svg.innerHTML = paths;
    }

    function renderInspector() {
      const titleEl = document.getElementById('inspector-title');
      const tagEl = document.getElementById('inspector-tag');
      const descEl = document.getElementById('inspector-desc');
      const badgeEl = document.getElementById('inspector-badge');
      const cancelBtn = document.getElementById('inspector-cancel-btn');

      if (!selectedKey) {
        titleEl.innerText = '도면을 좌우로 밀어 탐색하세요';
        tagEl.innerText = '대기';
        tagEl.className = 'text-[9px] font-extrabold px-1.5 py-0.5 rounded bg-stone-200 text-stone-600 shrink-0';
        descEl.innerText = '보관·반품 칸을 탭해 선택한 뒤 스크롤해서 다른 칸에 놓을 수 있어요.';
        badgeEl.style.backgroundColor = '#efe2c8';
        badgeEl.style.color = '#5c3d20';
        badgeEl.innerHTML = `<i data-lucide="move-horizontal" class="w-4 h-4"></i>`;
        cancelBtn.classList.add('hidden');
        if (typeof lucide !== 'undefined') lucide.createIcons();
        return;
      }

      const mod = staged[selectedKey];
      titleEl.innerText = mod.name;
      cancelBtn.classList.remove('hidden');

      if (mod.kind === 'movable') {
        tagEl.innerText = '이동 선택됨';
        tagEl.className = 'text-[9px] font-extrabold px-1.5 py-0.5 rounded bg-amber-200 text-amber-900 shrink-0';
        descEl.innerText = '도면을 스크롤한 뒤 노란색 빈 칸·모듈을 탭해 이동하세요!';
        badgeEl.style.backgroundColor = mod.color;
        badgeEl.style.color = mod.text;
        badgeEl.innerHTML = `<i data-lucide="${mod.icon}" class="w-4 h-4"></i>`;
      } else if (mod.kind === 'fixed') {
        tagEl.innerText = '고정 시설';
        tagEl.className = 'text-[9px] font-extrabold px-1.5 py-0.5 rounded bg-stone-600 text-white shrink-0';
        descEl.innerText = mod.desc;
        badgeEl.style.backgroundColor = '#5e5651';
        badgeEl.style.color = '#ffffff';
        badgeEl.innerHTML = `<i data-lucide="${mod.icon}" class="w-4 h-4"></i>`;
      } else if (mod.kind === 'locked') {
        tagEl.innerText = mod.unlock || '잠김';
        tagEl.className = 'text-[9px] font-extrabold px-1.5 py-0.5 rounded bg-stone-300 text-stone-700 shrink-0';
        descEl.innerText = mod.desc;
        badgeEl.style.backgroundColor = '#d6d3d1';
        badgeEl.style.color = '#44403c';
        badgeEl.innerHTML = `<i data-lucide="lock" class="w-4 h-4"></i>`;
      } else {
        tagEl.innerText = '빈 부지';
        tagEl.className = 'text-[9px] font-extrabold px-1.5 py-0.5 rounded bg-[#ebe3d3] text-[#6e573e] shrink-0';
        descEl.innerText = mod.desc;
        badgeEl.style.backgroundColor = '#f6f3ec';
        badgeEl.style.color = '#85725c';
        badgeEl.innerHTML = `<i data-lucide="plus" class="w-4 h-4"></i>`;
      }

      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function renderFooter() {
      const changes = countChanges();
      const resetBtn = document.getElementById('reset-btn');
      const applyText = document.getElementById('apply-btn-text');
      const affected = getAffectedBelts();
      const warnBanner = document.getElementById('belt-warning-banner');

      resetBtn.disabled = changes === 0;
      applyText.innerText = changes > 0 ? `배치 적용 (${changes}건 변경)` : '배치 적용';

      if (affected.length > 0) {
        const refund = affected.reduce((sum, b) => sum + b.cost, 0);
        document.getElementById('belt-warning-text').innerText = `연결된 벨트 ${affected.length}개 철거 예정`;
        document.getElementById('belt-refund-badge').innerText = `+${refund}G 전액 환불`;
        warnBanner.classList.remove('hidden');
        warnBanner.classList.add('flex');
      } else {
        warnBanner.classList.add('hidden');
        warnBanner.classList.remove('flex');
      }
    }

    /* ========================================================
       5. 스크롤 인디케이터 + 빠른 스크롤 + 마우스 드래그 패닝
       ======================================================== */
    const mapWrap = document.getElementById('map-scroll-wrap');

    function scrollMapBy(dx) {
      mapWrap.scrollBy({ left: dx, behavior: 'smooth' });
    }

    function updateScrollIndicators() {
      const maxScroll = Math.max(0, mapWrap.scrollWidth - mapWrap.clientWidth);
      const scrollLeft = mapWrap.scrollLeft;

      const fadeL = document.getElementById('fade-left');
      const fadeR = document.getElementById('fade-right');
      const btnL = document.getElementById('scroll-left-btn');
      const btnR = document.getElementById('scroll-right-btn');
      const thumb = document.getElementById('minimap-thumb');
      const label = document.getElementById('visible-cols-label');

      const canLeft = scrollLeft > 8;
      const canRight = scrollLeft < maxScroll - 8;

      fadeL.style.opacity = canLeft ? '1' : '0';
      fadeR.style.opacity = canRight ? '1' : '0';
      btnL.style.opacity = canLeft ? '1' : '0';
      btnL.style.pointerEvents = canLeft ? 'auto' : 'none';
      btnR.style.opacity = canRight ? '1' : '0';
      btnR.style.pointerEvents = canRight ? 'auto' : 'none';

      if (mapWrap.scrollWidth > 0) {
        const thumbW = Math.max(18, (mapWrap.clientWidth / mapWrap.scrollWidth) * 100);
        const progress = maxScroll > 0 ? (scrollLeft / maxScroll) : 0;
        thumb.style.width = `${thumbW}%`;
        thumb.style.left = `${progress * (100 - thumbW)}%`;

        const startCol = Math.min(COLS, Math.max(1, Math.floor(progress * 2.6) + 1));
        const endCol = Math.min(COLS, startCol + 3);
        label.innerText = `${startCol}~${endCol}열 보기`;
      }
    }

    mapWrap.addEventListener('scroll', updateScrollIndicators, { passive: true });

    /* ========================================================
       6. 통합 포인터 제어:
          - 빈칸/고정/잠김/배경 드래그 -> 도면 스크롤(패닝)
          - 이동 가능 모듈 드래그 -> 모듈 이동 (화면 가장자리 자동 스크롤 지원!)
          - 짧은 탭 -> 모듈 선택 / 탭-투-스왑
       ======================================================== */
    let pointerState = null;
    let autoScrollRaf = null;
    let lastPointerX = 0;

    function bindCellEvents() {
      document.querySelectorAll('.module-cell').forEach(cellEl => {
        cellEl.addEventListener('pointerdown', onCellPointerDown);
      });
    }

    // 배경(도로/빈 여백)에서도 마우스 드래그 패닝 가능
    mapWrap.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.module-cell')) return;
      if (e.pointerType === 'touch') return; // 터치는 네이티브 관성 스크롤 사용
      startMapPan(e);
    });

    function startMapPan(e) {
      pointerState = {
        mode: 'pan',
        startX: e.clientX,
        startY: e.clientY,
        startScrollLeft: mapWrap.scrollLeft,
        startScrollTop: mapWrap.scrollTop,
        moved: false,
        key: null
      };
      mapWrap.classList.add('panning');
      window.addEventListener('pointermove', onWindowPointerMove);
      window.addEventListener('pointerup', onWindowPointerUp);
      window.addEventListener('pointercancel', onWindowPointerUp);
    }

    function onCellPointerDown(e) {
      const cellEl = e.currentTarget;
      const key = cellEl.getAttribute('data-key');
      const mod = staged[key];
      if (!mod) return;

      // 이동 불가능한 칸에서 마우스로 끌면 도면 패닝, 터치는 네이티브 스크롤 + 짧은 탭 처리
      const canDragModule = mod.kind === 'movable';

      pointerState = {
        mode: canDragModule ? 'module-pending' : (e.pointerType === 'touch' ? 'tap-only' : 'pan-or-tap'),
        key,
        mod,
        cellEl,
        startX: e.clientX,
        startY: e.clientY,
        startScrollLeft: mapWrap.scrollLeft,
        startScrollTop: mapWrap.scrollTop,
        moved: false,
        hoverKey: null
      };

      window.addEventListener('pointermove', onWindowPointerMove);
      window.addEventListener('pointerup', onWindowPointerUp);
      window.addEventListener('pointercancel', onWindowPointerUp);
    }

    function startAutoScrollLoop() {
      if (autoScrollRaf) return;
      const tick = () => {
        if (!pointerState || pointerState.mode !== 'module-drag') {
          autoScrollRaf = null;
          return;
        }
        const rect = mapWrap.getBoundingClientRect();
        const edge = 46;
        if (lastPointerX < rect.left + edge) {
          const speed = Math.max(3, (rect.left + edge - lastPointerX) * 0.22);
          mapWrap.scrollLeft -= speed;
        } else if (lastPointerX > rect.right - edge) {
          const speed = Math.max(3, (lastPointerX - (rect.right - edge)) * 0.22);
          mapWrap.scrollLeft += speed;
        }
        autoScrollRaf = requestAnimationFrame(tick);
      };
      autoScrollRaf = requestAnimationFrame(tick);
    }

    function onWindowPointerMove(e) {
      if (!pointerState) return;
      const dx = e.clientX - pointerState.startX;
      const dy = e.clientY - pointerState.startY;
      const dist = Math.hypot(dx, dy);
      lastPointerX = e.clientX;

      if (pointerState.mode === 'tap-only') {
        if (dist > 8) pointerState.moved = true;
        return;
      }

      if (pointerState.mode === 'pan' || pointerState.mode === 'pan-or-tap') {
        if (dist > 6) {
          pointerState.moved = true;
          mapWrap.classList.add('panning');
          mapWrap.scrollLeft = pointerState.startScrollLeft - dx;
          mapWrap.scrollTop = pointerState.startScrollTop - dy;
        }
        return;
      }

      if (pointerState.mode === 'module-pending') {
        if (dist < 10) return;

        // 모듈 드래그 시작
        pointerState.mode = 'module-drag';
        pointerState.moved = true;
        selectedKey = pointerState.key;
        pointerState.cellEl.classList.add('dragging-source');

        const ghost = document.getElementById('drag-ghost');
        ghost.style.backgroundColor = pointerState.mod.color;
        ghost.style.color = pointerState.mod.text;
        ghost.style.width = `${pointerState.cellEl.offsetWidth}px`;
        ghost.style.height = `${pointerState.cellEl.offsetHeight}px`;
        document.getElementById('drag-ghost-name').innerText = pointerState.mod.short;
        document.getElementById('drag-ghost-icon').innerHTML = `<i data-lucide="${pointerState.mod.icon}" class="w-4 h-4"></i>`;
        ghost.classList.remove('hidden');
        if (typeof lucide !== 'undefined') lucide.createIcons();

        document.querySelectorAll('.module-cell').forEach(el => {
          const k = el.getAttribute('data-key');
          const m = staged[k];
          if (k !== pointerState.key && m && (m.kind === 'empty' || m.kind === 'movable')) {
            el.classList.add('drop-valid');
          }
        });

        startAutoScrollLoop();
      }

      if (pointerState.mode === 'module-drag') {
        const ghost = document.getElementById('drag-ghost');
        const offsetY = e.pointerType === 'touch' ? 22 : 0;
        ghost.style.left = `${e.clientX}px`;
        ghost.style.top = `${e.clientY - offsetY}px`;

        let foundKey = null;
        const hitY = e.clientY - offsetY;
        const wrapRect = mapWrap.getBoundingClientRect();
        const insideMap = e.clientX >= wrapRect.left && e.clientX <= wrapRect.right && hitY >= wrapRect.top && hitY <= wrapRect.bottom;

        document.querySelectorAll('.module-cell').forEach(el => {
          const rect = el.getBoundingClientRect();
          const k = el.getAttribute('data-key');
          if (insideMap && e.clientX >= rect.left && e.clientX <= rect.right && hitY >= rect.top && hitY <= rect.bottom) {
            foundKey = k;
          }
          el.classList.toggle('drop-hover', k === foundKey && k !== pointerState.key);
        });
        pointerState.hoverKey = foundKey;
      }
    }

    function onWindowPointerUp() {
      if (!pointerState) return;
      window.removeEventListener('pointermove', onWindowPointerMove);
      window.removeEventListener('pointerup', onWindowPointerUp);
      window.removeEventListener('pointercancel', onWindowPointerUp);

      const state = pointerState;
      pointerState = null;

      mapWrap.classList.remove('panning');
      document.getElementById('drag-ghost').classList.add('hidden');
      document.querySelectorAll('.module-cell').forEach(el => {
        el.classList.remove('dragging-source', 'drop-hover');
      });

      if (state.mode === 'module-drag') {
        handleDrop(state.key, state.hoverKey);
      } else if (!state.moved && state.key) {
        handleCellTap(state.key);
      }
    }

    function handleCellTap(key) {
      const tapped = staged[key];
      if (!tapped) return;

      if (selectedKey && staged[selectedKey]?.kind === 'movable') {
        if (selectedKey === key) {
          selectedKey = null;
          renderAll();
          return;
        }
        handleDrop(selectedKey, key);
        return;
      }

      selectedKey = key;
      renderAll();
    }

    function handleDrop(sourceKey, targetKey) {
      if (!targetKey) {
        selectedKey = null;
        showToast('여기에는 놓을 수 없어요', 'error');
        renderAll(null, sourceKey);
        return;
      }
      if (sourceKey === targetKey) {
        renderAll();
        return;
      }

      const target = staged[targetKey];
      if (!target || target.kind === 'locked') {
        showToast('잠긴 칸에는 놓을 수 없어요', 'error');
        renderAll(null, sourceKey);
        return;
      }
      if (target.kind === 'fixed') {
        showToast('고정 시설은 옮길 수 없어요', 'error');
        renderAll(null, sourceKey);
        return;
      }

      const moving = staged[sourceKey];
      staged[targetKey] = moving;
      staged[sourceKey] = target;
      selectedKey = null;

      const affected = getAffectedBelts();
      if (affected.length > 0) {
        showToast(`연결된 벨트 ${affected.length}개가 철거됩니다 (전액 환불)`, 'warn');
      } else {
        showToast(target.kind === 'empty' ? `${moving.name} 이동 완료` : `${moving.name} ↔ ${target.name} 위치 교체`, 'ok');
      }

      renderAll(targetKey, null);
    }

    function clearSelection() {
      selectedKey = null;
      renderAll();
    }

    function resetArrangement() {
      staged = deepClone(original);
      selectedKey = null;
      showToast('배치를 원래대로 되돌렸습니다.');
      renderAll();
    }

    function applyArrangement() {
      const changes = countChanges();
      if (changes === 0) {
        showToast('변경된 모듈 배치가 없습니다.');
        return;
      }

      const affected = getAffectedBelts();
      if (affected.length > 0) {
        const refund = affected.reduce((sum, b) => sum + b.cost, 0);
        gold += refund;
        document.getElementById('hud-gold').innerText = `${gold.toLocaleString()}G`;
        const affectedIds = new Set(affected.map(b => b.id));
        activeBelts = activeBelts.filter(b => !affectedIds.has(b.id));
      }

      original = deepClone(staged);
      selectedKey = null;
      showToast(`모듈 배치 ${changes}건이 부지에 적용되었습니다!`, 'ok');
      renderAll();
    }

    function showToast(text, type = 'info') {
      const toast = document.getElementById('reason-toast');
      const inner = document.getElementById('reason-toast-inner');
      document.getElementById('reason-toast-text').innerText = text;

      if (type === 'error') {
        inner.className = 'flex items-center justify-center gap-1.5 px-3.5 py-2 rounded-full bg-red-950/95 border border-red-400/70 text-red-100 text-xs font-extrabold shadow-2xl';
      } else if (type === 'ok') {
        inner.className = 'flex items-center justify-center gap-1.5 px-3.5 py-2 rounded-full bg-emerald-950/95 border border-emerald-400/70 text-emerald-100 text-xs font-extrabold shadow-2xl';
      } else {
        inner.className = 'flex items-center justify-center gap-1.5 px-3.5 py-2 rounded-full bg-[#2a1a10]/95 border border-amber-400/70 text-amber-100 text-xs font-extrabold shadow-2xl';
      }

      toast.classList.remove('opacity-0', '-translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2200);
    }

    window.addEventListener('resize', () => renderAll());
    window.onload = () => renderAll();
  </script>
</body>
</html>
